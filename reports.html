<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reports - VetClinic</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6fb;
    color: #252d3d;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 30px;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

.header h1 {
    margin: 0;
}

.header p {
    color: #6b7280;
}

.card {
    background: white;
    border-radius: 14px;
    padding: 25px;
    margin-bottom: 25px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.06);
}

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px;
}

.stat {
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    padding: 20px;
}

.stat-label {
    color: #6b7280;
    font-size: 13px;
}

.stat-value {
    font-size: 28px;
    font-weight: 700;
    margin-top: 8px;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th,
td {
    padding: 12px;
    border-bottom: 1px solid #e5e7eb;
    text-align: left;
}

th {
    background: #f9fafb;
}

.empty {
    text-align: center;
    padding: 30px;
    color: #6b7280;
}

.error {
    color: #dc2626;
}

.secondary {
    border: none;
    border-radius: 8px;
    padding: 11px 16px;
    cursor: pointer;
    font-weight: 600;
    background: #e5e7eb;
    color: #374151;
}

@media(max-width:800px) {
    .container {
        padding: 15px;
    }

    .stats {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media(max-width:500px) {
    .stats {
        grid-template-columns: 1fr;
    }
}
</style>

</head>

<body>

<div class="container">

<div class="header">

<div>
<h1>📊 Reports</h1>
<p>VetClinic Management Reports</p>
</div>

<button
class="secondary"
type="button"
onclick="window.location.href='index.html'">
Dashboard
</button>

</div>


<div class="card">

<h2>Overview</h2>

<div class="stats">

<div class="stat">
<div class="stat-label">Total Patients</div>
<div class="stat-value" id="totalPatients">-</div>
</div>

<div class="stat">
<div class="stat-label">Medical Records</div>
<div class="stat-value" id="totalRecords">-</div>
</div>

<div class="stat">
<div class="stat-label">Appointments</div>
<div class="stat-value" id="totalAppointments">-</div>
</div>

<div class="stat">
<div class="stat-label">Paid Revenue</div>
<div class="stat-value" id="totalRevenue">-</div>
</div>

</div>

</div>


<div class="card">

<h2>Species Distribution</h2>

<table>

<thead>
<tr>
<th>Species</th>
<th>Patients</th>
</tr>
</thead>

<tbody id="speciesList">

<tr>
<td colspan="2" class="empty">
Loading...
</td>
</tr>

</tbody>

</table>

</div>


<div class="card">

<h2>Recent Patients</h2>

<table>

<thead>
<tr>
<th>Name</th>
<th>Species</th>
<th>Breed</th>
<th>Created</th>
</tr>
</thead>

<tbody id="recentPatients">

<tr>
<td colspan="4" class="empty">
Loading...
</td>
</tr>

</tbody>

</table>

</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/*
IMPORTANT:
Copy the SUPABASE_URL, SUPABASE_KEY
and createClient section from your
working appointments.html.
*/

const SUPABASE_URL =
"https://zltbjbbofvvndxirlipf.supabase.co";

const SUPABASE_KEY =
"sb_publishable_MWH4JPfiiJ2gvIqYpKE_Yw_UAoAlnFJ";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);
const {
    data: {
        session
    }
} = await supabaseClient.auth.getSession();

if (!session) {
    window.location.href = "login.html";
}


function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


function formatMoney(value) {

    return new Intl.NumberFormat(
        "id-ID",
        {
            style: "currency",
            currency: "IDR",
            maximumFractionDigits: 0
        }
    ).format(
        Number(value || 0)
    );

}


async function loadReports() {

    const patients =
        await supabaseClient
        .from("patients")
        .select(
            "id,name,species,breed,created_at"
        )
        .order(
            "created_at",
            {
                ascending: false
            }
        );


    const records =
        await supabaseClient
        .from("medical_records")
        .select("id");


    const appointments =
        await supabaseClient
        .from("appointments")
        .select("id");


    const invoices =
        await supabaseClient
        .from("invoices")
        .select("total,status");


    if (
        patients.error ||
        records.error ||
        appointments.error ||
        invoices.error
    ) {

        console.error(
            patients.error ||
            records.error ||
            appointments.error ||
            invoices.error
        );

        document.getElementById(
            "totalPatients"
        ).textContent = "Error";

        return;
    }


    document.getElementById(
        "totalPatients"
    ).textContent =
        patients.data.length;


    document.getElementById(
        "totalRecords"
    ).textContent =
        records.data.length;


    document.getElementById(
        "totalAppointments"
    ).textContent =
        appointments.data.length;


    const revenue =
        invoices.data
        .filter(
            invoice =>
                invoice.status === "Paid"
        )
        .reduce(
            (
                sum,
                invoice
            ) =>
                sum +
                Number(
                    invoice.total || 0
                ),
            0
        );


    document.getElementById(
        "totalRevenue"
    ).textContent =
        formatMoney(revenue);


    const species = {};


    patients.data.forEach(
        patient => {

            const speciesName =
                patient.species ||
                "Unknown";

            species[speciesName] =
                (species[speciesName] || 0) + 1;

        }
    );


    const speciesList =
        document.getElementById(
            "speciesList"
        );

    speciesList.innerHTML = "";


    Object.entries(species)
    .sort(
        (a, b) =>
            b[1] - a[1]
    )
    .forEach(
        ([speciesName, count]) => {

            const row =
                document.createElement(
                    "tr"
                );

            row.innerHTML = `
                <td>
                    ${escapeHtml(speciesName)}
                </td>

                <td>
                    ${count}
                </td>
            `;

            speciesList.appendChild(row);

        }
    );


    if (
        speciesList.children.length === 0
    ) {

        speciesList.innerHTML = `
            <tr>
                <td
                    colspan="2"
                    class="empty">
                    No data.
                </td>
            </tr>
        `;

    }


    const recentPatients =
        document.getElementById(
            "recentPatients"
        );

    recentPatients.innerHTML = "";


    patients.data
    .slice(0, 10)
    .forEach(
        patient => {

            const row =
                document.createElement(
                    "tr"
                );

            row.innerHTML = `

                <td>
                    ${escapeHtml(
                        patient.name
                    )}
                </td>

                <td>
                    ${escapeHtml(
                        patient.species
                    )}
                </td>

                <td>
                    ${escapeHtml(
                        patient.breed || "-"
                    )}
                </td>

                <td>
                    ${
                        patient.created_at
                        ? new Date(
                            patient.created_at
                        ).toLocaleDateString(
                            "id-ID"
                        )
                        : "-"
                    }
                </td>

            `;

            recentPatients.appendChild(row);

        }
    );

}


loadReports();

</script>

</body>

</html>
