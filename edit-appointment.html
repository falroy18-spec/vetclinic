<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Edit Appointment - VetClinic</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="app">

    <aside class="sidebar">

        <h1>🐾 VetClinic</h1>

        <nav>

            <a href="index.html">
                Dashboard
            </a>

            <a href="patients.html">
                Patients
            </a>

            <a href="appointments.html"
               class="active">
                Appointments
            </a>

            <a href="medical-records.html">
                Medical Records
            </a>

            <a href="#">
                Medicines
            </a>

            <a href="#">
                Billing
            </a>

            <a href="#">
                Reports
            </a>

        </nav>

    </aside>


    <main class="main-content">

        <header>

            <div>

                <h2>
                    Edit Appointment
                </h2>

                <p>
                    Update appointment information.
                </p>

            </div>

        </header>


        <section class="appointments">

            <h3>
                Appointment Information
            </h3>


            <form id="editAppointmentForm">


                <div class="form-group">

                    <label>
                        Patient
                    </label>

                    <select
                        id="editAppointmentPatient"
                        required
                    >

                        <option value="">
                            Select patient
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>
                        Date
                    </label>

                    <input
                        type="date"
                        id="editAppointmentDate"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Time
                    </label>

                    <input
                        type="time"
                        id="editAppointmentTime"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Veterinarian
                    </label>

                    <input
                        type="text"
                        id="editAppointmentVeterinarian"
                        placeholder="Veterinarian name"
                    >

                </div>


                <div class="form-group">

                    <label>
                        Reason for Visit
                    </label>

                    <textarea
                        id="editAppointmentReason"
                        placeholder="Reason for visit"
                    ></textarea>

                </div>


                <div class="form-group">

                    <label>
                        Status
                    </label>

                    <select
                        id="editAppointmentStatus"
                    >

                        <option value="Scheduled">
                            Scheduled
                        </option>

                        <option value="Completed">
                            Completed
                        </option>

                        <option value="Cancelled">
                            Cancelled
                        </option>

                    </select>

                </div>


                <div class="form-actions">

                    <a
                        href="appointments.html"
                        class="cancel-button"
                    >
                        Cancel
                    </a>


                    <button type="submit">
                        Save Changes
                    </button>

                </div>


            </form>

        </section>

    </main>

</div>


<script src="script.js"></script>

</body>

</html>
