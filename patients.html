<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://zltbjbbofvvndxirlipf.supabase.co";

const SUPABASE_KEY =
"sb_publishable_MWH4JPfiiJ2gvIqYpKE_Yw_UAoAlnFJ";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


// =========================
// ELEMENTS
// =========================

const saveButton =
document.getElementById("saveButton");

const cancelButton =
document.getElementById("cancelButton");

const message =
document.getElementById("message");

const patientList =
document.getElementById("patientList");

const speciesSelect =
document.getElementById("species");

const otherSpeciesContainer =
document.getElementById("otherSpeciesContainer");

const otherSpeciesInput =
document.getElementById("otherSpecies");

const formTitle =
document.getElementById("formTitle");

let editingPatientId = null;


// =========================
// GET CURRENT CLINIC
// =========================

async function getCurrentClinic() {

    const {
        data: sessionData,
        error: sessionError
    } = await supabaseClient.auth.getSession();

    if (sessionError) {
        console.error(sessionError);
        return null;
    }

    const session =
        sessionData.session;

    if (!session) {

        window.location.href =
            "login.html";

        return null;
    }


    const {
        data: membership,
        error: membershipError
    } =
    await supabaseClient
        .from("clinic_members")
        .select("clinic_id")
        .eq(
            "user_id",
            session.user.id
        )
        .maybeSingle();


    if (membershipError) {

        console.error(
            "Membership error:",
            membershipError
        );

        return null;
    }


    if (
        !membership ||
        !membership.clinic_id
    ) {

        alert(
            "Akun ini belum terhubung ke klinik."
        );

        return null;
    }


    return membership.clinic_id;
}


// =========================
// SHOW / HIDE OTHER SPECIES
// =========================

speciesSelect.addEventListener(
    "change",
    function() {

        if (
            speciesSelect.value === "Other"
        ) {

            otherSpeciesContainer.style.display =
                "block";

            otherSpeciesInput.focus();

        } else {

            otherSpeciesContainer.style.display =
                "none";

            otherSpeciesInput.value = "";

        }

    }
);


// =========================
// LOAD PATIENTS
// =========================

async function loadPatients() {

    patientList.innerHTML = `
        <tr>
            <td colspan="6" class="empty">
                Loading patients...
            </td>
        </tr>
    `;


    const clinicId =
        await getCurrentClinic();


    if (!clinicId) {

        patientList.innerHTML = `
            <tr>
                <td colspan="6" class="empty error">
                    Clinic tidak ditemukan.
                </td>
            </tr>
        `;

        return;
    }


    const {
        data,
        error
    } =
    await supabaseClient
        .from("patients")
        .select("*")
        .eq(
            "clinic_id",
            clinicId
        )
        .order(
            "created_at",
            {
                ascending: false
            }
        );


    if (error) {

        console.error(error);

        patientList.innerHTML = `
            <tr>
                <td colspan="6" class="empty error">
                    ${error.message}
                </td>
            </tr>
        `;

        return;
    }


    if (
        !data ||
        data.length === 0
    ) {

        patientList.innerHTML = `
            <tr>
                <td colspan="6" class="empty">
                    No patients yet.
                </td>
            </tr>
        `;

        return;
    }


    patientList.innerHTML = "";


    data.forEach(
        patient => {

            const row =
                document.createElement("tr");


            row.innerHTML = `

                <td>
                    ${patient.name || "-"}
                </td>

                <td>
                    ${patient.species || "-"}
                </td>

                <td>
                    ${patient.breed || "-"}
                </td>

                <td>
                    ${patient.sex || "-"}
                </td>

                <td>
                    ${patient.date_of_birth || "-"}
                </td>

                <td>

                    <div class="action-buttons">

                        <button
                            class="btn-primary"
                            type="button"
                            onclick="editPatient('${patient.id}')">

                            Edit

                        </button>


                        <button
                            class="btn-danger"
                            type="button"
                            onclick="deletePatient('${patient.id}')">

                            Delete

                        </button>

                    </div>

                </td>

            `;


            patientList.appendChild(row);

        }
    );

}


// =========================
// RESET FORM
// =========================

function resetForm() {

    editingPatientId = null;

    formTitle.textContent =
        "Add New Patient";

    saveButton.textContent =
        "Save Patient";

    cancelButton.style.display =
        "none";


    document.getElementById("name").value =
        "";

    speciesSelect.value =
        "";

    otherSpeciesInput.value =
        "";

    otherSpeciesContainer.style.display =
        "none";

    document.getElementById("breed").value =
        "";

    document.getElementById("sex").value =
        "";

    document.getElementById("date_of_birth").value =
        "";

    message.textContent =
        "";

    message.className =
        "message";

}


// =========================
// EDIT PATIENT
// =========================

async function editPatient(id) {

    const {
        data: patient,
        error
    } =
    await supabaseClient
        .from("patients")
        .select("*")
        .eq("id", id)
        .single();


    if (error) {

        alert(
            "Gagal mengambil data patient: " +
            error.message
        );

        return;
    }


    editingPatientId =
        patient.id;


    formTitle.textContent =
        "Edit Patient";

    saveButton.textContent =
        "Update Patient";

    cancelButton.style.display =
        "inline-block";


    document.getElementById("name").value =
        patient.name || "";


    const standardSpecies = [
        "Cat",
        "Dog",
        "Rabbit",
        "Bird"
    ];


    if (
        standardSpecies.includes(
            patient.species
        )
    ) {

        speciesSelect.value =
            patient.species;

        otherSpeciesContainer.style.display =
            "none";

    } else {

        speciesSelect.value =
            "Other";

        otherSpeciesContainer.style.display =
            "block";

        otherSpeciesInput.value =
            patient.species || "";

    }


    document.getElementById("breed").value =
        patient.breed || "";

    document.getElementById("sex").value =
        patient.sex || "";

    document.getElementById("date_of_birth").value =
        patient.date_of_birth || "";


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


// =========================
// SAVE / UPDATE PATIENT
// =========================

saveButton.addEventListener(
    "click",
    async function() {

        const name =
            document
                .getElementById("name")
                .value
                .trim();


        const selectedSpecies =
            speciesSelect.value;


        const otherSpecies =
            otherSpeciesInput
                .value
                .trim();


        const breed =
            document
                .getElementById("breed")
                .value
                .trim();


        const sex =
            document
                .getElementById("sex")
                .value;


        const date_of_birth =
            document
                .getElementById("date_of_birth")
                .value;


        // =========================
        // VALIDATION
        // =========================

        if (
            !name ||
            !selectedSpecies
        ) {

            message.textContent =
                "Patient name dan species wajib diisi.";

            message.className =
                "message error";

            return;
        }


        if (
            selectedSpecies === "Other" &&
            !otherSpecies
        ) {

            message.textContent =
                "Please enter the other species.";

            message.className =
                "message error";

            return;
        }


        const finalSpecies =
            selectedSpecies === "Other"
                ? otherSpecies
                : selectedSpecies;


        saveButton.disabled =
            true;


        message.textContent =
            editingPatientId
                ? "Updating patient..."
                : "Saving patient...";


        message.className =
            "message";


        // =========================
        // GET CLINIC
        // =========================

        const clinicId =
            await getCurrentClinic();


        if (!clinicId) {

            message.textContent =
                "Clinic tidak ditemukan.";

            message.className =
                "message error";

            saveButton.disabled =
                false;

            return;
        }


        // =========================
        // UPDATE
        // =========================

        if (editingPatientId) {

            const {
                error
            } =
            await supabaseClient
                .from("patients")
                .update({

                    name:
                        name,

                    species:
                        finalSpecies,

                    breed:
                        breed || null,

                    sex:
                        sex || null,

                    date_of_birth:
                        date_of_birth || null

                })
                .eq(
                    "id",
                    editingPatientId
                )
                .eq(
                    "clinic_id",
                    clinicId
                );


            if (error) {

                console.error(error);

                message.textContent =
                    "Gagal mengubah: " +
                    error.message;

                message.className =
                    "message error";

                saveButton.disabled =
                    false;

                return;
            }


            message.textContent =
                "Patient berhasil diperbarui!";

            message.className =
                "message success";


            saveButton.disabled =
                false;


            await loadPatients();


            setTimeout(
                function() {
                    resetForm();
                },
                700
            );


            return;
        }


        // =========================
        // INSERT NEW PATIENT
        // =========================

        const {
            error
        } =
        await supabaseClient
            .from("patients")
            .insert({

                clinic_id:
                    clinicId,

                name:
                    name,

                species:
                    finalSpecies,

                breed:
                    breed || null,

                sex:
                    sex || null,

                date_of_birth:
                    date_of_birth || null

            });


        if (error) {

            console.error(error);

            message.textContent =
                "Gagal menyimpan: " +
                error.message;

            message.className =
                "message error";

            saveButton.disabled =
                false;

            return;
        }


        message.textContent =
            "Patient berhasil disimpan!";

        message.className =
            "message success";


        saveButton.disabled =
            false;


        await loadPatients();


        setTimeout(
            function() {
                resetForm();
            },
            700
        );

    }
);


// =========================
// CANCEL EDIT
// =========================

cancelButton.addEventListener(
    "click",
    function() {

        resetForm();

    }
);


// =========================
// DELETE PATIENT
// =========================

async function deletePatient(id) {

    if (
        !confirm(
            "Hapus patient ini?"
        )
    ) {

        return;
    }


    const clinicId =
        await getCurrentClinic();


    if (!clinicId) {

        return;
    }


    const {
        error
    } =
    await supabaseClient
        .from("patients")
        .delete()
        .eq(
            "id",
            id
        )
        .eq(
            "clinic_id",
            clinicId
        );


    if (error) {

        alert(
            "Gagal menghapus: " +
            error.message
        );

        return;
    }


    await loadPatients();

}


// =========================
// INITIALIZE
// =========================

async function init() {

    const clinicId =
        await getCurrentClinic();


    if (!clinicId) {

        return;
    }


    await loadPatients();

}


init();

</script>
