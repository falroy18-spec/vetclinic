<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Patients - VetClinic</title>


<style>

* {
    box-sizing: border-box;
}


body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6fb;
    color: #252d3d;
}


.container {
    max-width: 1200px;
    margin: auto;
    padding: 30px;
}


.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}


.header h1 {
    margin: 0;
}


.header p {
    color: #6b7280;
}


button {
    border: none;
    border-radius: 8px;
    padding: 11px 16px;
    cursor: pointer;
    font-weight: 600;
}


button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}


.btn-primary {
    background: #5146e5;
    color: white;
}


.btn-secondary {
    background: #6b7280;
    color: white;
}


.btn-danger {
    background: #dc2626;
    color: white;
}


.card {
    background: white;
    border-radius: 14px;
    padding: 25px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.06);
    margin-bottom: 25px;
}


.form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
}


.form-full {
    grid-column: 1 / -1;
}


label {
    display: block;
    margin-bottom: 7px;
    font-weight: 600;
}


input,
select,
textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 14px;
    font-family: Arial, sans-serif;
}


textarea {
    min-height: 90px;
    resize: vertical;
}


.other-species {
    display: none;
}


.form-actions {
    margin-top: 20px;
    display: flex;
    gap: 10px;
}


table {
    width: 100%;
    border-collapse: collapse;
}


th,
td {
    padding: 14px;
    border-bottom: 1px solid #e5e7eb;
    text-align: left;
    vertical-align: top;
}


th {
    background: #f9fafb;
}


.action-buttons {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}


.empty {
    text-align: center;
    padding: 30px;
    color: #6b7280;
}


.message {
    margin-top: 15px;
    font-size: 14px;
}


.error {
    color: #dc2626;
}


.success {
    color: #16a34a;
}


.owner-address {
    max-width: 250px;
    white-space: normal;
}


@media(max-width:700px) {

    .form-grid {
        grid-template-columns: 1fr;
    }

    .form-full {
        grid-column: auto;
    }

    .container {
        padding: 15px;
    }

    table {
        font-size: 13px;
        min-width: 900px;
    }

    .card {
        overflow-x: auto;
    }

}

</style>

</head>


<body>


<div class="container">


<!-- HEADER -->

<div class="header">

<div>

<h1>🐾 Patients</h1>

<p>
VetClinic Patient Management
</p>

</div>


<button
class="btn-primary"
type="button"
onclick="window.location.href='index.html'"
>

Dashboard

</button>

</div>



<!-- ADD / EDIT PATIENT -->

<div class="card">


<h2 id="formTitle">
Add New Patient
</h2>


<div class="form-grid">


<!-- PATIENT NAME -->

<div>

<label for="name">
Patient Name
</label>

<input
id="name"
type="text"
placeholder="e.g. Milo"
>

</div>



<!-- SPECIES -->

<div>

<label for="species">
Species
</label>

<select id="species">

<option value="">
Select species
</option>

<option value="Cat">
Cat
</option>

<option value="Dog">
Dog
</option>

<option value="Rabbit">
Rabbit
</option>

<option value="Bird">
Bird
</option>

<option value="Other">
Other
</option>

</select>

</div>



<!-- OTHER SPECIES -->

<div
id="otherSpeciesContainer"
class="other-species"
>

<label for="otherSpecies">
Other Species
</label>

<input
id="otherSpecies"
type="text"
placeholder="e.g. Hamster, Turtle"
>

</div>



<!-- BREED -->

<div>

<label for="breed">
Breed
</label>

<input
id="breed"
type="text"
placeholder="e.g. Domestic Shorthair"
>

</div>



<!-- SEX -->

<div>

<label for="sex">
Sex
</label>

<select id="sex">

<option value="">
Select sex
</option>

<option value="Male">
Male
</option>

<option value="Female">
Female
</option>

</select>

</div>



<!-- DATE OF BIRTH -->

<div>

<label for="date_of_birth">
Date of Birth
</label>

<input
id="date_of_birth"
type="date"
>

</div>



<!-- WEIGHT -->

<div>

<label for="weight">
Weight (kg)
</label>

<input
id="weight"
type="number"
step="0.01"
placeholder="e.g. 4.5"
>

</div>



<!-- OWNER NAME -->

<div>

<label for="owner">
Owner Name
</label>

<input
id="owner"
type="text"
placeholder="e.g. Faisa"
>

</div>



<!-- OWNER PHONE -->

<div>

<label for="owner_phone">
Phone Number
</label>

<input
id="owner_phone"
type="tel"
placeholder="e.g. 08123456789"
>

</div>



<!-- OWNER ADDRESS -->

<div class="form-full">

<label for="owner_address">
Owner Address
</label>

<textarea
id="owner_address"
placeholder="Enter owner's address"
></textarea>

</div>


</div>



<div class="form-actions">


<button
class="btn-primary"
id="saveButton"
type="button"
>

Save Patient

</button>


<button
class="btn-secondary"
id="cancelButton"
type="button"
style="display:none;"
>

Cancel Edit

</button>


</div>


<div
id="message"
class="message"
>
</div>


</div>



<!-- PATIENT LIST -->

<div class="card">


<h2>
Patient List
</h2>


<table>

<thead>

<tr>

<th>
Name
</th>

<th>
Species
</th>

<th>
Breed
</th>

<th>
Sex
</th>

<th>
Date of Birth
</th>

<th>
Owner
</th>

<th>
Phone
</th>

<th>
Address
</th>

<th>
Action
</th>

</tr>

</thead>


<tbody id="patientList">
</tbody>


</table>


</div>


</div>



<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>



<script>


// ========================================
// SUPABASE
// ========================================

const SUPABASE_URL =
"https://zltbjbbofvvndxirlipf.supabase.co";


const SUPABASE_KEY =
"sb_publishable_MWH4JPfiiJ2gvIqYpKE_Yw_UAoAlnFJ";


const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);



// ========================================
// ELEMENTS
// ========================================

const saveButton =
document.getElementById(
    "saveButton"
);


const cancelButton =
document.getElementById(
    "cancelButton"
);


const message =
document.getElementById(
    "message"
);


const patientList =
document.getElementById(
    "patientList"
);


const speciesSelect =
document.getElementById(
    "species"
);


const otherSpeciesContainer =
document.getElementById(
    "otherSpeciesContainer"
);


const otherSpeciesInput =
document.getElementById(
    "otherSpecies"
);


const formTitle =
document.getElementById(
    "formTitle"
);


let editingPatientId = null;



// ========================================
// GET CURRENT CLINIC
// ========================================

async function getCurrentClinic() {


    const {
        data: sessionData,
        error: sessionError
    } =
    await supabaseClient
        .auth
        .getSession();


    if (sessionError) {

        console.error(
            "Session error:",
            sessionError
        );

        return null;

    }


    const session =
    sessionData.session;


    if (!session) {

        window.location.href =
        "login.html";

        return null;

    }


    const {
        data: membership,
        error: membershipError
    } =
    await supabaseClient
        .from("clinic_members")
        .select("clinic_id")
        .eq(
            "user_id",
            session.user.id
        )
        .maybeSingle();


    if (membershipError) {

        console.error(
            "Clinic membership error:",
            membershipError
        );

        message.textContent =
        "Gagal mendapatkan klinik: " +
        membershipError.message;

        message.className =
        "message error";

        return null;

    }


    if (
        !membership ||
        !membership.clinic_id
    ) {

        message.textContent =
        "Akun ini belum terhubung ke klinik.";

        message.className =
        "message error";

        return null;

    }


    return membership.clinic_id;

}



// ========================================
// SPECIES
// ========================================

speciesSelect.addEventListener(
    "change",
    function() {


        if (
            speciesSelect.value ===
            "Other"
        ) {

            otherSpeciesContainer.style.display =
            "block";

            otherSpeciesInput.focus();

        }

        else {

            otherSpeciesContainer.style.display =
            "none";

            otherSpeciesInput.value =
            "";

        }

    }
);



// ========================================
// LOAD PATIENTS
// ========================================

async function loadPatients() {


    patientList.innerHTML = `

        <tr>

            <td
                colspan="9"
                class="empty"
            >

                Loading patients...

            </td>

        </tr>

    `;


    const clinicId =
    await getCurrentClinic();


    if (!clinicId) {

        return;

    }


    const {
        data,
        error
    } =
    await supabaseClient
        .from("patients")
        .select("*")
        .eq(
            "clinic_id",
            clinicId
        )
        .order(
            "created_at",
            {
                ascending: false
            }
        );


    if (error) {

        console.error(
            "Load patients error:",
            error
        );


        patientList.innerHTML = `

            <tr>

                <td
                    colspan="9"
                    class="empty error"
                >

                    ${error.message}

                </td>

            </tr>

        `;

        return;

    }


    if (
        !data ||
        data.length === 0
    ) {

        patientList.innerHTML = `

            <tr>

                <td
                    colspan="9"
                    class="empty"
                >

                    No patients yet.

                </td>

            </tr>

        `;

        return;

    }


    patientList.innerHTML =
    "";


    data.forEach(
        function(patient) {


            const row =
            document.createElement(
                "tr"
            );


            row.innerHTML = `

                <td>
                    ${patient.name || "-"}
                </td>

                <td>
                    ${patient.species || "-"}
                </td>

                <td>
                    ${patient.breed || "-"}
                </td>

                <td>
                    ${patient.sex || "-"}
                </td>

                <td>
                    ${patient.date_of_birth || "-"}
                </td>

                <td>
                    ${patient.owner || "-"}
                </td>

                <td>
                    ${patient.owner_phone || "-"}
                </td>

                <td class="owner-address">
                    ${patient.owner_address || "-"}
                </td>

                <td>

                    <div class="action-buttons">

                        <button
                            class="btn-primary"
                            type="button"
                            onclick="editPatient('${patient.id}')"
                        >
                            Edit
                        </button>


                        <button
                            class="btn-danger"
                            type="button"
                            onclick="deletePatient('${patient.id}')"
                        >
                            Delete
                        </button>

                    </div>

                </td>

            `;


            patientList.appendChild(
                row
            );

        }
    );

}



// ========================================
// RESET FORM
// ========================================

function resetForm() {


    editingPatientId =
    null;


    formTitle.textContent =
    "Add New Patient";


    saveButton.textContent =
    "Save Patient";


    cancelButton.style.display =
    "none";


    document.getElementById(
        "name"
    ).value =
    "";


    speciesSelect.value =
    "";


    otherSpeciesInput.value =
    "";


    otherSpeciesContainer.style.display =
    "none";


    document.getElementById(
        "breed"
    ).value =
    "";


    document.getElementById(
        "sex"
    ).value =
    "";


    document.getElementById(
        "date_of_birth"
    ).value =
    "";


    document.getElementById(
        "weight"
    ).value =
    "";


    document.getElementById(
        "owner"
    ).value =
    "";


    document.getElementById(
        "owner_phone"
    ).value =
    "";


    document.getElementById(
        "owner_address"
    ).value =
    "";


    message.textContent =
    "";


    message.className =
    "message";

}



// ========================================
// EDIT PATIENT
// ========================================

async function editPatient(id) {


    const clinicId =
    await getCurrentClinic();


    if (!clinicId) {

        return;

    }


    const {
        data: patient,
        error
    } =
    await supabaseClient
        .from("patients")
        .select("*")
        .eq(
            "id",
            id
        )
        .eq(
            "clinic_id",
            clinicId
        )
        .single();


    if (error) {

        alert(
            "Gagal mengambil data patient: " +
            error.message
        );

        return;

    }


    editingPatientId =
    patient.id;


    formTitle.textContent =
    "Edit Patient";


    saveButton.textContent =
    "Update Patient";


    cancelButton.style.display =
    "inline-block";


    document.getElementById(
        "name"
    ).value =
    patient.name || "";


    const standardSpecies = [
        "Cat",
        "Dog",
        "Rabbit",
        "Bird"
    ];


    if (
        standardSpecies.includes(
            patient.species
        )
    ) {

        speciesSelect.value =
        patient.species;


        otherSpeciesContainer.style.display =
        "none";

    }

    else {

        speciesSelect.value =
        "Other";


        otherSpeciesContainer.style.display =
        "block";


        otherSpeciesInput.value =
        patient.species || "";

    }


    document.getElementById(
        "breed"
    ).value =
    patient.breed || "";


    document.getElementById(
        "sex"
    ).value =
    patient.sex || "";


    document.getElementById(
        "date_of_birth"
    ).value =
    patient.date_of_birth || "";


    document.getElementById(
        "weight"
    ).value =
    patient.weight || "";


    document.getElementById(
        "owner"
    ).value =
    patient.owner || "";


    document.getElementById(
        "owner_phone"
    ).value =
    patient.owner_phone || "";


    document.getElementById(
        "owner_address"
    ).value =
    patient.owner_address || "";


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}



// ========================================
// SAVE / UPDATE PATIENT
// ========================================

saveButton.addEventListener(
    "click",
    async function() {


        const name =
        document.getElementById(
            "name"
        ).value.trim();


        const selectedSpecies =
        speciesSelect.value;


        const otherSpecies =
        otherSpeciesInput
            .value
            .trim();


        const breed =
        document.getElementById(
            "breed"
        ).value.trim();


        const sex =
        document.getElementById(
            "sex"
        ).value;


        const date_of_birth =
        document.getElementById(
            "date_of_birth"
        ).value;


        const weight =
        document.getElementById(
            "weight"
        ).value;


        const owner =
        document.getElementById(
            "owner"
        ).value.trim();


        const owner_phone =
        document.getElementById(
            "owner_phone"
        ).value.trim();


        const owner_address =
        document.getElementById(
            "owner_address"
        ).value.trim();



        // VALIDATION

        if (
            !name ||
            !selectedSpecies ||
            !owner
        ) {

            message.textContent =
            "Patient name, species, dan owner wajib diisi.";

            message.className =
            "message error";

            return;

        }


        if (
            selectedSpecies === "Other" &&
            !otherSpecies
        ) {

            message.textContent =
            "Please enter the other species.";

            message.className =
            "message error";

            otherSpeciesInput.focus();

            return;

        }


        const finalSpecies =
        selectedSpecies === "Other"
            ? otherSpecies
            : selectedSpecies;



        saveButton.disabled =
        true;


        message.textContent =
        editingPatientId
            ? "Updating patient..."
            : "Saving patient...";


        message.className =
        "message";



        // ========================================
        // GET CLINIC
        // ========================================

        const clinicId =
        await getCurrentClinic();


        if (!clinicId) {

            saveButton.disabled =
            false;

            return;

        }



        // ========================================
        // UPDATE
        // ========================================

        if (editingPatientId) {


            const {
                error
            } =
            await supabaseClient
                .from("patients")
                .update({

                    name:
                    name,

                    species:
                    finalSpecies,

                    breed:
                    breed || null,

                    sex:
                    sex || null,

                    date_of_birth:
                    date_of_birth || null,

                    weight:
                    weight
                        ? Number(weight)
                        : null,

                    owner:
                    owner,

                    owner_phone:
                    owner_phone || null,

                    owner_address:
                    owner_address || null

                })
                .eq(
                    "id",
                    editingPatientId
                )
                .eq(
                    "clinic_id",
                    clinicId
                );


            if (error) {

                console.error(
                    "Update patient error:",
                    error
                );


                message.textContent =
                "Gagal mengubah: " +
                error.message;


                message.className =
                "message error";


                saveButton.disabled =
                false;


                return;

            }


            message.textContent =
            "Patient berhasil diperbarui!";


            message.className =
            "message success";


            await loadPatients();


            saveButton.disabled =
            false;


            setTimeout(
                function() {

                    resetForm();

                },
                700
            );


            return;

        }



        // ========================================
        // INSERT NEW PATIENT
        // ========================================

        const {
            data,
            error
        } =
        await supabaseClient
            .from("patients")
            .insert({

                // IMPORTANT
                // INI YANG MEMBUAT
                // PATIENT MASUK KE KLINIK
                // USER YANG LOGIN

                clinic_id:
                clinicId,

                name:
                name,

                species:
                finalSpecies,

                breed:
                breed || null,

                sex:
                sex || null,

                date_of_birth:
                date_of_birth || null,

                weight:
                weight
                    ? Number(weight)
                    : null,

                owner:
                owner,

                owner_phone:
                owner_phone || null,

                owner_address:
                owner_address || null

            })
            .select("*")
            .single();



        if (error) {

            console.error(
                "Insert patient error:",
                error
            );


            message.textContent =
            "Gagal menyimpan: " +
            error.message;


            message.className =
            "message error";


            saveButton.disabled =
            false;


            return;

        }



        // ========================================
        // VERIFY CLINIC ID
        // ========================================

        console.log(
            "NEW PATIENT:",
            data
        );


        console.log(
            "CLINIC ID:",
            data.clinic_id
        );


        message.textContent =
        "Patient berhasil disimpan!";


        message.className =
        "message success";


        await loadPatients();


        saveButton.disabled =
        false;


        setTimeout(
            function() {

                resetForm();

            },
            700
        );

    }
);



// ========================================
// CANCEL EDIT
// ========================================

cancelButton.addEventListener(
    "click",
    function() {

        resetForm();

    }
);



// ========================================
// DELETE PATIENT
// ========================================

async function deletePatient(id) {


    if (
        !confirm(
            "Hapus patient ini?"
        )
    ) {

        return;

    }


    const clinicId =
    await getCurrentClinic();


    if (!clinicId) {

        return;

    }


    const {
        error
    } =
    await supabaseClient
        .from("patients")
        .delete()
        .eq(
            "id",
            id
        )
        .eq(
            "clinic_id",
            clinicId
        );


    if (error) {

        alert(
            "Gagal menghapus: " +
            error.message
        );

        return;

    }


    await loadPatients();

}



// ========================================
// INITIALIZE
// ========================================

async function init() {


    const clinicId =
    await getCurrentClinic();


    if (!clinicId) {

        return;

    }


    await loadPatients();

}


init();


</script>


</body>

</html>
