<body>

<main class="main-content">

<section class="appointments">

<div style="
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;

type="button"

</button>

<table>

<thead>

<th>Species</th>

<th>Breed</th>

<th>Action</th>

</tr>

</thead>


<tbody id="patientList">

<tr>

<td
colspan="6"
class="empty"
>
Loading patients...

</tr>

<div id="patientFormContainer" style="display:none;">

<h3 id="formTitle">
Add New Patient
</h3>


<form id="patientForm">


<div class="form-group">

<label>Patient Name</label>

type="text"
id="name"

>

<label>Species</label>

<select
id="species"
required
>

<option value="">

</option>

<option value="Cat">
Cat
</option>

<option value="Dog">
Dog
</option>

<option value="Rabbit">
Rabbit
</option>

<option value="Bird">
Bird
</option>

<option value="Other">
Other
</option>

</select>

</div>


<div
id="otherSpeciesContainer"
style="display:none;"
class="form-group"
>

<label>Other Species</label>

<input
type="text"
id="otherSpecies"
>

</div>


<div class="form-group">

<label>Breed</label>

<input
type="text"
id="breed"
>

</div>


<div class="form-group">

<label>Sex</label>

<select id="sex">

<option value="">
Select sex
</option>

<option value="Male">
Male
</option>

<option value="Female">
Female
</option>

</select>

</div>


<div class="form-group">

<label>Date of Birth</label>

<input
type="date"
id="date_of_birth"
>

</div>


<div class="form-actions">

<button
type="button"
id="cancelButton"
>
Cancel
</button>

<button
type="submit"
id="saveButton"
class="btn-primary"
>
Save Patient
</button>

</div>


</form>

</div>

</section>

</main>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


const SUPABASE_URL =
"https://zltbjbbofvvndxirlipf.supabase.co";


const SUPABASE_KEY =
"sb_publishable_MWH4JPfiiJ2gvIqYpKE_Yw_UAoAlnFJ";


const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


// ========================================
// ELEMENTS
// ========================================

const saveButton =
document.getElementById(
    "saveButton"
);

const cancelButton =
document.getElementById(
    "cancelButton"
);

const newPatientButton =
document.getElementById(
    "newPatientButton"
);

const patientFormContainer =
document.getElementById(
    "patientFormContainer"
);

const patientForm =
document.getElementById(
    "patientForm"
);

const message =
document.getElementById(
    "message"
);

const patientList =
document.getElementById(
    "patientList"
);

const speciesSelect =
document.getElementById(
    "species"
);

const otherSpeciesContainer =
document.getElementById(
    "otherSpeciesContainer"
);

const otherSpeciesInput =
document.getElementById(
    "otherSpecies"
);

const formTitle =
document.getElementById(
    "formTitle"
);


let editingPatientId = null;


// ========================================
// GET CURRENT CLINIC
// ========================================

async function getCurrentClinic() {

    const {
        data: sessionData,
        error: sessionError
    } =
    await supabaseClient
        .auth
        .getSession();


    if (sessionError) {

        console.error(
            "Session error:",
            sessionError
        );

        return null;

    }


    const session =
    sessionData.session;


    if (!session) {

        window.location.href =
        "login.html";

        return null;

    }


    console.log(
        "LOGIN USER:",
        session.user.id
    );


    const {
        data: membership,
        error: membershipError
    } =
    await supabaseClient
        .from("clinic_members")
        .select("clinic_id")
        .eq(
            "user_id",
            session.user.id
        )
        .maybeSingle();


    if (membershipError) {

        console.error(
            "MEMBERSHIP ERROR:",
            membershipError
        );

        message.textContent =
        membershipError.message;

        message.className =
        "message error";

        return null;

    }


    console.log(
        "MEMBERSHIP:",
        membership
    );


    if (
        !membership ||
        !membership.clinic_id
    ) {

        message.textContent =
        "Akun belum terhubung ke klinik.";

        message.className =
        "message error";

        return null;

    }


    console.log(
        "CURRENT CLINIC:",
        membership.clinic_id
    );


    return membership.clinic_id;

}


// ========================================
// LOAD PATIENTS
// ========================================

async function loadPatients() {

    patientList.innerHTML = `
        <tr>
            <td
                colspan="6"
                class="empty"
            >
                Loading patients...
            </td>
        </tr>
    `;


    const clinicId =
    await getCurrentClinic();


    if (!clinicId) {

        return;

    }


    const {
        data,
        error
    } =
    await supabaseClient
        .from("patients")
        .select("*")
        .eq(
            "clinic_id",
            clinicId
        )
        .order(
            "created_at",
            {
                ascending:false
            }
        );


    if (error) {

        console.error(
            "LOAD PATIENT ERROR:",
            error
        );

        patientList.innerHTML = `
            <tr>
                <td
                    colspan="6"
                    class="empty error"
                >
                    ${error.message}
                </td>
            </tr>
        `;

        return;

    }


    if (
        !data ||
        data.length === 0
    ) {

        patientList.innerHTML = `
            <tr>
                <td
                    colspan="6"
                    class="empty"
                >
                    No patients yet.
                </td>
            </tr>
        `;

        return;

    }


    patientList.innerHTML = "";


    data.forEach(
        function(patient) {

            const row =
            document.createElement(
                "tr"
            );


            row.innerHTML = `

                <td>
                    ${patient.name || "-"}
                </td>

                <td>
                    ${patient.species || "-"}
                </td>

                <td>
                    ${patient.breed || "-"}
                </td>

                <td>
                    ${patient.sex || "-"}
                </td>

                <td>
                    ${patient.date_of_birth || "-"}
                </td>

                <td>

                    <button
                        type="button"
                        onclick="editPatient('${patient.id}')"
                    >
                        Edit
                    </button>

                    <button
                        type="button"
                        onclick="deletePatient('${patient.id}')"
                    >
                        Delete
                    </button>

                </td>

            `;


            patientList.appendChild(
                row
            );

        }
    );

}


// ========================================
// OPEN ADD PATIENT
// ========================================

newPatientButton.addEventListener(
    "click",
    function() {

        patientFormContainer.style.display =
        "block";

        formTitle.textContent =
        "Add New Patient";

        editingPatientId =
        null;

        patientForm.reset();

        message.textContent =
        "";

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    }
);


// ========================================
// SPECIES
// ========================================

speciesSelect.addEventListener(
    "change",
    function() {

        if (
            speciesSelect.value ===
            "Other"
        ) {

            otherSpeciesContainer.style.display =
            "block";

        } else {

            otherSpeciesContainer.style.display =
            "none";

            otherSpeciesInput.value =
            "";

        }

    }
);


// ========================================
// SAVE PATIENT
// ========================================

patientForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        saveButton.disabled =
        true;

        saveButton.textContent =
        "Saving...";


        message.textContent =
        "";


        const name =
        document
            .getElementById("name")
            .value
            .trim();


        const selectedSpecies =
        speciesSelect.value;


        const otherSpecies =
        otherSpeciesInput
            .value
            .trim();


        const breed =
        document
            .getElementById("breed")
            .value
            .trim();


        const sex =
        document
            .getElementById("sex")
            .value;


        const date_of_birth =
        document
            .getElementById("date_of_birth")
            .value;


        if (
            !name ||
            !selectedSpecies
        ) {

            message.textContent =
            "Patient name dan species wajib diisi.";

            message.className =
            "message error";

            saveButton.disabled =
            false;

            saveButton.textContent =
            "Save Patient";

            return;

        }


        const finalSpecies =
        selectedSpecies === "Other"
            ? otherSpecies
            : selectedSpecies;


        if (
            selectedSpecies === "Other" &&
            !finalSpecies
        ) {

            message.textContent =
            "Masukkan species.";

            message.className =
            "message error";

            saveButton.disabled =
            false;

            saveButton.textContent =
            "Save Patient";

            return;

        }


        // ========================================
        // GET CLINIC
        // ========================================

        const clinicId =
        await getCurrentClinic();


        if (!clinicId) {

            saveButton.disabled =
            false;

            saveButton.textContent =
            "Save Patient";

            return;

        }


        console.log(
            "INSERTING WITH CLINIC ID:",
            clinicId
        );


        // ========================================
        // INSERT
        // ========================================

        if (!editingPatientId) {

            const {
                data,
                error
            } =
            await supabaseClient
                .from("patients")
                .insert({

                    clinic_id:
                    clinicId,

                    name:
                    name,

                    species:
                    finalSpecies,

                    breed:
                    breed || null,

                    sex:
                    sex || null,

                    date_of_birth:
                    date_of_birth || null

                })
                .select("*")
                .single();


            if (error) {

                console.error(
                    "INSERT ERROR:",
                    error
                );

                message.textContent =
                "Gagal menyimpan: " +
                error.message;

                message.className =
                "message error";

                saveButton.disabled =
                false;

                saveButton.textContent =
                "Save Patient";

                return;

            }


            console.log(
                "INSERT RESULT:",
                data
            );


            // VERY IMPORTANT

            if (
                !data ||
                data.clinic_id !== clinicId
            ) {

                console.error(
                    "CLINIC ID MISMATCH",
                    {
                        sent: clinicId,
                        returned:
                        data
                            ? data.clinic_id
                            : null
                    }
                );


                message.textContent =
                "Patient tersimpan tetapi clinic_id tidak sesuai.";

                message.className =
                "message error";

                saveButton.disabled =
                false;

                saveButton.textContent =
                "Save Patient";

                return;

            }

        }


        // ========================================
        // UPDATE
        // ========================================

        else {

            const {
                error
            } =
            await supabaseClient
                .from("patients")
                .update({

                    name:
                    name,

                    species:
                    finalSpecies,

                    breed:
                    breed || null,

                    sex:
                    sex || null,

                    date_of_birth:
                    date_of_birth || null

                })
                .eq(
                    "id",
                    editingPatientId
                )
                .eq(
                    "clinic_id",
                    clinicId
                );


            if (error) {

                console.error(
                    "UPDATE ERROR:",
                    error
                );

                message.textContent =
                error.message;

                message.className =
                "message error";

                saveButton.disabled =
                false;

                saveButton.textContent =
                "Update Patient";

                return;

            }

        }


        // ========================================
        // SUCCESS
        // ========================================

        message.textContent =
        "Patient berhasil disimpan!";

        message.className =
        "message success";


        patientForm.reset();

        editingPatientId =
        null;


        await loadPatients();


        saveButton.disabled =
        false;

        saveButton.textContent =
        "Save Patient";


        patientFormContainer.style.display =
        "none";

    }
);


// ========================================
// CANCEL
// ========================================

cancelButton.addEventListener(
    "click",
    function() {

        patientForm.reset();

        editingPatientId =
        null;

        patientFormContainer.style.display =
        "none";

        message.textContent =
        "";

    }
);


// ========================================
// EDIT
// ========================================

async function editPatient(id) {

    const clinicId =
    await getCurrentClinic();


    if (!clinicId) {
        return;
    }


    const {
        data: patient,
        error
    } =
    await supabaseClient
        .from("patients")
        .select("*")
        .eq(
            "id",
            id
        )
        .eq(
            "clinic_id",
            clinicId
        )
        .single();


    if (error) {

        alert(
            "Patient tidak ditemukan."
        );

        return;

    }


    editingPatientId =
    patient.id;


    formTitle.textContent =
    "Edit Patient";


    patientFormContainer.style.display =
    "block";


    document.getElementById(
        "name"
    ).value =
    patient.name || "";


    speciesSelect.value =
    patient.species || "";


    document.getElementById(
        "breed"
    ).value =
    patient.breed || "";


    document.getElementById(
        "sex"
    ).value =
    patient.sex || "";


    document.getElementById(
        "date_of_birth"
    ).value =
    patient.date_of_birth || "";


    saveButton.textContent =
    "Update Patient";


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


// ========================================
// DELETE
// ========================================

async function deletePatient(id) {

    if (
        !confirm(
            "Hapus patient ini?"
        )
    ) {

        return;

    }


    const clinicId =
    await getCurrentClinic();


    if (!clinicId) {
        return;
    }


    const {
        error
    } =
    await supabaseClient
        .from("patients")
        .delete()
        .eq(
            "id",
            id
        )
        .eq(
            "clinic_id",
            clinicId
        );


    if (error) {

        alert(
            "Gagal menghapus: " +
            error.message
        );

        return;

    }


    await loadPatients();

}


// ========================================
// INITIALIZE
// ========================================

loadPatients();

</script>

</body>

</html>
