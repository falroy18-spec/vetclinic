<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - VetClinic</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 440px;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            margin: 0;
            font-size: 28px;
            color: #252d3d;
        }

        .logo p {
            color: #6b7280;
            margin-bottom: 0;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 15px;
        }

        .show-password {
            display: flex;
            align-items: center;
            gap: 7px;
            margin-bottom: 18px;
            font-size: 14px;
            font-weight: normal;
            color: #4b5563;
            cursor: pointer;
        }

        .show-password input {
            width: auto;
            margin: 0;
            cursor: pointer;
        }

        button {
            width: 100%;
            border: none;
            padding: 14px;
            border-radius: 8px;
            background: #5146e5;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
        }

        .back-login {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #5146e5;
            font-size: 14px;
            text-decoration: none;
        }

        .back-login:hover {
            text-decoration: underline;
        }

        #message {
            margin-top: 18px;
            text-align: center;
            font-size: 14px;
            line-height: 1.5;
        }

        .error {
            color: #dc2626;
        }

        .success {
            color: #16a34a;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="card">

        <div class="logo">

            <h1>🐾 VetClinic</h1>

            <p>Create Clinic Account</p>

        </div>


        <label for="clinicName">
            Clinic Name
        </label>

        <input
            type="text"
            id="clinicName"
            placeholder="Enter clinic name"
            autocomplete="organization"
        >


        <label for="email">
            Email
        </label>

        <input
            type="email"
            id="email"
            placeholder="Enter clinic email"
            autocomplete="email"
        >


        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Create password"
            autocomplete="new-password"
        >


        <label class="show-password">

            <input
                type="checkbox"
                id="showPassword"
            >

            Show password

        </label>


        <label for="confirmPassword">
            Confirm Password
        </label>

        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm password"
            autocomplete="new-password"
        >


        <label class="show-password">

            <input
                type="checkbox"
                id="showConfirmPassword"
            >

            Show confirm password

        </label>


        <button
            id="registerButton"
            type="button">
            Register
        </button>


        <a
            href="login.html"
            class="back-login">
            Already have an account? Login
        </a>


        <div id="message"></div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

const SUPABASE_URL =
"https://zltbjbbofvvndxirlipf.supabase.co";


const SUPABASE_KEY =
"sb_publishable_MWH4JPfiiJ2gvIqYpKE_Yw_UAoAlnFJ";


const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


const clinicNameInput =
document.getElementById("clinicName");

const emailInput =
document.getElementById("email");

const passwordInput =
document.getElementById("password");

const confirmPasswordInput =
document.getElementById("confirmPassword");

const showPassword =
document.getElementById("showPassword");

const showConfirmPassword =
document.getElementById("showConfirmPassword");

const registerButton =
document.getElementById("registerButton");

const message =
document.getElementById("message");


/* =========================
   SHOW PASSWORD
========================= */

showPassword.addEventListener(
    "change",
    function() {

        if (showPassword.checked) {

            passwordInput.type =
                "text";

        } else {

            passwordInput.type =
                "password";

        }

    }
);


/* =========================
   SHOW CONFIRM PASSWORD
========================= */

showConfirmPassword.addEventListener(
    "change",
    function() {

        if (showConfirmPassword.checked) {

            confirmPasswordInput.type =
                "text";

        } else {

            confirmPasswordInput.type =
                "password";

        }

    }
);


/* =========================
   REGISTER
========================= */

registerButton.addEventListener(
    "click",
    async function() {

        const clinicName =
            clinicNameInput.value.trim();

        const email =
            emailInput.value.trim();

        const password =
            passwordInput.value;

        const confirmPassword =
            confirmPasswordInput.value;


        if (
            !clinicName ||
            !email ||
            !password ||
            !confirmPassword
        ) {

            message.textContent =
                "Semua field wajib diisi.";

            message.className =
                "error";

            return;
        }


        if (password.length < 6) {

            message.textContent =
                "Password minimal 6 karakter.";

            message.className =
                "error";

            return;
        }


        if (password !== confirmPassword) {

            message.textContent =
                "Password dan konfirmasi password tidak sama.";

            message.className =
                "error";

            return;
        }


        message.textContent =
            "Creating clinic account...";

        message.className = "";

        registerButton.disabled = true;


        try {

            /*
             * STEP 1
             * Membuat akun Supabase
             */

            const {
                data,
                error
            } =
            await supabaseClient.auth.signUp({

                email: email,

                password: password,

                options: {

                    emailRedirectTo:
                        "https://falroy18-spec.github.io/vetclinic/login.html"

                }

            });


            if (error) {

                console.error(error);

                message.textContent =
                    "Registrasi gagal: " +
                    error.message;

                message.className =
                    "error";

                registerButton.disabled =
                    false;

                return;
            }


            if (!data.user) {

                message.textContent =
                    "Registrasi gagal. User tidak berhasil dibuat.";

                message.className =
                    "error";

                registerButton.disabled =
                    false;

                return;
            }


            /*
             * STEP 2
             * Jika email confirmation aktif,
             * user belum mendapatkan session.
             */

            if (!data.session) {

                message.textContent =
                    "Akun berhasil dibuat! Silakan cek email untuk konfirmasi akun.";

                message.className =
                    "success";

                registerButton.disabled =
                    false;

                return;
            }


            /*
             * STEP 3
             * Membuat klinik dan owner
             * melalui database function.
             */

            const {
                data: clinic,
                error: clinicError
            } =
            await supabaseClient
            .rpc(
                "create_clinic_for_current_user",
                {
                    p_clinic_name:
                        clinicName
                }
            );


            if (clinicError) {

                console.error(
                    "Create clinic error:",
                    clinicError
                );

                message.textContent =
                    "Akun berhasil dibuat, tetapi klinik gagal dibuat: " +
                    clinicError.message;

                message.className =
                    "error";

                registerButton.disabled =
                    false;

                return;
            }


            console.log(
                "Clinic created:",
                clinic
            );


            /*
             * STEP 4
             * Registrasi berhasil.
             */

            message.textContent =
                "Registrasi berhasil! Klinik " +
                clinicName +
                " berhasil dibuat.";

            message.className =
                "success";


            /*
             * Logout setelah registrasi
             */

            await supabaseClient.auth.signOut();


            setTimeout(function() {

                window.location.href =
                    "login.html";

            }, 1500);

        } catch (error) {

            console.error(error);

            message.textContent =
                "Error: " +
                error.message;

            message.className =
                "error";

            registerButton.disabled =
                false;

        }

    }
);

</script>

</body>

</html>
