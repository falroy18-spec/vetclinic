<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register - VetClinic</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family:
                Arial,
                sans-serif;

            background:
                #f4f6fb;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

        }


        .container {

            width: 100%;

            max-width: 440px;

            padding: 20px;

        }


        .card {

            background: white;

            border-radius: 16px;

            padding: 40px;

            box-shadow:
                0 10px 30px
                rgba(0,0,0,0.08);

        }


        .logo {

            text-align: center;

            margin-bottom: 30px;

        }


        .logo h1 {

            margin: 0;

            font-size: 28px;

            color: #252d3d;

        }


        .logo p {

            color: #6b7280;

            margin-bottom: 0;

        }


        label {

            display: block;

            margin-bottom: 7px;

            font-weight: 600;

            color: #374151;

        }


        input {

            width: 100%;

            padding: 13px;

            border:
                1px solid #d1d5db;

            border-radius: 8px;

            margin-bottom: 10px;

            font-size: 15px;

        }


        input:focus {

            outline: none;

            border-color:
                #5146e5;

            box-shadow:
                0 0 0 3px
                rgba(81,70,229,0.1);

        }


        button {

            width: 100%;

            border: none;

            padding: 14px;

            border-radius: 8px;

            background:
                #5146e5;

            color: white;

            font-size: 16px;

            font-weight: 600;

            cursor: pointer;

        }


        button:disabled {

            opacity: 0.6;

            cursor: not-allowed;

        }


        .show-password {

            display: flex;

            align-items: center;

            gap: 7px;

            margin-bottom: 18px;

            font-size: 14px;

            font-weight: normal;

            color: #4b5563;

            cursor: pointer;

        }


        .show-password input {

            width: auto;

            margin: 0;

            cursor: pointer;

        }


        .back-login {

            display: block;

            text-align: center;

            margin-top: 18px;

            color: #5146e5;

            font-size: 14px;

            text-decoration: none;

        }


        .back-login:hover {

            text-decoration:
                underline;

        }


        #message {

            margin-top: 18px;

            text-align: center;

            font-size: 14px;

            line-height: 1.5;

        }


        .error {

            color: #dc2626;

        }


        .success {

            color: #16a34a;

        }


        .info {

            color: #5146e5;

        }

    </style>

</head>


<body>


<div class="container">


    <div class="card">


        <div class="logo">

            <h1>
                🐾 VetClinic
            </h1>

            <p>
                Create Clinic Account
            </p>

        </div>


        <!-- CLINIC NAME -->

        <label for="clinicName">
            Clinic Name
        </label>

        <input
            type="text"
            id="clinicName"
            placeholder="Enter clinic name"
            autocomplete="organization"
        >


        <!-- EMAIL -->

        <label for="email">
            Email
        </label>

        <input
            type="email"
            id="email"
            placeholder="Enter clinic email"
            autocomplete="email"
        >


        <!-- PASSWORD -->

        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Create password"
            autocomplete="new-password"
        >


        <label class="show-password">

            <input
                type="checkbox"
                id="showPassword"
            >

            Show password

        </label>


        <!-- CONFIRM PASSWORD -->

        <label for="confirmPassword">
            Confirm Password
        </label>

        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm password"
            autocomplete="new-password"
        >


        <label class="show-password">

            <input
                type="checkbox"
                id="showConfirmPassword"
            >

            Show confirm password

        </label>


        <!-- REGISTER -->

        <button
            id="registerButton"
            type="button"
        >
            Register
        </button>


        <!-- LOGIN -->

        <a
            href="login.html"
            class="back-login"
        >
            Already have an account? Login
        </a>


        <div id="message"></div>


    </div>

</div>


<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://zltbjbbofvvndxirlipf.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_MWH4JPfiiJ2gvIqYpKE_Yw_UAoAlnFJ";


const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   REDIRECT
===================================================== */

const LOGIN_URL =
    "https://falroy18-spec.github.io/vetclinic/login.html";


/* =====================================================
   ELEMENTS
===================================================== */

const clinicNameInput =
    document.getElementById(
        "clinicName"
    );


const emailInput =
    document.getElementById(
        "email"
    );


const passwordInput =
    document.getElementById(
        "password"
    );


const confirmPasswordInput =
    document.getElementById(
        "confirmPassword"
    );


const showPassword =
    document.getElementById(
        "showPassword"
    );


const showConfirmPassword =
    document.getElementById(
        "showConfirmPassword"
    );


const registerButton =
    document.getElementById(
        "registerButton"
    );


const message =
    document.getElementById(
        "message"
    );


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
    text,
    type = ""
) {

    message.textContent =
        text;

    message.className =
        type;

}


/* =====================================================
   SHOW PASSWORD
===================================================== */

showPassword.addEventListener(
    "change",
    function() {

        passwordInput.type =
            showPassword.checked
                ? "text"
                : "password";

    }
);


/* =====================================================
   SHOW CONFIRM PASSWORD
===================================================== */

showConfirmPassword.addEventListener(
    "change",
    function() {

        confirmPasswordInput.type =
            showConfirmPassword.checked
                ? "text"
                : "password";

    }
);


/* =====================================================
   REGISTER
===================================================== */

registerButton.addEventListener(
    "click",
    async function() {

        const clinicName =
            clinicNameInput.value.trim();


        const email =
            emailInput.value
                .trim()
                .toLowerCase();


        const password =
            passwordInput.value;


        const confirmPassword =
            confirmPasswordInput.value;


        /* =============================================
           VALIDATION
        ============================================= */

        if (
            !clinicName ||
            !email ||
            !password ||
            !confirmPassword
        ) {

            showMessage(
                "Semua field wajib diisi.",
                "error"
            );

            return;

        }


        if (password.length < 6) {

            showMessage(
                "Password minimal 6 karakter.",
                "error"
            );

            return;

        }


        if (
            password !==
            confirmPassword
        ) {

            showMessage(
                "Password dan konfirmasi password tidak sama.",
                "error"
            );

            return;

        }


        /* =============================================
           SAVE CLINIC NAME TEMPORARILY
        ============================================= */

        localStorage.setItem(
            "vetclinic_pending_clinic_name",
            clinicName
        );


        localStorage.setItem(
            "vetclinic_pending_email",
            email
        );


        /* =============================================
           LOADING
        ============================================= */

        registerButton.disabled =
            true;


        showMessage(
            "Creating your clinic account...",
            "info"
        );


        try {

            /* =========================================
               CREATE SUPABASE USER
            ========================================= */

            const {
                data,
                error
            } =
            await supabaseClient.auth
                .signUp({

                    email:
                        email,

                    password:
                        password,

                    options: {

                        emailRedirectTo:
                            LOGIN_URL,

                        data: {

                            clinic_name:
                                clinicName

                        }

                    }

                });


            console.log(
                "SIGN UP RESULT:",
                data,
                error
            );


            /* =========================================
               SIGNUP ERROR
            ========================================= */

            if (error) {

                console.error(
                    "SIGNUP ERROR:",
                    error
                );


                /*
                 * Jika user sudah terdaftar,
                 * jangan hapus pending clinic.
                 */

                showMessage(
                    "Registrasi gagal: " +
                    error.message,
                    "error"
                );


                registerButton.disabled =
                    false;


                return;

            }


            /* =========================================
               USER CHECK
            ========================================= */

            if (!data.user) {

                showMessage(
                    "Registrasi gagal. User tidak berhasil dibuat.",
                    "error"
                );


                registerButton.disabled =
                    false;


                return;

            }


            /* =========================================
               EMAIL CONFIRMATION AKTIF
            ========================================= */

            if (!data.session) {

                showMessage(
                    "Akun berhasil dibuat! Silakan cek email " +
                    email +
                    " untuk mengkonfirmasi akun.",
                    "success"
                );


                /*
                 * Jangan redirect terlalu cepat.
                 */

                registerButton.disabled =
                    false;


                /*
                 * Ubah button agar user tidak
                 * menekan register berkali-kali.
                 */

                registerButton.textContent =
                    "Confirmation Email Sent";


                registerButton.disabled =
                    true;


                return;

            }


            /* =========================================
               JIKA CONFIRM EMAIL DIMATIKAN
            ========================================= */

            await createClinic();


        }

        catch (error) {

            console.error(
                "REGISTER ERROR:",
                error
            );


            showMessage(
                "Terjadi kesalahan: " +
                error.message,
                "error"
            );


            registerButton.disabled =
                false;

        }

    }
);


/* =====================================================
   CREATE CLINIC
===================================================== */

async function createClinic() {

    const clinicName =
        localStorage.getItem(
            "vetclinic_pending_clinic_name"
        );


    if (!clinicName) {

        throw new Error(
            "Nama klinik tidak ditemukan."
        );

    }


    showMessage(
        "Creating clinic...",
        "info"
    );


    const {
        data,
        error
    } =
    await supabaseClient
        .rpc(
            "create_clinic_for_current_user",
            {
                p_clinic_name:
                    clinicName
            }
        );


    console.log(
        "CREATE CLINIC:",
        data,
        error
    );


    if (error) {

        console.error(
            "CREATE CLINIC ERROR:",
            error
        );


        /*
         * Jangan hapus pending data.
         * User masih bisa mencoba lagi.
         */

        showMessage(
            "Akun berhasil dibuat, tetapi klinik belum berhasil dibuat: " +
            error.message,
            "error"
        );


        return;

    }


    /* =============================================
       SUCCESS
    ============================================= */

    localStorage.removeItem(
        "vetclinic_pending_clinic_name"
    );


    localStorage.removeItem(
        "vetclinic_pending_email"
    );


    showMessage(
        "Registrasi berhasil! Klinik berhasil dibuat.",
        "success"
    );


    setTimeout(
        function() {

            window.location.href =
                "index.html";

        },
        800
    );

}


/* =====================================================
   AUTH STATE
===================================================== */

supabaseClient.auth.onAuthStateChange(
    async function(
        event,
        session
    ) {

        console.log(
            "AUTH EVENT:",
            event,
            session
        );


        /*
         * Jika user langsung mendapat session
         * setelah signup, buat clinic.
         */

        if (
            event === "SIGNED_IN" &&
            session
        ) {

            const pendingClinic =
                localStorage.getItem(
                    "vetclinic_pending_clinic_name"
                );


            if (pendingClinic) {

                try {

                    await createClinic();

                }

                catch (error) {

                    console.error(
                        error
                    );

                }

            }

        }

    }
);

</script>


</body>

</html>
