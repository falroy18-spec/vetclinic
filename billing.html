<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Billing - VetClinic</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6fb;
    color: #252d3d;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 30px;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

.header h1 {
    margin: 0;
}

.header p {
    color: #6b7280;
}

.card {
    background: white;
    border-radius: 14px;
    padding: 25px;
    margin-bottom: 25px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.06);
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
}

.full {
    grid-column: 1 / -1;
}

label {
    display: block;
    margin-bottom: 7px;
    font-weight: 600;
}

input,
select {
    width: 100%;
    padding: 12px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 14px;
}

button {
    border: none;
    border-radius: 8px;
    padding: 11px 16px;
    cursor: pointer;
    font-weight: 600;
}

.primary {
    background: #5146e5;
    color: white;
}

.danger {
    background: #dc2626;
    color: white;
}

.secondary {
    background: #e5e7eb;
    color: #374151;
}

.success-btn {
    background: #16a34a;
    color: white;
}

button:disabled {
    opacity: 0.6;
}

.actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
    flex-wrap: wrap;
}

.message {
    margin-top: 15px;
    font-size: 14px;
}

.error {
    color: #dc2626;
}

.success {
    color: #16a34a;
}

.invoice {
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 15px;
}

.invoice-header {
    display: flex;
    justify-content: space-between;
    gap: 15px;
}

.invoice h3 {
    margin: 0 0 8px;
}

.meta {
    color: #6b7280;
    font-size: 13px;
    line-height: 1.7;
}

.total {
    font-size: 20px;
    font-weight: 700;
    margin-top: 12px;
}

.status {
    display: inline-block;
    padding: 5px 10px;
    border-radius: 20px;
    background: #eef2ff;
    font-size: 12px;
    font-weight: 600;
}

.empty {
    text-align: center;
    padding: 30px;
    color: #6b7280;
}

@media(max-width:700px) {

    .container {
        padding: 15px;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .full {
        grid-column: auto;
    }

    .header,
    .invoice-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 15px;
    }

}

</style>

</head>

<body>

<div class="container">

<div class="header">

<div>

<h1>💰 Billing</h1>

<p>VetClinic Billing Management</p>

</div>

<button
class="secondary"
type="button"
onclick="window.location.href='index.html'">

Dashboard

</button>

</div>


<div class="card">

<h2>New Invoice</h2>

<div class="form-grid">

<div class="full">

<label>Patient</label>

<select id="patient">

<option value="">
Select patient
</option>

</select>

</div>


<div>

<label>Invoice Date</label>

<input
type="date"
id="invoice_date">

</div>


<div>

<label>Status</label>

<select id="status">

<option value="Unpaid">
Unpaid
</option>

<option value="Paid">
Paid
</option>

<option value="Partial">
Partial
</option>

</select>

</div>


<div>

<label>Invoice Number</label>

<input
type="text"
id="invoice_number"
placeholder="Optional">

</div>


<div>

<label>Subtotal</label>

<input
type="number"
id="subtotal"
min="0"
value="0">

</div>


<div>

<label>Discount</label>

<input
type="number"
id="discount"
min="0"
value="0">

</div>


<div>

<label>Total</label>

<input
type="number"
id="total"
min="0"
value="0">

</div>

</div>


<div class="actions">

<button
class="primary"
id="saveButton"
type="button">

Save Invoice

</button>

</div>


<div
id="message"
class="message">
</div>

</div>


<div class="card">

<h2>Invoices</h2>

<div id="invoiceList">

<div class="empty">
Loading invoices...
</div>

</div>

</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://zltbjbbofvvndxirlipf.supabase.co";

const SUPABASE_KEY =
"sb_publishable_MWH4JPfiiJ2gvIqYpKE_Yw_UAoAlnFJ";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);
const {
    data: {
        session
    }
} = await supabaseClient.auth.getSession();

if (!session) {
    window.location.href = "login.html";
}

const patientSelect =
document.getElementById("patient");

const invoiceList =
document.getElementById("invoiceList");

const saveButton =
document.getElementById("saveButton");

const message =
document.getElementById("message");


document.getElementById(
    "invoice_date"
).value =
new Date()
.toISOString()
.split("T")[0];


function updateTotal() {

    const subtotal =
        Number(
            document.getElementById(
                "subtotal"
            ).value
        ) || 0;

    const discount =
        Number(
            document.getElementById(
                "discount"
            ).value
        ) || 0;

    document.getElementById(
        "total"
    ).value =
        Math.max(
            0,
            subtotal - discount
        );

}


document.getElementById(
    "subtotal"
).addEventListener(
    "input",
    updateTotal
);


document.getElementById(
    "discount"
).addEventListener(
    "input",
    updateTotal
);


async function loadPatients() {

    const {
        data,
        error
    } =
    await supabaseClient
    .from("patients")
    .select("id,name,species")
    .order("name");


    if (error) {

        message.textContent =
            "Gagal mengambil patient: " +
            error.message;

        message.className =
            "message error";

        return;
    }


    patientSelect.innerHTML = `
        <option value="">
            Select patient
        </option>
    `;


    data.forEach(patient => {

        const option =
            document.createElement(
                "option"
            );

        option.value =
            patient.id;

        option.textContent =
            patient.name +
            " (" +
            patient.species +
            ")";

        patientSelect.appendChild(
            option
        );

    });

}


async function loadInvoices() {

    invoiceList.innerHTML = `
        <div class="empty">
            Loading invoices...
        </div>
    `;


    const {
        data,
        error
    } =
    await supabaseClient
    .from("invoices")
    .select(`
        *,
        patients (
            name,
            species,
            breed
        )
    `)
    .order(
        "invoice_date",
        {
            ascending: false
        }
    );


    if (error) {

        invoiceList.innerHTML = `
            <div class="empty error">
                ${error.message}
            </div>
        `;

        return;
    }


    if (!data || data.length === 0) {

        invoiceList.innerHTML = `
            <div class="empty">
                No invoices yet.
            </div>
        `;

        return;
    }


    invoiceList.innerHTML = "";


    data.forEach(invoice => {

        const patient =
            invoice.patients;


        const div =
            document.createElement(
                "div"
            );

        div.className =
            "invoice";


        div.innerHTML = `

            <div class="invoice-header">

                <div>

                    <h3>
                        ${escapeHtml(
                            patient?.name ||
                            "Unknown Patient"
                        )}
                    </h3>

                    <div class="meta">

                        Invoice:
                        ${escapeHtml(
                            invoice.invoice_number ||
                            "-"
                        )}

                        <br>

                        Date:
                        ${invoice.invoice_date || "-"}

                        <br>

                        ${
                            patient?.species
                            ? escapeHtml(
                                patient.species
                            )
                            : ""
                        }

                    </div>

                    <span class="status">

                        ${escapeHtml(
                            invoice.status ||
                            "Unpaid"
                        )}

                    </span>

                </div>


                <button
                    class="danger"
                    type="button"
                    onclick="deleteInvoice(
                        '${invoice.id}'
                    )">

                    Delete

                </button>

            </div>


            <div class="meta">

                Subtotal:
                ${formatMoney(
                    invoice.subtotal
                )}

                <br>

                Discount:
                ${formatMoney(
                    invoice.discount
                )}

            </div>


            <div class="total">

                Total:
                ${formatMoney(
                    invoice.total
                )}

            </div>

        `;


        invoiceList.appendChild(
            div
        );

    });

}


saveButton.addEventListener(
    "click",
    async function() {

        const patient_id =
            patientSelect.value;

        const invoice_date =
            document.getElementById(
                "invoice_date"
            ).value;

        const status =
            document.getElementById(
                "status"
            ).value;

        const invoice_number =
            document.getElementById(
                "invoice_number"
            ).value.trim();

        const subtotal =
            Number(
                document.getElementById(
                    "subtotal"
                ).value
            ) || 0;

        const discount =
            Number(
                document.getElementById(
                    "discount"
                ).value
            ) || 0;

        const total =
            Math.max(
                0,
                subtotal - discount
            );


        if (!patient_id) {

            message.textContent =
                "Pilih patient terlebih dahulu.";

            message.className =
                "message error";

            return;
        }


        saveButton.disabled = true;

        message.textContent =
            "Saving invoice...";

        message.className =
            "message";


        const {
            error
        } =
        await supabaseClient
        .from("invoices")
        .insert({

            patient_id:
                patient_id,

            invoice_number:
                invoice_number || null,

            invoice_date:
                invoice_date,

            subtotal:
                subtotal,

            discount:
                discount,

            total:
                total,

            status:
                status

        });


        if (error) {

            console.error(error);

            message.textContent =
                "Gagal menyimpan: " +
                error.message;

            message.className =
                "message error";

            saveButton.disabled =
                false;

            return;
        }


        message.textContent =
            "Invoice berhasil disimpan!";

        message.className =
            "message success";


        document.getElementById(
            "invoice_number"
        ).value = "";

        document.getElementById(
            "subtotal"
        ).value = "0";

        document.getElementById(
            "discount"
        ).value = "0";

        document.getElementById(
            "total"
        ).value = "0";

        patientSelect.value = "";


        saveButton.disabled =
            false;


        loadInvoices();

    }
);


async function deleteInvoice(id) {

    if (!confirm(
        "Delete this invoice?"
    )) {
        return;
    }


    const {
        error
    } =
    await supabaseClient
    .from("invoices")
    .delete()
    .eq("id", id);


    if (error) {

        alert(
            "Gagal menghapus: " +
            error.message
        );

        return;
    }


    loadInvoices();

}


function formatMoney(value) {

    return new Intl.NumberFormat(
        "id-ID",
        {
            style: "currency",
            currency: "IDR",
            maximumFractionDigits: 0
        }
    ).format(
        Number(value || 0)
    );

}


function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


loadPatients();

loadInvoices();

</script>

</body>

</html>
