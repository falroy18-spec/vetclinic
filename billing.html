<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Billing - Dwara Pet Care</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6fb;
    color: #252d3d;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 30px;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

.header h1 {
    margin: 0;
}

.header p {
    color: #6b7280;
}

.card {
    background: white;
    border-radius: 14px;
    padding: 25px;
    margin-bottom: 25px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.06);
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
}

.full {
    grid-column: 1 / -1;
}

label {
    display: block;
    margin-bottom: 7px;
    font-weight: 600;
}

input,
select {
    width: 100%;
    padding: 12px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 14px;
}

button {
    border: none;
    border-radius: 8px;
    padding: 11px 16px;
    cursor: pointer;
    font-weight: 600;
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.primary {
    background: #5146e5;
    color: white;
}

.secondary {
    background: #e5e7eb;
    color: #374151;
}

.danger {
    background: #dc2626;
    color: white;
}

.print-btn {
    background: #2563eb;
    color: white;
}

.items-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 30px;
    margin-bottom: 15px;
}

.item-table {
    width: 100%;
    border-collapse: collapse;
}

.item-table th,
.item-table td {
    padding: 10px;
    border-bottom: 1px solid #e5e7eb;
}

.item-table th {
    background: #f9fafb;
    text-align: left;
}

.amount {
    font-weight: bold;
    white-space: nowrap;
}

.remove {
    background: #dc2626;
    color: white;
    padding: 8px 12px;
}

.summary {
    max-width: 400px;
    margin-left: auto;
    margin-top: 25px;
}

.summary-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
}

.summary-row input {
    width: 180px;
}

.total-row {
    border-top: 2px solid #252d3d;
    margin-top: 10px;
    padding-top: 15px;
    font-size: 20px;
    font-weight: bold;
}

.message {
    margin-top: 15px;
}

.error {
    color: #dc2626;
}

.ok {
    color: #16a34a;
}

.invoice {
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 15px;
}

.invoice-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 15px;
}

.invoice h3 {
    margin-top: 0;
}

.meta {
    color: #6b7280;
    font-size: 14px;
    line-height: 1.7;
}

.invoice-items {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
}

.invoice-items th,
.invoice-items td {
    padding: 9px;
    border-bottom: 1px solid #e5e7eb;
    text-align: left;
}

.invoice-items th:nth-child(2),
.invoice-items td:nth-child(2) {
    text-align: center;
}

.invoice-items th:nth-child(3),
.invoice-items td:nth-child(3),
.invoice-items th:nth-child(4),
.invoice-items td:nth-child(4) {
    text-align: right;
}

.invoice-total {
    text-align: right;
    font-size: 20px;
    font-weight: bold;
    margin-top: 15px;
}

.actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.empty {
    text-align: center;
    color: #6b7280;
    padding: 25px;
}

@media(max-width:700px) {

    .container {
        padding: 15px;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .full {
        grid-column: auto;
    }

}

</style>

</head>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://zltbjbbofvvndxirlipf.supabase.co";


const SUPABASE_KEY =
"sb_publishable_MWH4JPfiiJ2gvIqYpKE_Yw_UAoAlnFJ";


const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


const patientSelect =
document.getElementById("patient");

const itemsBody =
document.getElementById("itemsBody");

const discountInput =
document.getElementById("discount");

const message =
document.getElementById("message");

const invoiceList =
document.getElementById("invoiceList");


function money(value) {

    return new Intl.NumberFormat(
        "id-ID",
        {
            style: "currency",
            currency: "IDR",
            maximumFractionDigits: 0
        }
    ).format(
        Number(value || 0)
    );

}


function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


async function checkSession() {

    const {
        data: {
            session
        }
    } =
    await supabaseClient.auth.getSession();


    if (!session) {

        window.location.href =
            "login.html";

        return false;

    }

    return true;

}


/* =========================
   ADD ITEM
========================= */

function addItem(
    description = "Jasa Dokter",
    quantity = 1,
    unitPrice = 45000
) {

    const row =
        document.createElement("tr");


    row.innerHTML = `

        <td>

            <input
                type="text"
                class="description"
                value="${escapeHtml(description)}"
                placeholder="Contoh: Jasa Dokter">

        </td>

        <td>

            <input
                type="number"
                class="quantity"
                min="1"
                value="${quantity}">

        </td>

        <td>

            <input
                type="number"
                class="unit-price"
                min="0"
                value="${unitPrice}">

        </td>

        <td class="amount">
            Rp0
        </td>

        <td>

            <button
                type="button"
                class="remove">

                Delete

            </button>

        </td>

    `;


    itemsBody.appendChild(row);


    row.querySelectorAll("input")
        .forEach(
            input => {

                input.addEventListener(
                    "input",
                    calculateTotal
                );

            }
        );


    row.querySelector(".remove")
        .addEventListener(
            "click",
            function() {

                row.remove();

                calculateTotal();

            }
        );


    calculateTotal();

}


/* =========================
   CALCULATE
========================= */

function calculateTotal() {

    let subtotal = 0;


    itemsBody
        .querySelectorAll("tr")
        .forEach(
            row => {

                const quantity =
                    Number(
                        row.querySelector(
                            ".quantity"
                        ).value
                    ) || 0;


                const unitPrice =
                    Number(
                        row.querySelector(
                            ".unit-price"
                        ).value
                    ) || 0;


                const total =
                    quantity * unitPrice;


                row.querySelector(
                    ".amount"
                ).textContent =
                    money(total);


                subtotal += total;

            }
        );


    const discount =
        Number(
            discountInput.value
        ) || 0;


    const total =
        Math.max(
            0,
            subtotal - discount
        );


    document.getElementById(
        "subtotal"
    ).textContent =
        money(subtotal);


    document.getElementById(
        "grandTotal"
    ).textContent =
        money(total);

}


discountInput.addEventListener(
    "input",
    calculateTotal
);


/* =========================
   LOAD PATIENTS
========================= */

async function loadPatients() {

    const {
        data,
        error
    } =
    await supabaseClient
        .from("patients")
        .select("id,name,species,breed")
        .order("name");


    if (error) {

        message.textContent =
            "Gagal mengambil patient: " +
            error.message;

        message.className =
            "message error";

        return;

    }


    patientSelect.innerHTML = `

        <option value="">
            Select patient
        </option>

    `;


    (data || [])
        .forEach(
            patient => {

                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    patient.id;


                option.textContent =
                    patient.name +
                    " (" +
                    patient.species +
                    ")";


                patientSelect.appendChild(
                    option
                );

            }
        );

}


/* =========================
   GET ITEMS
========================= */

function getItems() {

    const items = [];


    itemsBody
        .querySelectorAll("tr")
        .forEach(
            row => {

                const description =
                    row.querySelector(
                        ".description"
                    ).value.trim();


                const quantity =
                    Number(
                        row.querySelector(
                            ".quantity"
                        ).value
                    ) || 0;


                const unitPrice =
                    Number(
                        row.querySelector(
                            ".unit-price"
                        ).value
                    ) || 0;


                if (description) {

                    items.push({

                        description:
                            description,

                        quantity:
                            quantity,

                        unit_price:
                            unitPrice,

                        total:
                            quantity *
                            unitPrice

                    });

                }

            }
        );


    return items;

}


/* =========================
   SAVE INVOICE
========================= */

async function saveInvoice() {

    const patient_id =
        patientSelect.value;


    const invoice_date =
        document.getElementById(
            "invoice_date"
        ).value;


    const status =
        document.getElementById(
            "status"
        ).value;


    const invoice_number =
        document.getElementById(
            "invoice_number"
        ).value.trim();


    const items =
        getItems();


    if (!patient_id) {

        message.textContent =
            "Pilih patient terlebih dahulu.";

        message.className =
            "message error";

        return;

    }


    if (!invoice_date) {

        message.textContent =
            "Pilih tanggal invoice.";

        message.className =
            "message error";

        return;

    }


    if (!items.length) {

        message.textContent =
            "Tambahkan minimal satu jasa/item.";

        message.className =
            "message error";

        return;

    }


    const subtotal =
        items.reduce(
            (sum, item) =>
                sum + item.total,
            0
        );


    const discount =
        Number(
            discountInput.value
        ) || 0;


    const total =
        Math.max(
            0,
            subtotal - discount
        );


    const saveButton =
        document.getElementById(
            "saveInvoice"
        );


    saveButton.disabled = true;


    message.textContent =
        "Saving invoice...";


    const {
        data: invoice,
        error
    } =
    await supabaseClient
        .from("invoices")
        .insert({

            patient_id:
                patient_id,

            invoice_number:
                invoice_number || null,

            invoice_date:
                invoice_date,

            subtotal:
                subtotal,

            discount:
                discount,

            total:
                total,

            status:
                status

        })
        .select()
        .single();


    if (error) {

        message.textContent =
            "Gagal menyimpan invoice: " +
            error.message;

        message.className =
            "message error";

        saveButton.disabled = false;

        return;

    }


    const itemRows =
        items.map(
            item => ({

                invoice_id:
                    invoice.id,

                description:
                    item.description,

                quantity:
                    item.quantity,

                unit_price:
                    item.unit_price,

                total:
                    item.total

            })
        );


    const {
        error: itemError
    } =
    await supabaseClient
        .from("invoice_items")
        .insert(itemRows);


    if (itemError) {

        message.textContent =
            "Gagal menyimpan item: " +
            itemError.message;

        message.className =
            "message error";

        saveButton.disabled = false;

        return;

    }


    message.textContent =
        "Invoice berhasil disimpan.";

    message.className =
        "message ok";


    patientSelect.value = "";

    document.getElementById(
        "invoice_number"
    ).value = "";

    discountInput.value = "0";

    itemsBody.innerHTML = "";


    addItem(
        "Jasa Dokter",
        1,
        45000
    );


    await loadInvoices();

    saveButton.disabled = false;

}


/* =========================
   LOAD INVOICES
========================= */

async function loadInvoices() {

    invoiceList.innerHTML = `

        <div class="empty">
            Loading invoices...
        </div>

    `;


    const {
        data,
        error
    } =
    await supabaseClient
        .from("invoices")
        .select(`
            *,
            patients (
                name,
                species,
                breed
            )
        `)
        .order(
            "invoice_date",
            {
                ascending: false
            }
        );


    if (error) {

        invoiceList.innerHTML = `

            <div class="empty error">

                Gagal mengambil invoice:
                ${escapeHtml(
                    error.message
                )}

            </div>

        `;

        return;

    }


    if (!data || !data.length) {

        invoiceList.innerHTML = `

            <div class="empty">
                No invoices yet.
            </div>

        `;

        return;

    }


    invoiceList.innerHTML = "";


    for (
        const invoice of data
    ) {

        const {
            data: items
        } =
        await supabaseClient
            .from("invoice_items")
            .select(
                "description,quantity,unit_price,total"
            )
            .eq(
                "invoice_id",
                invoice.id
            );


        const patient =
            invoice.patients;


        let rows = "";


        (items || [])
            .forEach(
                item => {

                    rows += `

                        <tr>

                            <td>
                                ${escapeHtml(
                                    item.description
                                )}
                            </td>

                            <td>
                                ${item.quantity}
                            </td>

                            <td>
                                ${money(
                                    item.unit_price
                                )}
                            </td>

                            <td>
                                ${money(
                                    item.total
                                )}
                            </td>

                        </tr>

                    `;

                }
            );


        const div =
            document.createElement(
                "div"
            );


        div.className =
            "invoice";


        div.innerHTML = `

            <div class="invoice-top">

                <div>

                    <h3>

                        ${escapeHtml(
                            patient?.name ||
                            "Unknown Patient"
                        )}

                    </h3>

                    <div class="meta">

                        Invoice:
                        ${escapeHtml(
                            invoice.invoice_number ||
                            "-"
                        )}

                        <br>

                        Date:
                        ${invoice.invoice_date || "-"}

                        <br>

                        Species:
                        ${escapeHtml(
                            patient?.species ||
                            "-"
                        )}

                        <br>

                        Status:
                        ${escapeHtml(
                            invoice.status ||
                            "Unpaid"
                        )}

                    </div>

                </div>


                <div class="actions">

                    <button
                        class="print-btn"
                        type="button"
                        onclick="printInvoice('${invoice.id}')">

                        🖨️ Print

                    </button>


                    <button
                        class="danger"
                        type="button"
                        onclick="deleteInvoice('${invoice.id}')">

                        Delete

                    </button>

                </div>

            </div>


            <div style="overflow-x:auto;">

                <table class="invoice-items">

                    <thead>

                        <tr>

                            <th>
                                Description
                            </th>

                            <th>
                                Qty
                            </th>

                            <th>
                                Unit Price
                            </th>

                            <th>
                                Total
                            </th>

                        </tr>

                    </thead>

                    <tbody>

                        ${rows}

                    </tbody>

                </table>

            </div>


            <div
                class="meta"
                style="margin-top:15px;">

                Subtotal:
                ${money(
                    invoice.subtotal
                )}

                <br>

                Discount:
                ${money(
                    invoice.discount
                )}

            </div>


            <div class="invoice-total">

                Total:
                ${money(
                    invoice.total
                )}

            </div>

        `;


        invoiceList.appendChild(
            div
        );

    }

}


/* =========================
   DELETE
========================= */

async function deleteInvoice(id) {

    if (
        !confirm(
            "Delete this invoice?"
        )
    ) {

        return;

    }


    await supabaseClient
        .from("invoice_items")
        .delete()
        .eq(
            "invoice_id",
            id
        );


    const {
        error
    } =
    await supabaseClient
        .from("invoices")
        .delete()
        .eq(
            "id",
            id
        );


    if (error) {

        alert(
            "Gagal menghapus: " +
            error.message
        );

        return;

    }


    await loadInvoices();

}
