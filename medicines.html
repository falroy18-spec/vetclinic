<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medicines - VetClinic</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6fb;
    color: #252d3d;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 30px;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

.header h1 {
    margin: 0;
}

.header p {
    color: #6b7280;
}

.card {
    background: white;
    border-radius: 14px;
    padding: 25px;
    margin-bottom: 25px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.06);
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
}

label {
    display: block;
    margin-bottom: 7px;
    font-weight: 600;
}

input,
textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
}

textarea {
    min-height: 80px;
    resize: vertical;
}

button {
    border: none;
    border-radius: 8px;
    padding: 11px 16px;
    cursor: pointer;
    font-weight: 600;
}

.primary {
    background: #5146e5;
    color: white;
}

.danger {
    background: #dc2626;
    color: white;
}

.secondary {
    background: #e5e7eb;
    color: #374151;
}

button:disabled {
    opacity: 0.6;
}

.actions {
    margin-top: 20px;
}

.message {
    margin-top: 15px;
    font-size: 14px;
}

.error {
    color: #dc2626;
}

.success {
    color: #16a34a;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th,
td {
    padding: 14px;
    border-bottom: 1px solid #e5e7eb;
    text-align: left;
}

th {
    background: #f9fafb;
}

.empty {
    text-align: center;
    padding: 30px;
    color: #6b7280;
}

@media(max-width:700px) {
    .container {
        padding: 15px;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .header {
        flex-direction: column;
        align-items: flex-start;
        gap: 15px;
    }

    table {
        font-size: 13px;
    }
}
</style>

</head>

<body>

<div class="container">

<div class="header">

<div>
<h1>💊 Medicines</h1>
<p>VetClinic Medicine Inventory</p>
</div>

<button
class="secondary"
type="button"
onclick="window.location.href='index.html'">
Dashboard
</button>

</div>


<div class="card">

<h2>Add Medicine</h2>

<div class="form-grid">

<div>
<label>Medicine Name</label>
<input
type="text"
id="name"
placeholder="e.g. Amoxicillin">
</div>

<div>
<label>Strength</label>
<input
type="text"
id="strength"
placeholder="e.g. 100 mg">
</div>

<div>
<label>Unit</label>
<input
type="text"
id="unit"
placeholder="e.g. tablet / bottle">
</div>

<div>
<label>Stock</label>
<input
type="number"
id="stock"
min="0"
value="0">
</div>

<div>
<label>Minimum Stock</label>
<input
type="number"
id="minimum_stock"
min="0"
value="0">
</div>

<div>
<label>Notes</label>
<input
type="text"
id="notes"
placeholder="Additional notes">
</div>

</div>

<div class="actions">

<button
class="primary"
id="saveButton"
type="button">
Save Medicine
</button>

</div>

<div
id="message"
class="message">
</div>

</div>


<div class="card">

<h2>Medicine Inventory</h2>

<table>

<thead>
<tr>
<th>Medicine</th>
<th>Strength</th>
<th>Unit</th>
<th>Stock</th>
<th>Minimum</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>

<tbody id="medicineList">

<tr>
<td
colspan="7"
class="empty">
Loading medicines...
</td>
</tr>

</tbody>

</table>

</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://zltbjbbofvvndxirlipf.supabase.co";

const SUPABASE_KEY =
"sb_publishable_MWH4JPfiiJ2gvIqYpKE_Yw_UAoAlnFJ";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);
const {
    data: {
        session
    }
} = await supabaseClient.auth.getSession();

if (!session) {
    window.location.href = "login.html";
}
const saveButton =
document.getElementById("saveButton");

const medicineList =
document.getElementById("medicineList");

const message =
document.getElementById("message");


async function loadMedicines() {

    const {
        data,
        error
    } =
    await supabaseClient
        .from("medicines")
        .select("*")
        .order("name");

    if (error) {

        medicineList.innerHTML = `
            <tr>
                <td colspan="7"
                    class="empty error">
                    ${error.message}
                </td>
            </tr>
        `;

        return;
    }

    if (!data || data.length === 0) {

        medicineList.innerHTML = `
            <tr>
                <td colspan="7"
                    class="empty">
                    No medicines yet.
                </td>
            </tr>
        `;

        return;
    }

    medicineList.innerHTML = "";

    data.forEach(medicine => {

        const stock =
            Number(medicine.stock || 0);

        const minimum =
            Number(medicine.minimum_stock || 0);

        const status =
            stock <= minimum
                ? "LOW STOCK"
                : "Available";

        const row =
            document.createElement("tr");

        row.innerHTML = `

            <td>
                ${escapeHtml(medicine.name)}
            </td>

            <td>
                ${escapeHtml(
                    medicine.strength || "-"
                )}
            </td>

            <td>
                ${escapeHtml(
                    medicine.unit || "-"
                )}
            </td>

            <td>
                ${stock}
            </td>

            <td>
                ${minimum}
            </td>

            <td>
                ${status}
            </td>

            <td>

                <button
                    class="danger"
                    type="button"
                    onclick="deleteMedicine(
                        '${medicine.id}'
                    )">

                    Delete

                </button>

            </td>

        `;

        medicineList.appendChild(row);

    });

}


saveButton.addEventListener(
    "click",
    async function() {

        const name =
            document.getElementById(
                "name"
            ).value.trim();

        const strength =
            document.getElementById(
                "strength"
            ).value.trim();

        const unit =
            document.getElementById(
                "unit"
            ).value.trim();

        const stock =
            Number(
                document.getElementById(
                    "stock"
                ).value
            ) || 0;

        const minimum_stock =
            Number(
                document.getElementById(
                    "minimum_stock"
                ).value
            ) || 0;

        const notes =
            document.getElementById(
                "notes"
            ).value.trim();


        if (!name) {

            message.textContent =
                "Medicine name wajib diisi.";

            message.className =
                "message error";

            return;
        }


        saveButton.disabled = true;

        message.textContent =
            "Saving medicine...";

        message.className =
            "message";


        const {
            error
        } =
        await supabaseClient
            .from("medicines")
            .insert({

                name:
                    name,

                strength:
                    strength || null,

                unit:
                    unit || null,

                stock:
                    stock,

                minimum_stock:
                    minimum_stock,

                notes:
                    notes || null

            });


        if (error) {

            console.error(error);

            message.textContent =
                "Gagal menyimpan: " +
                error.message;

            message.className =
                "message error";

            saveButton.disabled = false;

            return;
        }


        message.textContent =
            "Medicine berhasil disimpan!";

        message.className =
            "message success";


        document.getElementById(
            "name"
        ).value = "";

        document.getElementById(
            "strength"
        ).value = "";

        document.getElementById(
            "unit"
        ).value = "";

        document.getElementById(
            "stock"
        ).value = "0";

        document.getElementById(
            "minimum_stock"
        ).value = "0";

        document.getElementById(
            "notes"
        ).value = "";


        saveButton.disabled = false;

        loadMedicines();

    }
);


async function deleteMedicine(id) {

    if (!confirm(
        "Delete this medicine?"
    )) {
        return;
    }

    const {
        error
    } =
    await supabaseClient
        .from("medicines")
        .delete()
        .eq("id", id);

    if (error) {

        alert(
            "Gagal menghapus: " +
            error.message
        );

        return;
    }

    loadMedicines();

}


function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


loadMedicines();

</script>

</body>

</html>
