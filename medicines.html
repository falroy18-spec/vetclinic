<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Medicines - VetClinic</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6fb;
    color: #252d3d;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 30px;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

.header h1 {
    margin: 0;
}

.header p {
    color: #6b7280;
}

button {
    border: none;
    border-radius: 8px;
    padding: 10px 14px;
    cursor: pointer;
    font-weight: 600;
}

.primary {
    background: #5146e5;
    color: white;
}

.danger {
    background: #dc2626;
    color: white;
}

.secondary {
    background: #e5e7eb;
    color: #374151;
}

.success {
    background: #16a34a;
    color: white;
}

.warning {
    background: #f59e0b;
    color: white;
}

.card {
    background: white;
    border-radius: 14px;
    padding: 25px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.06);
    margin-bottom: 25px;
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
}

label {
    display: block;
    margin-bottom: 7px;
    font-weight: 600;
}

input {
    width: 100%;
    padding: 12px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 14px;
}

.form-actions {
    margin-top: 20px;
}

.message {
    margin-top: 15px;
    font-size: 14px;
}

.error {
    color: #dc2626;
}

.ok {
    color: #16a34a;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th,
td {
    padding: 14px;
    border-bottom: 1px solid #e5e7eb;
    text-align: left;
}

th {
    background: #f9fafb;
}

.empty {
    text-align: center;
    padding: 30px;
    color: #6b7280;
}

.medicine-search {
    margin-bottom: 18px;
}
.medicine-search input {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 14px;
}
.medicine-search input:focus {
    outline: none;
    border-color: #5146e5;
    box-shadow: 0 0 0 3px rgba(81,70,229,.10);
}

.stock-controls {
    display: flex;
    align-items: center;
    gap: 6px;
}

.stock-number {
    min-width: 45px;
    text-align: center;
    font-weight: 600;
}

.stock-input {
    width: 75px;
    padding: 8px;
    text-align: center;
}

.action-buttons {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
}

.status-low {
    color: #dc2626;
    font-weight: 600;
}

.status-ok {
    color: #16a34a;
    font-weight: 600;
}

@media(max-width:700px) {

    .form-grid {
        grid-template-columns: 1fr;
    }

    .container {
        padding: 15px;
    }

    table {
        font-size: 13px;
    }

}

</style>

</head>


<body>

<div class="container">


<div class="header">

    <div>

        <h1>💊 Medicines</h1>

        <p>
            VetClinic Medicine Inventory
        </p>

    </div>


    <button
        class="secondary"
        type="button"
        onclick="window.location.href='index.html'">

        Dashboard

    </button>

</div>



<!-- ADD MEDICINE -->

<div class="card">

    <h2>Add Medicine</h2>


    <div class="form-grid">


        <div>

            <label>
                Medicine Name
            </label>

            <input
                id="name"
                type="text"
                placeholder="e.g. Amoxicillin">

        </div>



        <div>

            <label>
                Strength
            </label>

            <input
                id="strength"
                type="text"
                placeholder="e.g. 100 mg">

        </div>



        <div>

            <label>
                Unit
            </label>

            <input
                id="unit"
                type="text"
                placeholder="e.g. tablet / bottle">

        </div>



        <div>

            <label>
                Stock
            </label>

            <input
                id="stock"
                type="number"
                min="0"
                value="0">

        </div>



        <div>

            <label>
                Minimum Stock
            </label>

            <input
                id="minimum_stock"
                type="number"
                min="0"
                value="0">

        </div>



        <div>

            <label>
                Notes
            </label>

            <input
                id="notes"
                type="text"
                placeholder="Additional notes">

        </div>


    </div>



    <div class="form-actions">

        <button
            class="primary"
            id="saveButton"
            type="button">

            Save Medicine

        </button>

    </div>


    <div
        id="message"
        class="message">

    </div>

</div>



<!-- MEDICINE INVENTORY -->

<div class="card">

    <h2>Medicine Inventory</h2>

    <div class="medicine-search">
        <input
            id="medicineSearch"
            type="text"
            placeholder="🔎 Search medicine..."
            autocomplete="off"
        >
    </div>


    <table>

        <thead>

            <tr>

                <th>Medicine</th>

                <th>Strength</th>

                <th>Unit</th>

                <th>Stock</th>

                <th>Minimum</th>

                <th>Status</th>

                <th>Action</th>

            </tr>

        </thead>


        <tbody id="medicineList">

        </tbody>

    </table>

</div>


</div>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


const SUPABASE_URL =
"https://zltbjbbofvvndxirlipf.supabase.co";


const SUPABASE_KEY =
"sb_publishable_MWH4JPfiiJ2gvIqYpKE_Yw_UAoAlnFJ";


const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);



/* LOGIN CHECK + CLINIC */

let currentClinicId = null;

supabaseClient.auth.getSession().then(
    async ({ data: { session } }) => {

        if (!session) {

            window.location.href =
                "login.html";

            return;

        }

        const {
            data: clinicMember,
            error
        } = await supabaseClient
            .from("clinic_members")
            .select("clinic_id")
            .eq("user_id", session.user.id)
            .limit(1)
            .single();

        if (error || !clinicMember) {

            console.error(error);

            alert(
                "Clinic user tidak ditemukan."
            );

            return;

        }

        currentClinicId =
            clinicMember.clinic_id;

        loadMedicines();

    }
);



const saveButton =
document.getElementById(
    "saveButton"
);


const message =
document.getElementById(
    "message"
);


const medicineList =
document.getElementById(
    "medicineList"
);

let allMedicines = [];



/* MESSAGE */

function showMessage(
    text,
    type = ""
) {

    message.textContent =
        text;

    message.className =
        "message " +
        type;

}



/* LOAD MEDICINES */

async function loadMedicines() {

    medicineList.innerHTML = `
        <tr>
            <td colspan="7" class="empty">
                Loading medicines...
            </td>
        </tr>
    `;

    const { data, error } =
        await supabaseClient
            .from("medicines")
            .select("*")
            .order("created_at", { ascending: false });

    if (error) {
        console.error(error);
        medicineList.innerHTML = `
            <tr>
                <td colspan="7" class="empty error">
                    ${error.message}
                </td>
            </tr>
        `;
        return;
    }

    allMedicines = data || [];
    renderMedicines(
        document.getElementById("medicineSearch")?.value || ""
    );
}


function renderMedicines(searchValue = "") {

    const keyword =
        String(searchValue || "").trim().toLowerCase();

    const filtered =
        allMedicines.filter(medicine => {

            const name =
                String(medicine.name || "").toLowerCase();

            const strength =
                String(medicine.strength || "").toLowerCase();

            const unit =
                String(medicine.unit || "").toLowerCase();

            const notes =
                String(medicine.notes || "").toLowerCase();

            return (
                !keyword ||
                name.includes(keyword) ||
                strength.includes(keyword) ||
                unit.includes(keyword) ||
                notes.includes(keyword)
            );
        });

    if (!filtered.length) {
        medicineList.innerHTML = `
            <tr>
                <td colspan="7" class="empty">
                    ${keyword ? "No medicine found." : "No medicines yet."}
                </td>
            </tr>
        `;
        return;
    }

    medicineList.innerHTML = "";

    filtered.forEach(medicine => {

        const stock =
            Number(medicine.stock || 0);

        const minimum =
            Number(medicine.minimum_stock || 0);

        const isLow =
            stock <= minimum;

        const row =
            document.createElement("tr");

        row.innerHTML = `

            <td>${medicine.name || "-"}</td>

            <td>${medicine.strength || "-"}</td>

            <td>${medicine.unit || "-"}</td>

            <td>
                <div class="stock-controls">

                    <button
                        class="secondary"
                        onclick="changeStock('${medicine.id}', -1)">
                        −
                    </button>

                    <span class="stock-number">
                        ${stock}
                    </span>

                    <button
                        class="success"
                        onclick="changeStock('${medicine.id}', 1)">
                        +
                    </button>

                </div>
            </td>

            <td>${minimum}</td>

            <td>
                ${
                    isLow
                    ? `<span class="status-low">Low Stock</span>`
                    : `<span class="status-ok">Available</span>`
                }
            </td>

            <td>
                <div class="action-buttons">

                    <button
                        class="warning"
                        onclick="editStock('${medicine.id}', ${stock})">
                        Edit Stock
                    </button>

                    <button
                        class="danger"
                        onclick="deleteMedicine('${medicine.id}')">
                        Delete
                    </button>

                </div>
            </td>

        `;

        medicineList.appendChild(row);
    });
}



/* MEDICINE SEARCH */

const medicineSearch =
    document.getElementById(
        "medicineSearch"
    );

medicineSearch.addEventListener(
    "input",
    function() {
        renderMedicines(
            this.value
        );
    }
);


/* ADD MEDICINE */

saveButton.addEventListener(
    "click",
    async function() {


        const name =
            document.getElementById(
                "name"
            ).value.trim();


        const strength =
            document.getElementById(
                "strength"
            ).value.trim();


        const unit =
            document.getElementById(
                "unit"
            ).value.trim();


        const stock =
            Number(
                document.getElementById(
                    "stock"
                ).value || 0
            );


        const minimum_stock =
            Number(
                document.getElementById(
                    "minimum_stock"
                ).value || 0
            );


        const notes =
            document.getElementById(
                "notes"
            ).value.trim();



        if (!name) {

            showMessage(
                "Medicine name wajib diisi.",
                "error"
            );

            return;

        }



        saveButton.disabled =
            true;


        showMessage(
            "Saving medicine..."
        );



        const {
            error
        } =
        await supabaseClient
            .from("medicines")
            .insert({

                name:
                    name,

                strength:
                    strength || null,

                unit:
                    unit || null,

                stock:
                    stock,

                minimum_stock:
                    minimum_stock,

                notes:
                    notes || null,

                clinic_id:
                    currentClinicId

            });



        if (error) {

            console.error(error);

            showMessage(
                "Gagal menyimpan: " +
                error.message,
                "error"
            );

            saveButton.disabled =
                false;

            return;

        }



        showMessage(
            "Medicine berhasil disimpan.",
            "ok"
        );


        document.getElementById(
            "name"
        ).value = "";


        document.getElementById(
            "strength"
        ).value = "";


        document.getElementById(
            "unit"
        ).value = "";


        document.getElementById(
            "stock"
        ).value = "0";


        document.getElementById(
            "minimum_stock"
        ).value = "0";


        document.getElementById(
            "notes"
        ).value = "";


        saveButton.disabled =
            false;


        loadMedicines();

    }
);



/* + / - STOCK */

async function changeStock(
    id,
    amount
) {


    const {
        data: medicine,
        error: findError
    } =
    await supabaseClient
        .from("medicines")
        .select("stock")
        .eq("id", id)
        .single();


    if (findError) {

        alert(
            "Gagal mengambil stock: " +
            findError.message
        );

        return;

    }


    const currentStock =
        Number(
            medicine.stock || 0
        );


    const newStock =
        Math.max(
            0,
            currentStock + amount
        );


    const {
        error
    } =
    await supabaseClient
        .from("medicines")
        .update({

            stock:
                newStock

        })
        .eq(
            "id",
            id
        );


    if (error) {

        alert(
            "Gagal update stock: " +
            error.message
        );

        return;

    }


    loadMedicines();

}



/* EDIT STOCK MANUAL */

async function editStock(
    id,
    currentStock
) {


    const newValue =
        prompt(
            "Masukkan jumlah stock baru:",
            currentStock
        );


    if (
        newValue === null
    ) {

        return;

    }


    const newStock =
        Number(
            newValue
        );


    if (
        !Number.isInteger(
            newStock
        ) ||
        newStock < 0
    ) {

        alert(
            "Stock harus berupa angka 0 atau lebih."
        );

        return;

    }


    const {
        error
    } =
    await supabaseClient
        .from("medicines")
        .update({

            stock:
                newStock

        })
        .eq(
            "id",
            id
        );


    if (error) {

        alert(
            "Gagal update stock: " +
            error.message
        );

        return;

    }


    loadMedicines();

}



/* DELETE MEDICINE */

async function deleteMedicine(
    id
) {


    const confirmed =
        confirm(
            "Hapus medicine ini?"
        );


    if (!confirmed) {

        return;

    }


    const {
        error
    } =
    await supabaseClient
        .from("medicines")
        .delete()
        .eq(
            "id",
            id
        );


    if (error) {

        alert(
            "Gagal menghapus: " +
            error.message
        );

        return;

    }


    loadMedicines();

}


</script>

</body>

</html>
