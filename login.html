<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Login - VetClinic</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background: #f4f6fb;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

        }


        .container {

            width: 100%;

            max-width: 420px;

            padding: 20px;

        }


        .card {

            background: white;

            border-radius: 16px;

            padding: 40px;

            box-shadow:
                0 10px 30px rgba(0,0,0,0.08);

        }


        .logo {

            text-align: center;

            margin-bottom: 30px;

        }


        .logo h1 {

            margin: 0;

            font-size: 28px;

            color: #252d3d;

        }


        .logo p {

            color: #6b7280;

            margin-bottom: 0;

        }


        label {

            display: block;

            margin-bottom: 7px;

            font-weight: 600;

            color: #374151;

        }


        input {

            width: 100%;

            padding: 13px;

            border: 1px solid #d1d5db;

            border-radius: 8px;

            margin-bottom: 10px;

            font-size: 15px;

        }


        button {

            width: 100%;

            border: none;

            padding: 14px;

            border-radius: 8px;

            background: #5146e5;

            color: white;

            font-size: 16px;

            font-weight: 600;

            cursor: pointer;

        }


        button:disabled {

            opacity: 0.6;

            cursor: not-allowed;

        }


        .show-password {

            display: flex;

            align-items: center;

            gap: 7px;

            margin-bottom: 12px;

            font-size: 14px;

            font-weight: normal;

            color: #4b5563;

        }


        .show-password input {

            width: auto;

            margin: 0;

        }


        .forgot-password {

            display: block;

            text-align: right;

            margin-bottom: 18px;

            color: #5146e5;

            font-size: 14px;

            text-decoration: none;

        }


        .register-link {

            display: block;

            text-align: center;

            margin-top: 18px;

            color: #5146e5;

            font-size: 14px;

            text-decoration: none;

        }


        #message {

            margin-top: 18px;

            text-align: center;

            font-size: 14px;

            line-height: 1.5;

        }


        .error {

            color: #dc2626;

        }


        .success {

            color: #16a34a;

        }

    </style>

</head>


<body>


<div class="container">

    <div class="card">


        <div class="logo">

            <h1>🐾 VetClinic</h1>

            <p>Clinic Management System</p>

        </div>


        <label for="email">
            Email
        </label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            autocomplete="email"
        >


        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Enter your password"
            autocomplete="current-password"
        >


        <label class="show-password">

            <input
                type="checkbox"
                id="showPassword"
            >

            Show password

        </label>


        <a
            href="#"
            id="forgotPassword"
            class="forgot-password">

            Forgot Password?

        </a>


        <button
            id="loginButton"
            type="button">

            Login

        </button>


        <a
            href="register.html"
            class="register-link">

            Don't have an account? Register

        </a>


        <div id="message"></div>


    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

const SUPABASE_URL =
"https://zltbjbbofvvndxirlipf.supabase.co";


const SUPABASE_KEY =
"sb_publishable_MWH4JPfiiJ2gvIqYpKE_Yw_UAoAlnFJ";


const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


const emailInput =
document.getElementById("email");

const passwordInput =
document.getElementById("password");

const showPassword =
document.getElementById("showPassword");

const loginButton =
document.getElementById("loginButton");

const forgotPassword =
document.getElementById("forgotPassword");

const message =
document.getElementById("message");


/* =========================
   SHOW PASSWORD
========================= */

showPassword.addEventListener(
    "change",
    function() {

        passwordInput.type =
            showPassword.checked
            ? "text"
            : "password";

    }
);


/* =========================
   LOGIN
========================= */

loginButton.addEventListener(
    "click",
    async function() {

        const email =
            emailInput.value.trim();

        const password =
            passwordInput.value;


        if (!email || !password) {

            message.textContent =
                "Email dan password wajib diisi.";

            message.className =
                "error";

            return;

        }


        loginButton.disabled =
            true;

        message.textContent =
            "Logging in...";

        message.className = "";


        try {

            const {
                data,
                error
            } =
            await supabaseClient.auth
            .signInWithPassword({

                email: email,

                password: password

            });


            console.log(
                "Login result:",
                data,
                error
            );


            if (error) {

                message.textContent =
                    "Login gagal: " +
                    error.message;

                message.className =
                    "error";

                loginButton.disabled =
                    false;

                return;

            }


            message.textContent =
                "Login berhasil!";

            message.className =
                "success";


            setTimeout(
                function() {

                    window.location.href =
                        "index.html";

                },
                700
            );


        } catch (error) {

            console.error(error);

            message.textContent =
                "Terjadi kesalahan: " +
                error.message;

            message.className =
                "error";

            loginButton.disabled =
                false;

        }

    }
);


/* =========================
   FORGOT PASSWORD
========================= */

forgotPassword.addEventListener(
    "click",
    async function(event) {

        event.preventDefault();


        const email =
            emailInput.value.trim();


        if (!email) {

            message.textContent =
                "Masukkan email terlebih dahulu.";

            message.className =
                "error";

            emailInput.focus();

            return;

        }


        forgotPassword.style.pointerEvents =
            "none";


        message.textContent =
            "Mengirim link reset password...";

        message.className = "";


        try {

            const {
                error
            } =
            await supabaseClient.auth
            .resetPasswordForEmail(

                email,

                {

                    redirectTo:
                    "https://falroy18-spec.github.io/vetclinic/reset-password.html"

                }

            );


            if (error) {

                console.error(error);

                message.textContent =
                    "Gagal mengirim reset password: " +
                    error.message;

                message.className =
                    "error";

                forgotPassword.style.pointerEvents =
                    "auto";

                return;

            }


            message.textContent =
                "Link reset password sudah dikirim. Silakan cek inbox atau spam.";

            message.className =
                "success";


        } catch (error) {

            console.error(error);

            message.textContent =
                "Terjadi kesalahan: " +
                error.message;

            message.className =
                "error";

            forgotPassword.style.pointerEvents =
                "auto";

        }

    }
);

</script>


</body>

</html>
