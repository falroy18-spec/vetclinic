<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - VetClinic</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-card {
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            margin: 0;
            font-size: 28px;
            color: #252d3d;
        }

        .logo p {
            color: #6b7280;
            margin-bottom: 0;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 15px;
        }

        button {
            width: 100%;
            border: none;
            padding: 14px;
            border-radius: 8px;
            background: #5146e5;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .show-password {
            display: flex;
            align-items: center;
            gap: 7px;
            margin-bottom: 10px;
            font-size: 14px;
            font-weight: normal;
            color: #4b5563;
            cursor: pointer;
        }

        .show-password input {
            width: auto;
            margin: 0;
            cursor: pointer;
        }

        .forgot-password {
            display: block;
            text-align: right;
            margin-top: 0;
            margin-bottom: 18px;
            color: #5146e5;
            font-size: 14px;
            text-decoration: none;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        .register-link {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #5146e5;
            font-size: 14px;
            text-decoration: none;
        }

        .register-link:hover {
            text-decoration: underline;
        }

        .resend-button {
            display: none;
            margin-top: 10px;
            background: white;
            color: #5146e5;
            border: 1px solid #5146e5;
        }

        .resend-button:hover {
            background: #f5f3ff;
        }

        #message {
            margin-top: 18px;
            text-align: center;
            font-size: 14px;
            line-height: 1.5;
        }

        .error {
            color: #dc2626;
        }

        .success {
            color: #16a34a;
        }

        .info {
            color: #5146e5;
        }

    </style>

</head>

<body>

<div class="login-container">

    <div class="login-card">

        <div class="logo">

            <h1>🐾 VetClinic</h1>

            <p>Clinic Management System</p>

        </div>


        <label for="email">
            Email
        </label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            autocomplete="email"
        >


        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Enter your password"
            autocomplete="current-password"
        >


        <!-- SHOW PASSWORD -->

        <label class="show-password">

            <input
                type="checkbox"
                id="showPassword"
            >

            Show password

        </label>


        <a
            href="#"
            id="forgotPassword"
            class="forgot-password">
            Forgot Password?
        </a>


        <button
            id="loginButton"
            type="button">
            Login
        </button>


        <!-- RESEND CONFIRMATION -->

        <button
            id="resendButton"
            class="resend-button"
            type="button">
            Resend Confirmation Email
        </button>


        <a
            href="register.html"
            class="register-link">
            Don't have an account? Register
        </a>


        <div id="message"></div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://zltbjbbofvvndxirlipf.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_MWH4JPfiiJ2gvIqYpKE_Yw_UAoAlnFJ";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   ELEMENTS
===================================================== */

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const showPassword =
    document.getElementById("showPassword");

const loginButton =
    document.getElementById("loginButton");

const resendButton =
    document.getElementById("resendButton");

const forgotPassword =
    document.getElementById("forgotPassword");

const message =
    document.getElementById("message");


/* =====================================================
   REDIRECT URL
===================================================== */

const LOGIN_URL =
    "https://falroy18-spec.github.io/vetclinic/login.html";

const RESET_PASSWORD_URL =
    "https://falroy18-spec.github.io/vetclinic/reset-password.html";


/* =====================================================
   MESSAGE HELPER
===================================================== */

function showMessage(
    text,
    type = ""
) {

    message.textContent = text;

    message.className = type;

}


/* =====================================================
   SHOW / HIDE PASSWORD
===================================================== */

showPassword.addEventListener(
    "change",
    function() {

        passwordInput.type =
            showPassword.checked
                ? "text"
                : "password";

    }
);


/* =====================================================
   LOGIN
===================================================== */

loginButton.addEventListener(
    "click",
    async function() {

        const email =
            emailInput.value
                .trim()
                .toLowerCase();

        const password =
            passwordInput.value;


        resendButton.style.display =
            "none";


        /* VALIDATION */

        if (!email) {

            showMessage(
                "Email wajib diisi.",
                "error"
            );

            emailInput.focus();

            return;
        }


        if (!password) {

            showMessage(
                "Password wajib diisi.",
                "error"
            );

            passwordInput.focus();

            return;
        }


        /* LOADING */

        loginButton.disabled =
            true;

        showMessage(
            "Checking login...",
            "info"
        );


        try {

            /*
             * SIGN IN
             */

            const {
                data,
                error
            } =
            await supabaseClient.auth
                .signInWithPassword({

                    email: email,

                    password: password

                });


            console.log(
                "LOGIN RESULT:",
                data,
                error
            );


            /* ERROR */

            if (error) {

                console.error(
                    "LOGIN ERROR:",
                    error
                );


                /*
                 * EMAIL BELUM DIKONFIRMASI
                 */

                if (
                    error.code ===
                    "email_not_confirmed"
                    ||
                    error.message
                        ?.toLowerCase()
                        .includes(
                            "email not confirmed"
                        )
                ) {

                    showMessage(
                        "Email kamu belum dikonfirmasi. Silakan cek inbox/spam.",
                        "error"
                    );


                    resendButton.style.display =
                        "block";

                    loginButton.disabled =
                        false;

                    return;
                }


                /*
                 * PASSWORD SALAH /
                 * ACCOUNT TIDAK VALID
                 */

                showMessage(
                    "Login gagal. Email atau password tidak benar.",
                    "error"
                );


                loginButton.disabled =
                    false;

                return;
            }


            /*
             * DOUBLE CHECK SESSION
             */

            const {
                data: sessionData
            } =
            await supabaseClient.auth
                .getSession();


            if (
                !sessionData ||
                !sessionData.session
            ) {

                showMessage(
                    "Login belum menghasilkan session. Silakan coba lagi.",
                    "error"
                );

                loginButton.disabled =
                    false;

                return;
            }


            /*
             * SUCCESS
             */

            showMessage(
                "Login berhasil. Membuka dashboard...",
                "success"
            );


            setTimeout(
                function() {

                    window.location.href =
                        "index.html";

                },
                500
            );

        }

        catch (error) {

            console.error(
                "Unexpected login error:",
                error
            );


            showMessage(
                "Terjadi kesalahan: " +
                error.message,
                "error"
            );


            loginButton.disabled =
                false;

        }

    }
);


/* =====================================================
   RESEND CONFIRMATION EMAIL
===================================================== */

resendButton.addEventListener(
    "click",
    async function() {

        const email =
            emailInput.value
                .trim()
                .toLowerCase();


        if (!email) {

            showMessage(
                "Masukkan email terlebih dahulu.",
                "error"
            );

            emailInput.focus();

            return;
        }


        resendButton.disabled =
            true;

        showMessage(
            "Mengirim ulang email konfirmasi...",
            "info"
        );


        try {

            const {
                error
            } =
            await supabaseClient.auth
                .resend({

                    type: "signup",

                    email: email,

                    options: {

                        emailRedirectTo:
                            LOGIN_URL

                    }

                });


            if (error) {

                console.error(
                    "RESEND ERROR:",
                    error
                );


                showMessage(
                    "Gagal mengirim email konfirmasi: " +
                    error.message,
                    "error"
                );


                resendButton.disabled =
                    false;

                return;
            }


            showMessage(
                "Email konfirmasi sudah dikirim ulang. Silakan cek inbox atau folder spam.",
                "success"
            );


            resendButton.disabled =
                false;

        }

        catch (error) {

            console.error(error);

            showMessage(
                "Error: " +
                error.message,
                "error"
            );

            resendButton.disabled =
                false;

        }

    }
);


/* =====================================================
   FORGOT PASSWORD
===================================================== */

forgotPassword.addEventListener(
    "click",
    async function(event) {

        event.preventDefault();


        const email =
            emailInput.value
                .trim()
                .toLowerCase();


        if (!email) {

            showMessage(
                "Masukkan email terlebih dahulu.",
                "error"
            );

            emailInput.focus();

            return;
        }


        forgotPassword.style.pointerEvents =
            "none";


        showMessage(
            "Mengirim link reset password...",
            "info"
        );


        try {

            const {
                error
            } =
            await supabaseClient.auth
                .resetPasswordForEmail(

                    email,

                    {

                        redirectTo:
                            RESET_PASSWORD_URL

                    }

                );


            if (error) {

                console.error(
                    "RESET ERROR:",
                    error
                );


                showMessage(
                    "Gagal mengirim reset password: " +
                    error.message,
                    "error"
                );


                forgotPassword.style.pointerEvents =
                    "auto";

                return;
            }


            showMessage(
                "Link reset password sudah dikirim. Silakan cek inbox atau spam.",
                "success"
            );


        }

        catch (error) {

            console.error(error);

            showMessage(
                "Error: " +
                error.message,
                "error"
            );

        }


        forgotPassword.style.pointerEvents =
            "auto";

    }
);


/* =====================================================
   HANDLE EMAIL CONFIRMATION REDIRECT
===================================================== */

supabaseClient.auth.onAuthStateChange(
    function(event, session) {

        console.log(
            "AUTH EVENT:",
            event,
            session
        );

        /*
         * Setelah user klik confirmation email,
         * Supabase akan mendeteksi session.
         *
         * Kita biarkan user tetap di login page
         * supaya bisa melihat status.
         */

        if (
            event === "SIGNED_IN" &&
            session
        ) {

            /*
             * Jika datang dari email confirmation,
             * session sudah valid.
             */

            if (
                window.location.hash
                    .includes("access_token")
            ) {

                showMessage(
                    "Email berhasil dikonfirmasi. Kamu sudah bisa masuk ke VetClinic.",
                    "success"
                );

                setTimeout(
                    function() {

                        window.location.href =
                            "index.html";

                    },
                    700
                );

            }

        }

    }
);

</script>

</body>

</html>
