<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password - VetClinic</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        h1 {
            margin-top: 0;
            color: #273043;
            font-size: 28px;
        }

        p {
            color: #667085;
            line-height: 1.5;
        }

        label {
            display: block;
            margin-top: 20px;
            margin-bottom: 7px;
            font-weight: bold;
            color: #273043;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d0d5dd;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #5146e5;
            color: white;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #4338ca;
        }

        #message {
            margin-top: 18px;
            font-size: 14px;
        }

        .success {
            color: #16803c;
        }

        .error {
            color: #d92d20;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🔐 Reset Password</h1>

    <p>
        Create a new password for your VetClinic account.
    </p>

    <form id="resetForm">

        <label for="password">
            New Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Enter new password"
            minlength="6"
            required
        >

        <label for="confirmPassword">
            Confirm Password
        </label>

        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm new password"
            minlength="6"
            required
        >

        <button type="submit">
            Update Password
        </button>

    </form>

    <div id="message"></div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://zltbjbbofvndxirlipf.supabase.co";

const SUPABASE_KEY =
"sb_publishable_MWH4JPfiiJ2gvIqYpKE_Yw_UAoAlnFJ";


const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


const form =
document.getElementById("resetForm");

const message =
document.getElementById("message");


form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        const password =
            document.getElementById("password").value;

        const confirmPassword =
            document.getElementById("confirmPassword").value;


        message.textContent = "";
        message.className = "";


        if(password.length < 6){

            message.textContent =
                "Password must be at least 6 characters.";

            message.className = "error";

            return;
        }


        if(password !== confirmPassword){

            message.textContent =
                "Passwords do not match.";

            message.className = "error";

            return;
        }


        const {
            data,
            error
        } =
        await supabaseClient.auth.updateUser({

            password: password

        });


        if(error){

            console.error(error);

            message.textContent =
                error.message;

            message.className = "error";

            return;
        }


        message.textContent =
            "Password updated successfully. Redirecting to login...";

        message.className = "success";


        setTimeout(
            function(){

                window.location.href =
                    "login.html";

            },
            2000
        );

    }
);

</script>

</body>
</html>
