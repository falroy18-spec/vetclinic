<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Reset Password - VetClinic</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background: #f4f6fb;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

        }


        .container {

            width: 100%;

            max-width: 420px;

            padding: 20px;

        }


        .card {

            background: white;

            border-radius: 16px;

            padding: 40px;

            box-shadow:
                0 10px 30px rgba(0,0,0,0.08);

        }


        .logo {

            text-align: center;

            margin-bottom: 30px;

        }


        .logo h1 {

            margin: 0;

            font-size: 28px;

            color: #252d3d;

        }


        .logo p {

            color: #6b7280;

            margin-top: 8px;

        }


        label {

            display: block;

            margin-bottom: 7px;

            font-weight: 600;

            color: #374151;

        }


        input {

            width: 100%;

            padding: 13px;

            border: 1px solid #d1d5db;

            border-radius: 8px;

            margin-bottom: 16px;

            font-size: 15px;

        }


        button {

            width: 100%;

            border: none;

            padding: 14px;

            border-radius: 8px;

            background: #5146e5;

            color: white;

            font-size: 16px;

            font-weight: 600;

            cursor: pointer;

            margin-top: 8px;

        }


        button:disabled {

            opacity: 0.6;

            cursor: not-allowed;

        }


        .show-password {

            display: flex;

            align-items: center;

            gap: 7px;

            margin-bottom: 10px;

            font-size: 14px;

            font-weight: normal;

            color: #4b5563;

        }


        .show-password input {

            width: auto;

            margin: 0;

        }


        .back-login {

            display: block;

            text-align: center;

            margin-top: 18px;

            color: #5146e5;

            font-size: 14px;

            text-decoration: none;

        }


        #status {

            text-align: center;

            color: #6b7280;

            line-height: 1.5;

        }


        #message {

            margin-top: 18px;

            text-align: center;

            font-size: 14px;

            line-height: 1.5;

        }


        .success {

            color: #16a34a;

        }


        .error {

            color: #dc2626;

        }


        #resetForm {

            display: none;

        }

    </style>

</head>


<body>


<div class="container">

    <div class="card">


        <div class="logo">

            <h1>🐾 VetClinic</h1>

            <p>Reset Password</p>

        </div>


        <p id="status">
            Verifying your reset link...
        </p>


        <form id="resetForm">


            <label for="password">
                New Password
            </label>

            <input
                type="password"
                id="password"
                minlength="6"
                placeholder="Minimum 6 characters"
                autocomplete="new-password"
                required
            >


            <label class="show-password">

                <input
                    type="checkbox"
                    id="showPassword"
                >

                Show password

            </label>


            <label for="confirmPassword">
                Confirm New Password
            </label>

            <input
                type="password"
                id="confirmPassword"
                minlength="6"
                placeholder="Repeat new password"
                autocomplete="new-password"
                required
            >


            <label class="show-password">

                <input
                    type="checkbox"
                    id="showConfirmPassword"
                >

                Show confirm password

            </label>


            <button
                id="resetButton"
                type="submit">

                Update Password

            </button>


        </form>


        <a
            href="login.html"
            class="back-login">

            Back to Login

        </a>


        <div id="message"></div>


    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

const SUPABASE_URL =
"https://zltbjbbofvvndxirlipf.supabase.co";


const SUPABASE_KEY =
"sb_publishable_MWH4JPfiiJ2gvIqYpKE_Yw_UAoAlnFJ";


const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


const form =
document.getElementById("resetForm");

const statusText =
document.getElementById("status");

const passwordInput =
document.getElementById("password");

const confirmPasswordInput =
document.getElementById("confirmPassword");

const showPassword =
document.getElementById("showPassword");

const showConfirmPassword =
document.getElementById("showConfirmPassword");

const resetButton =
document.getElementById("resetButton");

const message =
document.getElementById("message");


/* =========================
   SHOW PASSWORD
========================= */

showPassword.addEventListener(
    "change",
    function() {

        passwordInput.type =
            showPassword.checked
            ? "text"
            : "password";

    }
);


showConfirmPassword.addEventListener(
    "change",
    function() {

        confirmPasswordInput.type =
            showConfirmPassword.checked
            ? "text"
            : "password";

    }
);


/* =========================
   AUTH STATE
========================= */

let recoverySessionFound =
    false;


supabaseClient.auth.onAuthStateChange(
    function(event, session) {

        console.log(
            "Auth event:",
            event
        );


        if (
            event === "PASSWORD_RECOVERY"
            && session
        ) {

            recoverySessionFound =
                true;

            statusText.textContent =
                "Please create your new password.";

            statusText.className =
                "success";

            form.style.display =
                "block";

        }

    }
);


/* =========================
   CHECK EXISTING SESSION
========================= */

async function checkSession() {

    try {

        const {
            data,
            error
        } =
        await supabaseClient.auth
        .getSession();


        if (error) {

            console.error(error);

            statusText.textContent =
                "Unable to verify reset link.";

            statusText.className =
                "error";

            return;

        }


        if (data.session) {

            statusText.textContent =
                "Please create your new password.";

            statusText.className =
                "success";

            form.style.display =
                "block";

            return;

        }


        /*
            Jika belum ada session,
            tunggu event PASSWORD_RECOVERY.
        */

        setTimeout(
            function() {

                if (!recoverySessionFound) {

                    statusText.textContent =
                        "This reset link is invalid or has expired.";

                    statusText.className =
                        "error";

                }

            },
            1500
        );


    } catch (error) {

        console.error(error);

        statusText.textContent =
            "Unable to verify reset link.";

        statusText.className =
            "error";

    }

}


checkSession();


/* =========================
   UPDATE PASSWORD
========================= */

form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const password =
            passwordInput.value;

        const confirmPassword =
            confirmPasswordInput.value;


        message.textContent =
            "";

        message.className =
            "";


        if (password.length < 6) {

            message.textContent =
                "Password minimal 6 karakter.";

            message.className =
                "error";

            return;

        }


        if (password !== confirmPassword) {

            message.textContent =
                "Password dan konfirmasi password tidak sama.";

            message.className =
                "error";

            return;

        }


        resetButton.disabled =
            true;

        resetButton.textContent =
            "Updating...";


        try {

            const {
                data,
                error
            } =
            await supabaseClient.auth
            .updateUser({

                password: password

            });


            console.log(
                "Update password:",
                data,
                error
            );


            if (error) {

                console.error(error);

                message.textContent =
                    "Gagal mengubah password: " +
                    error.message;

                message.className =
                    "error";

                resetButton.disabled =
                    false;

                resetButton.textContent =
                    "Update Password";

                return;

            }


            message.textContent =
                "Password berhasil diubah. Mengarahkan ke login...";

            message.className =
                "success";


            await supabaseClient.auth.signOut();


            setTimeout(
                function() {

                    window.location.href =
                        "login.html";

                },
                1500
            );


        } catch (error) {

            console.error(error);

            message.textContent =
                "Terjadi kesalahan: " +
                error.message;

            message.className =
                "error";

            resetButton.disabled =
                false;

            resetButton.textContent =
                "Update Password";

        }

    }
);

</script>


</body>

</html>
