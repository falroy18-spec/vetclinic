<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Backup & Restore - VetClinic</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6fb;
    color: #252d3d;
}

.container {
    max-width: 1000px;
    margin: auto;
    padding: 30px;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

.header h1 {
    margin: 0;
}

.header p {
    color: #6b7280;
}

.card {
    background: white;
    border-radius: 14px;
    padding: 25px;
    margin-bottom: 20px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.06);
}

button {
    border: none;
    border-radius: 8px;
    padding: 12px 18px;
    cursor: pointer;
    font-weight: 600;
    margin-right: 8px;
    margin-bottom: 8px;
}

.primary {
    background: #5146e5;
    color: white;
}

.success {
    background: #16a34a;
    color: white;
}

.secondary {
    background: #e5e7eb;
    color: #374151;
}

input[type="file"] {
    margin: 15px 0;
    width: 100%;
}

#message {
    margin-top: 15px;
    line-height: 1.6;
}

.error {
    color: #dc2626;
}

.ok {
    color: #16a34a;
}

.warning {
    color: #b45309;
}

</style>

</head>

<body>

<div class="container">

    <div class="header">

        <div>

            <h1>💾 Backup & Restore</h1>

            <p>
                VetClinic database backup
            </p>

        </div>

        <button
            class="secondary"
            type="button"
            onclick="window.location.href='index.html'">

            Dashboard

        </button>

    </div>


    <div class="card">

        <h2>Backup Database</h2>

        <p>
            Download your VetClinic data as a JSON file.
        </p>

        <button
            class="primary"
            id="backupButton"
            type="button">

            Download Backup

        </button>

    </div>


    <div class="card">

        <h2>Restore Database</h2>

        <p>
            Select a VetClinic backup JSON file.
        </p>

        <input
            type="file"
            id="restoreFile"
            accept=".json">

        <br>

        <button
            class="success"
            id="restoreButton"
            type="button">

            Restore Backup

        </button>

        <p class="warning">
            Existing records with the same ID will be updated.
        </p>

    </div>


    <div class="card">

        <h2>Status</h2>

        <div id="message">
            Ready.
        </div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://zltbjbbofvvndxirlipf.supabase.co";


const SUPABASE_KEY =
"sb_publishable_MWH4JPfiiJ2gvIqYpKE_Yw_UAoAlnFJ";


const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* LOGIN CHECK */

supabaseClient.auth.getSession()
.then(({ data: { session } }) => {

    if (!session) {

        window.location.href =
            "login.html";

    }

});


/* DATABASE TABLES */

const tables = [

    "patients",
    "medical_records",
    "appointments",
    "medicines",
    "invoices",
    "invoice_items"

];


const message =
document.getElementById("message");


function showMessage(
    text,
    type = ""
) {

    message.textContent =
        text;

    message.className =
        type;

}


/* =========================
   BACKUP
========================= */

document.getElementById(
    "backupButton"
).addEventListener(
    "click",
    async function() {

        showMessage(
            "Creating backup..."
        );

        try {

            const backup = {

                backup_version:
                    "1.0",

                created_at:
                    new Date().toISOString(),

                data: {}

            };


            for (
                const table of tables
            ) {

                showMessage(
                    "Backing up " +
                    table +
                    "..."
                );


                const {
                    data,
                    error
                } =
                await supabaseClient
                    .from(table)
                    .select("*");


                if (error) {

                    throw new Error(
                        table +
                        ": " +
                        error.message
                    );

                }


                backup.data[table] =
                    data || [];

            }


            const json =
                JSON.stringify(
                    backup,
                    null,
                    2
                );


            const blob =
                new Blob(
                    [json],
                    {
                        type:
                            "application/json"
                    }
                );


            const url =
                URL.createObjectURL(
                    blob
                );


            const link =
                document.createElement(
                    "a"
                );


            link.href = url;


            link.download =
                "vetclinic-backup-" +
                new Date()
                    .toISOString()
                    .slice(0, 10) +
                ".json";


            document.body.appendChild(link);

            link.click();

            document.body.removeChild(link);


            URL.revokeObjectURL(url);


            showMessage(
                "Backup berhasil dibuat.",
                "ok"
            );


        } catch (error) {

            console.error(error);

            showMessage(
                "Backup gagal: " +
                error.message,
                "error"
            );

        }

    }
);


/* =========================
   RESTORE
========================= */

document.getElementById(
    "restoreButton"
).addEventListener(
    "click",
    async function() {

        const file =
            document.getElementById(
                "restoreFile"
            ).files[0];


        if (!file) {

            showMessage(
                "Pilih file backup terlebih dahulu.",
                "error"
            );

            return;

        }


        const confirmed =
            confirm(
                "Restore backup sekarang?\n\n" +
                "Data dengan ID yang sama " +
                "akan diperbarui."
            );


        if (!confirmed) {

            return;

        }


        showMessage(
            "Reading backup..."
        );


        try {

            const text =
                await file.text();


            const backup =
                JSON.parse(text);


            if (
                !backup ||
                !backup.data
            ) {

                throw new Error(
                    "Invalid backup file."
                );

            }


            for (
                const table of tables
            ) {

                const rows =
                    backup.data[table];


                if (
                    !rows ||
                    rows.length === 0
                ) {

                    continue;

                }


                showMessage(
                    "Restoring " +
                    table +
                    "..."
                );


                /*
                UPSERT:
                ID belum ada  -> INSERT
                ID sudah ada  -> UPDATE
                */

                const {
                    error
                } =
                await supabaseClient
                    .from(table)
                    .upsert(
                        rows,
                        {
                            onConflict: "id"
                        }
                    );


                if (error) {

                    throw new Error(
                        table +
                        ": " +
                        error.message
                    );

                }

            }


            showMessage(
                "Restore berhasil.",
                "ok"
            );


        } catch (error) {

            console.error(error);

            showMessage(
                "Restore gagal: " +
                error.message,
                "error"
            );

        }

    }
);

</script>

</body>

</html>
