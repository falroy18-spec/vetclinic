<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>New Appointment - VetClinic</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <aside class="sidebar">

        <h1>🐾 VetClinic</h1>

        <nav>

            <a href="index.html">Dashboard</a>

            <a href="patients.html">Patients</a>

            <a href="appointments.html" class="active">
                Appointments
            </a>

            <a href="medical-records.html">
                Medical Records
            </a>

            <a href="medicines.html">
                Medicines
            </a>

            <a href="billing.html">
                Billing
            </a>

            <a href="reports.html">
                Reports
            </a>

        </nav>

    </aside>


    <main class="main-content">

        <header>

            <div>

                <h2>
                    New Appointment
                </h2>

                <p>
                    Schedule a patient appointment.
                </p>

            </div>

        </header>


        <section class="appointments">

            <h3>
                Appointment Information
            </h3>


            <form id="appointmentForm">


                <div class="form-group">

                    <label>
                        Patient
                    </label>

                    <select
                        id="appointmentPatient"
                        required
                    >

                        <option value="">
                            Select patient
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>
                        Date
                    </label>

                    <input
                        type="date"
                        id="appointmentDate"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Time
                    </label>

                    <input
                        type="time"
                        id="appointmentTime"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Veterinarian
                    </label>

                    <input
                        type="text"
                        id="appointmentVet"
                        placeholder="Veterinarian name"
                    >

                </div>


                <div class="form-group">

                    <label>
                        Reason / Complaint
                    </label>

                    <textarea
                        id="appointmentReason"
                        placeholder="Reason for visit"
                    ></textarea>

                </div>


                <div class="form-group">

                    <label>
                        Status
                    </label>

                    <select id="appointmentStatus">

                        <option value="Scheduled">
                            Scheduled
                        </option>

                        <option value="Completed">
                            Completed
                        </option>

                        <option value="Cancelled">
                            Cancelled
                        </option>

                    </select>

                </div>


                <div class="form-actions">

                    <a
                        href="appointments.html"
                        class="cancel-button"
                    >
                        Cancel
                    </a>

                    <button type="submit">
                        Save Appointment
                    </button>

                </div>

            </form>

        </section>

    </main>

</div>


<script>

const patientSelect =
    document.getElementById(
        "appointmentPatient"
    );


const patients =
    JSON.parse(
        localStorage.getItem("patients")
    ) || [];


const params =
    new URLSearchParams(
        window.location.search
    );


const selectedPatient =
    params.get("patientId");


patients.forEach(patient => {

    const option =
        document.createElement("option");

    option.value =
        patient.id;

    option.textContent =
        `${patient.name} • ${patient.species || ""}`;

    if (
        String(patient.id) ===
        String(selectedPatient)
    ) {

        option.selected = true;

    }

    patientSelect.appendChild(option);

});


document
    .getElementById("appointmentForm")
    .addEventListener(
        "submit",
        function(event) {

            event.preventDefault();


            const patientId =
                patientSelect.value;


            const patient =
                patients.find(
                    p =>
                        String(p.id) ===
                        String(patientId)
                );


            if (!patient) {

                alert(
                    "Please select a patient."
                );

                return;

            }


            const appointment = {

                id: Date.now(),

                patientId:
                    patient.id,

                patient:
                    patient.name,

                species:
                    patient.species || "",

                date:
                    document.getElementById(
                        "appointmentDate"
                    ).value,

                time:
                    document.getElementById(
                        "appointmentTime"
                    ).value,

                veterinarian:
                    document.getElementById(
                        "appointmentVet"
                    ).value,

                reason:
                    document.getElementById(
                        "appointmentReason"
                    ).value,

                status:
                    document.getElementById(
                        "appointmentStatus"
                    ).value

            };


            const appointments =
                JSON.parse(
                    localStorage.getItem(
                        "appointments"
                    )
                ) || [];


            appointments.push(
                appointment
            );


            localStorage.setItem(
                "appointments",
                JSON.stringify(
                    appointments
                )
            );


            window.location.href =
                `appointments.html`;

        }
    );

</script>


<script src="script.js"></script>

</body>

</html>
