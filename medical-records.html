<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Medical Records - VetClinic</title>

<link rel="stylesheet" href="style.css">

<style>

.medical-wrapper {
    width: 100%;
}

.search-area {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
}

.search-area input {
    flex: 1;
    padding: 12px 14px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 14px;
}

.search-area button {
    padding: 12px 18px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    background: #e5e7eb;
}

.patient-results {
    display: grid;
    gap: 10px;
}

.patient-item {
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 15px;
    cursor: pointer;
}

.patient-item:hover {
    background: #f8f8ff;
    border-color: #6366f1;
}

.patient-item.active {
    background: #eef2ff;
    border-color: #6366f1;
}

.patient-item-name {
    font-size: 17px;
    font-weight: bold;
}

.patient-item-info {
    color: #6b7280;
    font-size: 13px;
    margin-top: 5px;
}

.selected-patient {
    background: #eef2ff;
    border: 1px solid #c7d2fe;
    border-radius: 10px;
    padding: 18px;
    margin-bottom: 20px;
}

.selected-patient h3 {
    margin: 0 0 6px;
}

.selected-patient p {
    margin: 4px 0;
    color: #6b7280;
}

.history-card {
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 15px;
}

.history-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 15px;
}

.history-date {
    color: #6b7280;
    font-size: 13px;
    margin-top: 4px;
}

.history-buttons {
    display: flex;
    gap: 8px;
}

.history-buttons button {
    border: none;
    border-radius: 7px;
    padding: 8px 12px;
    cursor: pointer;
}

.edit-button {
    background: #f59e0b;
    color: white;
}

.delete-button {
    background: #dc2626;
    color: white;
}

.soap-section {
    margin-top: 18px;
}

.soap-title {
    font-weight: bold;
    margin-bottom: 7px;
}

.soap-content {
    background: #f8fafc;
    border-radius: 8px;
    padding: 13px;
    white-space: pre-wrap;
    line-height: 1.5;
}

.objective-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
}

.objective-box {
    background: #f8fafc;
    border-radius: 8px;
    padding: 12px;
}

.objective-label {
    font-size: 12px;
    color: #6b7280;
}

.objective-value {
    margin-top: 4px;
    font-weight: bold;
}

.empty-state {
    padding: 30px;
    text-align: center;
    color: #6b7280;
}

.error-state {
    padding: 20px;
    background: #fef2f2;
    color: #b91c1c;
    border-radius: 8px;
}

@media(max-width:800px) {

    .objective-grid {
        grid-template-columns: 1fr 1fr;
    }

    .history-top {
        flex-direction: column;
    }

}

@media(max-width:500px) {

    .search-area {
        flex-direction: column;
    }

    .objective-grid {
        grid-template-columns: 1fr;
    }

}

</style>

</head>


<body>

<div class="app">


<!-- SIDEBAR -->

<aside class="sidebar">

    <h1>🐾 VetClinic</h1>

    <nav>

        <a href="index.html">
            Dashboard
        </a>

        <a href="patients.html">
            Patients
        </a>

        <a href="appointments.html">
            Appointments
        </a>

        <a href="medical-records.html"
           class="active">
            Medical Records
        </a>

        <a href="medicines.html">
            Medicines
        </a>

        <a href="billing.html">
            Billing
        </a>

        <a href="reports.html">
            Reports
        </a>

    </nav>

</aside>


<!-- MAIN -->

<main class="main-content">


<header>

    <div>

        <h2>
            Medical Records
        </h2>

        <p>
            Search and view medical history by patient.
        </p>

    </div>

</header>


<div class="medical-wrapper">


<!-- SEARCH PATIENT -->

<section class="appointments">

    <h3>
        Search Patient
    </h3>


    <div class="search-area">

        <input
            type="text"
            id="patientSearch"
            placeholder="Search patient name or owner..."
            autocomplete="off"
        >


        <button
            type="button"
            id="showAllButton"
        >
            Show All
        </button>

    </div>


    <div
        id="patientResults"
        class="patient-results"
    >

        <div class="empty-state">
            Loading patients...
        </div>

    </div>

</section>


<!-- SELECTED PATIENT HISTORY -->

<section
    class="appointments"
    id="historySection"
    style="display:none;"
>


    <div
        id="selectedPatient"
        class="selected-patient"
    >

        <h3 id="selectedPatientName">
            -
        </h3>


        <p id="selectedPatientDetails">
            -
        </p>


        <p id="selectedPatientOwner">
            -
        </p>

    </div>


    <h3>
        Medical History
    </h3>


    <div id="medicalHistory">

        <div class="empty-state">

            Select a patient.

        </div>

    </div>


</section>


</div>


</main>

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="clinic-context.js"></script>


<script>


/* =====================================================
   GLOBAL
===================================================== */


let currentClinic = null;

let allPatients = [];

let selectedPatientId = null;


/* =====================================================
   ELEMENTS
===================================================== */


const patientSearch =
    document.getElementById(
        "patientSearch"
    );


const patientResults =
    document.getElementById(
        "patientResults"
    );


const historySection =
    document.getElementById(
        "historySection"
    );


const medicalHistory =
    document.getElementById(
        "medicalHistory"
    );


const selectedPatientName =
    document.getElementById(
        "selectedPatientName"
    );


const selectedPatientDetails =
    document.getElementById(
        "selectedPatientDetails"
    );


const selectedPatientOwner =
    document.getElementById(
        "selectedPatientOwner"
    );


/* =====================================================
   ESCAPE
===================================================== */


function escapeHTML(value) {

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =====================================================
   LOAD PATIENTS
===================================================== */


async function loadPatients() {


    patientResults.innerHTML = `

        <div class="empty-state">

            Loading patients...

        </div>

    `;


    const {
        data,
        error
    } =
    await supabaseClient

        .from("patients")

        .select(`
            id,
            name,
            species,
            breed,
            sex,
            owner_name,
            owner,
            phone,
            clinic_id
        `)

        .eq(
            "clinic_id",
            currentClinic.clinicId
        )

        .order(
            "name",
            {
                ascending: true
            }
        );


    if (error) {

        console.error(
            "PATIENT ERROR:",
            error
        );


        patientResults.innerHTML = `

            <div class="error-state">

                Failed to load patients.

                <br><br>

                ${escapeHTML(
                    error.message
                )}

            </div>

        `;

        return;

    }


    allPatients =
        data || [];


    renderPatients(
        allPatients
    );

}


/* =====================================================
   RENDER PATIENTS
===================================================== */


function renderPatients(
    patients
) {


    if (
        !patients ||
        patients.length === 0
    ) {

        patientResults.innerHTML = `

            <div class="empty-state">

                No patient found.

            </div>

        `;

        return;

    }


    patientResults.innerHTML =
        "";


    patients.forEach(
        patient => {


            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "patient-item";


            if (
                patient.id ===
                selectedPatientId
            ) {

                div.classList.add(
                    "active"
                );

            }


            const owner =
                patient.owner_name ||
                patient.owner ||
                "-";


            div.innerHTML = `

                <div class="patient-item-name">

                    🐾
                    ${escapeHTML(
                        patient.name
                    )}

                </div>


                <div class="patient-item-info">

                    ${escapeHTML(
                        patient.species ||
                        "-"
                    )}

                    ${
                        patient.breed
                        ? " • " +
                          escapeHTML(
                              patient.breed
                          )
                        : ""
                    }

                    ${
                        patient.sex
                        ? " • " +
                          escapeHTML(
                              patient.sex
                          )
                        : ""
                    }

                    <br>

                    Owner:
                    ${escapeHTML(
                        owner
                    )}

                </div>

            `;


            div.addEventListener(
                "click",
                function() {

                    selectPatient(
                        patient.id
                    );

                }
            );


            patientResults.appendChild(
                div
            );

        }
    );

}


/* =====================================================
   SEARCH
===================================================== */


patientSearch.addEventListener(
    "input",
    function() {


        const keyword =
            this.value
                .trim()
                .toLowerCase();


        if (!keyword) {

            renderPatients(
                allPatients
            );

            return;

        }


        const filtered =
            allPatients.filter(
                patient => {


                    const patientName =
                        String(
                            patient.name ||
                            ""
                        )
                        .toLowerCase();


                    const ownerName =
                        String(
                            patient.owner_name ||
                            patient.owner ||
                            ""
                        )
                        .toLowerCase();


                    return (

                        patientName.includes(
                            keyword
                        )

                        ||

                        ownerName.includes(
                            keyword
                        )

                    );

                }
            );


        renderPatients(
            filtered
        );

    }
);


/* =====================================================
   SHOW ALL
===================================================== */


document
    .getElementById(
        "showAllButton"
    )
    .addEventListener(
        "click",
        function() {


            patientSearch.value =
                "";


            selectedPatientId =
                null;


            historySection.style.display =
                "none";


            renderPatients(
                allPatients
            );

        }
    );


/* =====================================================
   SELECT PATIENT
===================================================== */


async function selectPatient(
    patientId
) {


    const patient =
        allPatients.find(
            item =>
                item.id ===
                patientId
        );


    if (!patient) {

        return;

    }


    selectedPatientId =
        patientId;


    historySection.style.display =
        "block";


    selectedPatientName
        .textContent =
        patient.name;


    selectedPatientDetails
        .textContent =

        (
            patient.species ||
            "-"
        )

        +

        (
            patient.breed
            ? " • " +
              patient.breed
            : ""
        )

        +

        (
            patient.sex
            ? " • " +
              patient.sex
            : ""
        );


    selectedPatientOwner
        .textContent =

        "Owner: " +

        (
            patient.owner_name ||
            patient.owner ||
            "-"
        );


    renderPatients(
        getFilteredPatients()
    );


    await loadMedicalHistory(
        patientId
    );


}


/* =====================================================
   FILTERED PATIENTS
===================================================== */


function getFilteredPatients() {


    const keyword =
        patientSearch.value
            .trim()
            .toLowerCase();


    if (!keyword) {

        return allPatients;

    }


    return allPatients.filter(
        patient => {


            const patientName =
                String(
                    patient.name ||
                    ""
                )
                .toLowerCase();


            const ownerName =
                String(
                    patient.owner_name ||
                    patient.owner ||
                    ""
                )
                .toLowerCase();


            return (

                patientName.includes(
                    keyword
                )

                ||

                ownerName.includes(
                    keyword
                )

            );

        }
    );

}


/* =====================================================
   LOAD MEDICAL HISTORY
===================================================== */


async function loadMedicalHistory(
    patientId
) {


    medicalHistory.innerHTML = `

        <div class="empty-state">

            Loading medical history...

        </div>

    `;


    const {
        data,
        error
    } =
    await supabaseClient

        .from("medical_records")

        .select("*")

        .eq(
            "patient_id",
            patientId
        )

        .order(
            "created_at",
            {
                ascending: false
            }
        );


    if (error) {

        console.error(
            "MEDICAL RECORD ERROR:",
            error
        );


        medicalHistory.innerHTML = `

            <div class="error-state">

                Failed to load medical history.

                <br><br>

                ${escapeHTML(
                    error.message
                )}

            </div>

        `;

        return;

    }


    if (
        !data ||
        data.length === 0
    ) {

        medicalHistory.innerHTML = `

            <div class="empty-state">

                No medical records found for

                <strong>
                    ${escapeHTML(
                        selectedPatientName.textContent
                    )}
                </strong>.

            </div>

        `;

        return;

    }


    medicalHistory.innerHTML =
        "";


    data.forEach(
        record => {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "history-card";


            const visitDate =
                record.visit_date ||
                record.created_at;


            let formattedDate =
                "-";


            if (visitDate) {

                formattedDate =
                    new Date(
                        visitDate
                    ).toLocaleString(
                        "en-GB",
                        {
                            dateStyle:
                                "medium",
                            timeStyle:
                                "short"
                        }
                    );

            }


            const objective =
                parseObjective(
                    record.objective
                );


            card.innerHTML = `

                <div class="history-top">


                    <div>

                        <strong>
                            Medical Visit
                        </strong>

                        <div class="history-date">

                            ${escapeHTML(
                                formattedDate
                            )}

                        </div>

                    </div>


                    <div class="history-buttons">


                        <button
                            type="button"
                            class="edit-button"
                            onclick="editMedicalRecord('${record.id}')"
                        >

                            Edit

                        </button>


                        <button
                            type="button"
                            class="delete-button"
                            onclick="deleteMedicalRecord('${record.id}')"
                        >

                            Delete

                        </button>


                    </div>


                </div>


                ${
                    record.chief_complaint
                    ? `

                        <div class="soap-section">

                            <div class="soap-title">

                                Chief Complaint

                            </div>

                            <div class="soap-content">

                                ${escapeHTML(
                                    record.chief_complaint
                                )}

                            </div>

                        </div>

                    `
                    : ""
                }


                ${
                    record.subjective
                    ? `

                        <div class="soap-section">

                            <div class="soap-title">

                                S — Subjective

                            </div>

                            <div class="soap-content">

                                ${escapeHTML(
                                    record.subjective
                                )}

                            </div>

                        </div>

                    `
                    : ""
                }


                <div class="soap-section">

                    <div class="soap-title">

                        O — Objective

                    </div>


                    <div class="objective-grid">


                        <div class="objective-box">

                            <div class="objective-label">
                                Temperature
                            </div>

                            <div class="objective-value">

                                ${
                                    objective.temperature
                                    || "-"
                                }

                                ${
                                    objective.temperature
                                    ? " °C"
                                    : ""
                                }

                            </div>

                        </div>


                        <div class="objective-box">

                            <div class="objective-label">
                                Heart Rate
                            </div>

                            <div class="objective-value">

                                ${
                                    objective.heartRate
                                    || "-"
                                }

                                ${
                                    objective.heartRate
                                    ? " bpm"
                                    : ""
                                }

                            </div>

                        </div>


                        <div class="objective-box">

                            <div class="objective-label">
                                Respiratory Rate
                            </div>

                            <div class="objective-value">

                                ${
                                    objective.respiratoryRate
                                    || "-"
                                }

                                ${
                                    objective.respiratoryRate
                                    ? " rpm"
                                    : ""
                                }

                            </div>

                        </div>


                        <div class="objective-box">

                            <div class="objective-label">
                                Weight
                            </div>

                            <div class="objective-value">

                                ${
                                    objective.weight
                                    || "-"
                                }

                                ${
                                    objective.weight
                                    ? " kg"
                                    : ""
                                }

                            </div>

                        </div>


                        <div class="objective-box">

                            <div class="objective-label">
                                CRT
                            </div>

                            <div class="objective-value">

                                ${
                                    objective.crt
                                    || "-"
                                }

                                ${
                                    objective.crt
                                    ? " sec"
                                    : ""
                                }

                            </div>

                        </div>


                        <div class="objective-box">

                            <div class="objective-label">
                                Mucous Membrane
                            </div>

                            <div class="objective-value">

                                ${escapeHTML(
                                    objective.mucous ||
                                    "-"
                                )}

                            </div>

                        </div>


                        <div class="objective-box">

                            <div class="objective-label">
                                BCS
                            </div>

                            <div class="objective-value">

                                ${
                                    objective.bcs
                                    || "-"
                                }

                                ${
                                    objective.bcs
                                    ? "/9"
                                    : ""
                                }

                            </div>

                        </div>


                    </div>


                    ${
                        objective.additional
                        ? `

                            <div
                                class="soap-content"
                                style="margin-top:10px;"
                            >

                                ${escapeHTML(
                                    objective.additional
                                )}

                            </div>

                        `
                        : ""
                    }


                </div>


                ${
                    record.assessment
                    ? `

                        <div class="soap-section">

                            <div class="soap-title">

                                A — Assessment

                            </div>

                            <div class="soap-content">

                                ${escapeHTML(
                                    record.assessment
                                )}

                            </div>

                        </div>

                    `
                    : ""
                }


                ${
                    record.plan
                    ? `

                        <div class="soap-section">

                            <div class="soap-title">

                                P — Plan

                            </div>

                            <div class="soap-content">

                                ${escapeHTML(
                                    record.plan
                                )}

                            </div>

                        </div>

                    `
                    : ""
                }


                ${
                    record.diagnosis
                    ? `

                        <div class="soap-section">

                            <div class="soap-title">

                                Diagnosis

                            </div>

                            <div class="soap-content">

                                ${escapeHTML(
                                    record.diagnosis
                                )}

                            </div>

                        </div>

                    `
                    : ""
                }


                ${
                    record.medication
                    ? `

                        <div class="soap-section">

                            <div class="soap-title">

                                Medication

                            </div>

                            <div class="soap-content">

                                ${escapeHTML(
                                    record.medication
                                )}

                            </div>

                        </div>

                    `
                    : ""
                }


                ${
                    record.treatment
                    ? `

                        <div class="soap-section">

                            <div class="soap-title">

                                Treatment

                            </div>

                            <div class="soap-content">

                                ${escapeHTML(
                                    record.treatment
                                )}

                            </div>

                        </div>

                    `
                    : ""
                }


                ${
                    record.procedure
                    ? `

                        <div class="soap-section">

                            <div class="soap-title">

                                Procedure

                            </div>

                            <div class="soap-content">

                                ${escapeHTML(
                                    record.procedure
                                )}

                            </div>

                        </div>

                    `
                    : ""
                }


                ${
                    record.follow_up_date
                    ? `

                        <div class="soap-section">

                            <div class="soap-title">

                                Follow-up

                            </div>

                            <div class="soap-content">

                                ${escapeHTML(
                                    record.follow_up_date
                                )}

                            </div>

                        </div>

                    `
                    : ""
                }


                ${
                    record.notes
                    ? `

                        <div class="soap-section">

                            <div class="soap-title">

                                Notes

                            </div>

                            <div class="soap-content">

                                ${escapeHTML(
                                    record.notes
                                )}

                            </div>

                        </div>

                    `
                    : ""
                }

            `;


            medicalHistory.appendChild(
                card
            );

        }
    );

}


/* =====================================================
   PARSE OBJECTIVE
===================================================== */


function parseObjective(
    objective
) {


    const result = {

        temperature: "",

        heartRate: "",

        respiratoryRate: "",

        crt: "",

        mucous: "",

        weight: "",

        bcs: "",

        hydration: "",

        additional: ""

    };


    if (!objective) {

        return result;

    }


    const text =
        String(
            objective
        );


    const temperature =
        text.match(
            /Temperature:\s*([0-9.]+)/i
        );


    const heartRate =
        text.match(
            /Heart Rate\/Pulse:\s*([0-9.]+)/i
        );


    const respiratoryRate =
        text.match(
            /Respiratory Rate:\s*([0-9.]+)/i
        );


    const crt =
        text.match(
            /CRT:\s*([0-9.]+)/i
        );


    const mucous =
        text.match(
            /Mucous Membrane:\s*([^\n]+)/i
        );


    const weight =
        text.match(
            /Weight:\s*([0-9.]+)/i
        );


    const bcs =
        text.match(
            /BCS:\s*([0-9.]+)\/9/i
        );


    const hydration =
        text.match(
            /Hydration:\s*([^\n]+)/i
        );


    result.temperature =
        temperature
        ? temperature[1]
        : "";


    result.heartRate =
        heartRate
        ? heartRate[1]
        : "";


    result.respiratoryRate =
        respiratoryRate
        ? respiratoryRate[1]
        : "";


    result.crt =
        crt
        ? crt[1]
        : "";


    result.mucous =
        mucous
        ? mucous[1]
        : "";


    result.weight =
        weight
        ? weight[1]
        : "";


    result.bcs =
        bcs
        ? bcs[1]
        : "";


    result.hydration =
        hydration
        ? hydration[1]
        : "";


    const additionalIndex =
        text.indexOf(
            "Additional Findings:"
        );


    if (
        additionalIndex !== -1
    ) {

        result.additional =
            text
            .substring(
                additionalIndex +
                "Additional Findings:"
                .length
            )
            .trim();

    }


    return result;

}


/* =====================================================
   EDIT
===================================================== */


function editMedicalRecord(
    recordId
) {

    window.location.href =
        "medical-record-detail.html?id=" +
        encodeURIComponent(
            recordId
        );

}


/* =====================================================
   DELETE
===================================================== */


async function deleteMedicalRecord(
    recordId
) {


    const confirmed =
        confirm(
            "Are you sure you want to delete this medical record?"
        );


    if (!confirmed) {

        return;

    }


    const {
        error
    } =
    await supabaseClient

        .from(
            "medical_records"
        )

        .delete()

        .eq(
            "id",
            recordId
        );


    if (error) {

        alert(
            "Failed to delete medical record:\n\n" +
            error.message
        );

        return;

    }


    await loadMedicalHistory(
        selectedPatientId
    );

}

   INITIALIZE

async function init() {


    /*
       Menggunakan clinic-context.js
       yang sudah kamu punya.
    */

    currentClinic =
        await getCurrentClinic();


    if (!currentClinic) {

        patientResults.innerHTML = `

            <div class="error-state">

                Clinic information could not be loaded.

                <br><br>

                Please make sure you are logged in.

            </div>

        `;

        return;

    }


    console.log(
        "Current clinic:",
        currentClinic
    );


    await loadPatients();

}


init();
