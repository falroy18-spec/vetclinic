<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Medical Records - VetClinic</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6fb;
    color: #252d3d;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 30px;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

.header h1 {
    margin: 0;
}

.header p {
    color: #6b7280;
}

.card {
    background: white;
    border-radius: 14px;
    padding: 25px;
    margin-bottom: 25px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.06);
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
}

.full {
    grid-column: 1 / -1;
}

label {
    display: block;
    margin-bottom: 7px;
    font-weight: 600;
}

input,
select,
textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
}

textarea {
    min-height: 100px;
    resize: vertical;
}

button {
    border: none;
    border-radius: 8px;
    padding: 11px 16px;
    cursor: pointer;
    font-weight: 600;
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.primary {
    background: #5146e5;
    color: white;
}

.danger {
    background: #dc2626;
    color: white;
}

.secondary {
    background: #e5e7eb;
    color: #374151;
}

.edit-button {
    background: #f59e0b;
    color: white;
}

.actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
    flex-wrap: wrap;
}

.message {
    margin-top: 15px;
    font-size: 14px;
}

.error {
    color: #dc2626;
}

.success {
    color: #16a34a;
}

.search-box {
    margin-bottom: 20px;
}

.search-box input {
    font-size: 15px;
}

.patient-results {
    display: grid;
    gap: 10px;
    margin-top: 15px;
}

.patient-card {
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 15px;
    cursor: pointer;
    transition: 0.15s;
}

.patient-card:hover {
    border-color: #5146e5;
    background: #f8f7ff;
}

.patient-card.active {
    border-color: #5146e5;
    background: #f0efff;
}

.patient-name {
    font-size: 17px;
    font-weight: 700;
}

.patient-info {
    color: #6b7280;
    font-size: 13px;
    margin-top: 5px;
}

.selected-patient {
    background: #f0efff;
    border: 1px solid #c7c4ff;
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 20px;
}

.selected-patient h3 {
    margin: 0 0 5px 0;
}

.selected-patient p {
    margin: 4px 0;
    color: #6b7280;
}

.record {
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 15px;
}

.record-header {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    align-items: flex-start;
}

.record h3 {
    margin-top: 0;
    margin-bottom: 6px;
}

.record-date {
    color: #6b7280;
    font-size: 13px;
}

.record-section {
    margin-top: 15px;
}

.record-section strong {
    display: block;
    margin-bottom: 5px;
}

.record-section p {
    margin: 0;
    white-space: pre-wrap;
    line-height: 1.5;
}

.record-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.empty {
    text-align: center;
    padding: 30px;
    color: #6b7280;
}

.section-title {
    margin-top: 25px;
    margin-bottom: 15px;
}

.physical-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
}

.small-note {
    color: #6b7280;
    font-size: 12px;
    margin-top: 5px;
}

.mode-title {
    color: #5146e5;
}

@media(max-width:700px) {

    .container {
        padding: 15px;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .full {
        grid-column: auto;
    }

    .header {
        flex-direction: column;
        align-items: flex-start;
        gap: 15px;
    }

    .record-header {
        flex-direction: column;
    }

    .physical-grid {
        grid-template-columns: 1fr;
    }

}

</style>

</head>


<body>

<div class="container">

    <div class="header">

        <div>

            <h1>📋 Medical Records</h1>

            <p>
                Patient medical history and clinical records
            </p>

        </div>

        <button
            class="secondary"
            type="button"
            onclick="window.location.href='index.html'"
        >
            Dashboard
        </button>

    </div>


    <!-- SEARCH PATIENT -->

    <div class="card">

        <h2>Search Patient</h2>

        <div class="search-box">

            <input
                type="text"
                id="patientSearch"
                placeholder="Search patient name or owner name..."
            >

        </div>

        <div id="patientResults">

            <div class="empty">
                Loading patients...
            </div>

        </div>

    </div>


    <!-- SELECTED PATIENT -->

    <div
        class="card"
        id="selectedPatientCard"
        style="display:none;"
    >

        <div class="selected-patient">

            <h3 id="selectedPatientName">
                -
            </h3>

            <p id="selectedPatientInfo">
                -
            </p>

            <p id="selectedOwnerInfo">
                -
            </p>

        </div>

        <div id="patientHistory">

            <div class="empty">
                Select a patient to view medical history.
            </div>

        </div>

    </div>


    <!-- NEW / EDIT RECORD -->

    <div class="card">

        <h2 id="formTitle">
            New Medical Record
        </h2>


        <div class="form-grid">


            <div class="full">

                <label>
                    Patient
                </label>

                <select id="patient">

                    <option value="">
                        Select patient
                    </option>

                </select>

            </div>


            <div>

                <label>
                    Visit Date
                </label>

                <input
                    type="date"
                    id="visit_date"
                >

            </div>


            <div>

                <label>
                    Chief Complaint
                </label>

                <input
                    type="text"
                    id="chief_complaint"
                    placeholder="Reason for visit"
                >

            </div>


            <div class="full">

                <label>
                    Subjective
                </label>

                <textarea
                    id="subjective"
                    placeholder="History from owner..."
                ></textarea>

            </div>


            <!-- OBJECTIVE -->

            <div class="full">

                <h3 class="section-title">
                    Objective - Physical Examination
                </h3>

                <div class="physical-grid">


                    <div>

                        <label>
                            Temperature (°C)
                        </label>

                        <input
                            type="number"
                            step="0.1"
                            id="temperature"
                            placeholder="e.g. 38.5"
                        >

                    </div>


                    <div>

                        <label>
                            Heart Rate / Pulse (bpm)
                        </label>

                        <input
                            type="number"
                            id="heart_rate"
                            placeholder="e.g. 120"
                        >

                    </div>


                    <div>

                        <label>
                            Respiratory Rate (rpm)
                        </label>

                        <input
                            type="number"
                            id="respiratory_rate"
                            placeholder="e.g. 30"
                        >

                    </div>


                    <div>

                        <label>
                            CRT (sec)
                        </label>

                        <input
                            type="number"
                            step="0.1"
                            id="crt"
                            placeholder="e.g. 1.5"
                        >

                    </div>


                    <div>

                        <label>
                            Mucous Membrane
                        </label>

                        <input
                            type="text"
                            id="mucous_membrane"
                            placeholder="e.g. Pink"
                        >

                    </div>


                    <div>

                        <label>
                            Weight (kg)
                        </label>

                        <input
                            type="number"
                            step="0.01"
                            id="weight"
                            placeholder="e.g. 4.2"
                        >

                    </div>


                    <div>

                        <label>
                            BCS
                        </label>

                        <input
                            type="number"
                            step="0.5"
                            min="1"
                            max="9"
                            id="bcs"
                            placeholder="1 - 9"
                        >

                    </div>

                </div>

                <p class="small-note">
                    Basic physical examination parameters will automatically be saved under Objective.
                </p>

            </div>


            <div class="full">

                <label>
                    Additional Objective Findings
                </label>

                <textarea
                    id="objective_findings"
                    placeholder="Other physical examination findings..."
                ></textarea>

            </div>


            <!-- ASSESSMENT -->

            <div class="full">

                <label>
                    Assessment
                </label>

                <textarea
                    id="assessment"
                    placeholder="Clinical assessment..."
                ></textarea>

            </div>


            <!-- PLAN -->

            <div class="full">

                <label>
                    Plan
                </label>

                <textarea
                    id="plan"
                    placeholder="Treatment and follow-up plan..."
                ></textarea>

            </div>


            <div>

                <label>
                    Diagnosis
                </label>

                <input
                    type="text"
                    id="diagnosis"
                    placeholder="Diagnosis"
                >

            </div>


            <div>

                <label>
                    Medication
                </label>

                <input
                    type="text"
                    id="medication"
                    placeholder="Medication"
                >

            </div>


            <div>

                <label>
                    Treatment
                </label>

                <textarea
                    id="treatment"
                    placeholder="Treatment given..."
                ></textarea>

            </div>


            <div>

                <label>
                    Procedure
                </label>

                <textarea
                    id="procedure"
                    placeholder="Procedure performed..."
                ></textarea>

            </div>


            <div>

                <label>
                    Follow-up Date
                </label>

                <input
                    type="date"
                    id="follow_up_date"
                >

            </div>


            <div>

                <label>
                    Notes
                </label>

                <textarea
                    id="notes"
                    placeholder="Additional notes..."
                ></textarea>

            </div>


        </div>


        <div class="actions">

            <button
                class="primary"
                id="saveButton"
                type="button"
            >
                Save Medical Record
            </button>


            <button
                class="secondary"
                id="cancelEditButton"
                type="button"
                style="display:none;"
            >
                Cancel Edit
            </button>

        </div>


        <div
            id="message"
            class="message"
        ></div>

    </div>


</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="clinic-context.js"></script>


<script>


let currentClinic = null;

let allPatients = [];

let selectedPatientId = null;

let editingRecordId = null;


const patientSelect =
    document.getElementById("patient");

const patientSearch =
    document.getElementById("patientSearch");

const patientResults =
    document.getElementById("patientResults");

const patientHistory =
    document.getElementById("patientHistory");

const selectedPatientCard =
    document.getElementById("selectedPatientCard");

const saveButton =
    document.getElementById("saveButton");

const cancelEditButton =
    document.getElementById("cancelEditButton");

const message =
    document.getElementById("message");



/* =========================
   DATE
========================= */

document.getElementById(
    "visit_date"
).value =
    new Date()
    .toISOString()
    .split("T")[0];



/* =========================
   LOAD PATIENTS
========================= */

async function loadPatients() {

    patientResults.innerHTML = `
        <div class="empty">
            Loading patients...
        </div>
    `;


    const {
        data,
        error
    } =
    await supabaseClient
        .from("patients")
        .select(`
            id,
            name,
            species,
            breed,
            sex,
            owner_name,
            phone,
            owner_address,
            clinic_id
        `)
        .eq(
            "clinic_id",
            currentClinic.clinicId
        )
        .order(
            "name",
            {
                ascending: true
            }
        );


    if (error) {

        console.error(error);

        patientResults.innerHTML = `
            <div class="empty error">
                Gagal mengambil patient:
                ${escapeHtml(error.message)}
            </div>
        `;

        return;
    }


    allPatients = data || [];


    renderPatientResults(
        allPatients
    );


    populatePatientSelect(
        allPatients
    );

}



/* =========================
   PATIENT SEARCH
========================= */

patientSearch.addEventListener(
    "input",
    function() {

        const keyword =
            this.value
            .trim()
            .toLowerCase();


        if (!keyword) {

            renderPatientResults(
                allPatients
            );

            return;

        }


        const filtered =
            allPatients.filter(
                patient => {

                    const name =
                        String(
                            patient.name || ""
                        ).toLowerCase();

                    const owner =
                        String(
                            patient.owner_name || ""
                        ).toLowerCase();

                    return (
                        name.includes(keyword) ||
                        owner.includes(keyword)
                    );

                }
            );


        renderPatientResults(
            filtered
        );

    }
);



/* =========================
   RENDER PATIENT RESULTS
========================= */

function renderPatientResults(
    patients
) {

    if (
        !patients ||
        patients.length === 0
    ) {

        patientResults.innerHTML = `
            <div class="empty">
                No patient found.
            </div>
        `;

        return;
    }


    patientResults.innerHTML = "";


    patients.forEach(
        patient => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "patient-card";


            if (
                patient.id ===
                selectedPatientId
            ) {

                div.classList.add(
                    "active"
                );

            }


            div.innerHTML = `

                <div class="patient-name">
                    ${escapeHtml(
                        patient.name
                    )}
                </div>

                <div class="patient-info">

                    ${escapeHtml(
                        patient.species || ""
                    )}

                    ${
                        patient.breed
                        ? " • " +
                          escapeHtml(
                              patient.breed
                          )
                        : ""
                    }

                    ${
                        patient.owner_name
                        ? " • Owner: " +
                          escapeHtml(
                              patient.owner_name
                          )
                        : ""
                    }

                </div>

            `;


            div.addEventListener(
                "click",
                function() {

                    selectPatient(
                        patient.id
                    );

                }
            );


            patientResults.appendChild(
                div
            );

        }
    );

}



/* =========================
   PATIENT SELECT
========================= */

function populatePatientSelect(
    patients
) {

    patientSelect.innerHTML = `
        <option value="">
            Select patient
        </option>
    `;


    patients.forEach(
        patient => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                patient.id;


            option.textContent =
                patient.name +
                " (" +
                patient.species +
                ")" +
                (
                    patient.owner_name
                    ? " - Owner: " +
                      patient.owner_name
                    : ""
                );


            patientSelect.appendChild(
                option
            );

        }
    );

}



/* =========================
   SELECT PATIENT
========================= */

async function selectPatient(
    patientId
) {

    const patient =
        allPatients.find(
            p =>
                p.id === patientId
        );


    if (!patient) {
        return;
    }


    selectedPatientId =
        patientId;


    patientSelect.value =
        patientId;


    selectedPatientCard.style.display =
        "block";


    document.getElementById(
        "selectedPatientName"
    ).textContent =
        patient.name;


    document.getElementById(
        "selectedPatientInfo"
    ).textContent =
        (
            patient.species || ""
        ) +
        (
            patient.breed
            ? " • " +
              patient.breed
            : ""
        ) +
        (
            patient.sex
            ? " • " +
              patient.sex
            : ""
        );


    document.getElementById(
        "selectedOwnerInfo"
    ).textContent =
        patient.owner_name
        ? "Owner: " +
          patient.owner_name
        : "Owner: -";


    renderPatientResults(
        getFilteredPatients()
    );


    await loadPatientHistory(
        patientId
    );

}



/* =========================
   FILTERED PATIENTS
========================= */

function getFilteredPatients() {

    const keyword =
        patientSearch.value
        .trim()
        .toLowerCase();


    if (!keyword) {
        return allPatients;
    }


    return allPatients.filter(
        patient => {

            const name =
                String(
                    patient.name || ""
                ).toLowerCase();

            const owner =
                String(
                    patient.owner_name || ""
                ).toLowerCase();

            return (
                name.includes(keyword) ||
                owner.includes(keyword)
            );

        }
    );

}



/* =========================
   LOAD PATIENT HISTORY
========================= */

async function loadPatientHistory(
    patientId
) {

    patientHistory.innerHTML = `
        <div class="empty">
            Loading medical history...
        </div>
    `;


    const {
        data,
        error
    } =
    await supabaseClient
        .from("medical_records")
        .select("*")
        .eq(
            "patient_id",
            patientId
        )
        .order(
            "visit_date",
            {
                ascending: false
            }
        );


    if (error) {

        console.error(error);

        patientHistory.innerHTML = `
            <div class="empty error">
                Gagal mengambil history:
                ${escapeHtml(error.message)}
            </div>
        `;

        return;
    }


    if (
        !data ||
        data.length === 0
    ) {

        patientHistory.innerHTML = `
            <div class="empty">
                Belum ada medical record untuk pasien ini.
            </div>
        `;

        return;
    }


    patientHistory.innerHTML = "";


    data.forEach(
        record => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "record";


            div.innerHTML = `

                <div class="record-header">

                    <div>

                        <h3>
                            Visit
                        </h3>

                        <div class="record-date">

                            ${escapeHtml(
                                record.visit_date || "-"
                            )}

                        </div>

                    </div>


                    <div class="record-actions">

                        <button
                            class="edit-button"
                            type="button"
                            onclick="editRecord('${record.id}')"
                        >
                            Edit
                        </button>

                        <button
                            class="danger"
                            type="button"
                            onclick="deleteRecord('${record.id}')"
                        >
                            Delete
                        </button>

                    </div>

                </div>


                ${makeSection(
                    "Chief Complaint",
                    record.chief_complaint
                )}


                ${makeSection(
                    "Subjective",
                    record.subjective
                )}


                ${makeSection(
                    "Objective",
                    record.objective
                )}


                ${makeSection(
                    "Assessment",
                    record.assessment
                )}


                ${makeSection(
                    "Plan",
                    record.plan
                )}


                ${makeSection(
                    "Diagnosis",
                    record.diagnosis
                )}


                ${makeSection(
                    "Medication",
                    record.medication
                )}


                ${makeSection(
                    "Treatment",
                    record.treatment
                )}


                ${makeSection(
                    "Procedure",
                    record.procedure
                )}


                ${makeSection(
                    "Notes",
                    record.notes
                )}


                ${
                    record.follow_up_date
                    ? `
                        <div class="record-section">

                            <strong>
                                Follow-up
                            </strong>

                            <p>
                                ${escapeHtml(
                                    record.follow_up_date
                                )}
                            </p>

                        </div>
                    `
                    : ""
                }

            `;


            patientHistory.appendChild(
                div
            );

        }
    );

}



/* =========================
   BUILD OBJECTIVE
========================= */

function buildObjective() {

    const temperature =
        document.getElementById(
            "temperature"
        ).value.trim();

    const heartRate =
        document.getElementById(
            "heart_rate"
        ).value.trim();

    const respiratoryRate =
        document.getElementById(
            "respiratory_rate"
        ).value.trim();

    const crt =
        document.getElementById(
            "crt"
        ).value.trim();

    const mucous =
        document.getElementById(
            "mucous_membrane"
        ).value.trim();

    const weight =
        document.getElementById(
            "weight"
        ).value.trim();

    const bcs =
        document.getElementById(
            "bcs"
        ).value.trim();

    const findings =
        document.getElementById(
            "objective_findings"
        ).value.trim();


    const lines = [];


    if (temperature) {

        lines.push(
            "Temperature: " +
            temperature +
            " °C"
        );

    }


    if (heartRate) {

        lines.push(
            "Heart Rate/Pulse: " +
            heartRate +
            " bpm"
        );

    }


    if (respiratoryRate) {

        lines.push(
            "Respiratory Rate: " +
            respiratoryRate +
            " rpm"
        );

    }


    if (crt) {

        lines.push(
            "CRT: " +
            crt +
            " sec"
        );

    }


    if (mucous) {

        lines.push(
            "Mucous Membrane: " +
            mucous
        );

    }


    if (weight) {

        lines.push(
            "Weight: " +
            weight +
            " kg"
        );

    }


    if (bcs) {

        lines.push(
            "BCS: " +
            bcs +
            "/9"
        );

    }


    if (findings) {

        lines.push(
            "",
            "Additional Findings:",
            findings
        );

    }


    return lines.join("\n");

}



/* =========================
   PARSE OBJECTIVE
========================= */

function parseObjective(
    objective
) {

    if (!objective) {
        return;
    }


    const text =
        String(objective);


    const temp =
        text.match(
            /Temperature:\s*([0-9.]+)/i
        );

    const hr =
        text.match(
            /Heart Rate\/Pulse:\s*([0-9.]+)/i
        );

    const rr =
        text.match(
            /Respiratory Rate:\s*([0-9.]+)/i
        );

    const crt =
        text.match(
            /CRT:\s*([0-9.]+)/i
        );

    const mm =
        text.match(
            /Mucous Membrane:\s*(.+)/i
        );

    const weight =
        text.match(
            /Weight:\s*([0-9.]+)/i
        );

    const bcs =
        text.match(
            /BCS:\s*([0-9.]+)\/9/i
        );


    document.getElementById(
        "temperature"
    ).value =
        temp
        ? temp[1]
        : "";


    document.getElementById(
        "heart_rate"
    ).value =
        hr
        ? hr[1]
        : "";


    document.getElementById(
        "respiratory_rate"
    ).value =
        rr
        ? rr[1]
        : "";


    document.getElementById(
        "crt"
    ).value =
        crt
        ? crt[1]
        : "";


    document.getElementById(
        "mucous_membrane"
    ).value =
        mm
        ? mm[1].split("\n")[0]
        : "";


    document.getElementById(
        "weight"
    ).value =
        weight
        ? weight[1]
        : "";


    document.getElementById(
        "bcs"
    ).value =
        bcs
        ? bcs[1]
        : "";


    const additionalIndex =
        text.indexOf(
            "Additional Findings:"
        );


    if (
        additionalIndex !== -1
    ) {

        document.getElementById(
            "objective_findings"
        ).value =
            text
            .substring(
                additionalIndex +
                "Additional Findings:"
                .length
            )
            .trim();

    } else {

        document.getElementById(
            "objective_findings"
        ).value = "";

    }

}



/* =========================
   SAVE / UPDATE
========================= */

saveButton.addEventListener(
    "click",
    async function() {


        const patient_id =
            patientSelect.value;


        if (!patient_id) {

            message.textContent =
                "Pilih patient terlebih dahulu.";

            message.className =
                "message error";

            return;

        }


        const objective =
            buildObjective();


        saveButton.disabled =
            true;


        message.textContent =
            editingRecordId
            ? "Updating medical record..."
            : "Saving medical record...";


        message.className =
            "message";


        const record = {

            patient_id:

                patient_id,

            visit_date:

                document.getElementById(
                    "visit_date"
                ).value
                || null,

            chief_complaint:

                document.getElementById(
                    "chief_complaint"
                ).value.trim()
                || null,

            subjective:

                document.getElementById(
                    "subjective"
                ).value.trim()
                || null,

            objective:

                objective
                || null,

            assessment:

                document.getElementById(
                    "assessment"
                ).value.trim()
                || null,

            plan:

                document.getElementById(
                    "plan"
                ).value.trim()
                || null,

            diagnosis:

                document.getElementById(
                    "diagnosis"
                ).value.trim()
                || null,

            medication:

                document.getElementById(
                    "medication"
                ).value.trim()
                || null,

            treatment:

                document.getElementById(
                    "treatment"
                ).value.trim()
                || null,

            procedure:

                document.getElementById(
                    "procedure"
                ).value.trim()
                || null,

            follow_up_date:

                document.getElementById(
                    "follow_up_date"
                ).value
                || null,

            notes:

                document.getElementById(
                    "notes"
                ).value.trim()
                || null

        };


        let result;


        if (editingRecordId) {

            result =
                await supabaseClient
                    .from(
                        "medical_records"
                    )
                    .update(record)
                    .eq(
                        "id",
                        editingRecordId
                    );

        } else {

            result =
                await supabaseClient
                    .from(
                        "medical_records"
                    )
                    .insert(record);

        }


        if (result.error) {

            console.error(
                result.error
            );


            message.textContent =
                "Gagal menyimpan: " +
                result.error.message;


            message.className =
                "message error";


            saveButton.disabled =
                false;


            return;

        }


        message.textContent =
            editingRecordId
            ? "Medical record berhasil diperbarui!"
            : "Medical record berhasil disimpan!";


        message.className =
            "message success";


        const patientToReload =
            patient_id;


        clearForm();


        editingRecordId =
            null;


        document.getElementById(
            "formTitle"
        ).textContent =
            "New Medical Record";


        cancelEditButton.style.display =
            "none";


        saveButton.textContent =
            "Save Medical Record";


        saveButton.disabled =
            false;


        await loadPatientHistory(
            patientToReload
        );

    }
);



/* =========================
   EDIT RECORD
========================= */

async function editRecord(
    recordId
) {

    const {
        data,
        error
    } =
    await supabaseClient
        .from("medical_records")
        .select("*")
        .eq(
            "id",
            recordId
        )
        .single();


    if (error) {

        alert(
            "Gagal mengambil record: " +
            error.message
        );

        return;

    }


    editingRecordId =
        recordId;


    patientSelect.value =
        data.patient_id;


    selectedPatientId =
        data.patient_id;


    const patient =
        allPatients.find(
            p =>
                p.id ===
                data.patient_id
        );


    if (patient) {

        selectedPatientCard.style.display =
            "block";


        document.getElementById(
            "selectedPatientName"
        ).textContent =
            patient.name;


        document.getElementById(
            "selectedPatientInfo"
        ).textContent =
            (
                patient.species || ""
            ) +
            (
                patient.breed
                ? " • " +
                  patient.breed

            );


        document.getElementById(
            "selectedOwnerInfo"

            patient.owner_name
            ? "Owner: " +

    document.getElementById(

    document.getElementById(

    document.getElementById(

    document.getElementById(
        "medication"

        data.medication || "";


    document.getElementById(
        "treatment"

        data.treatment || "";


    document.getElementById(
        "procedure"
    ).value =
        data.procedure || "";


    document.getElementById(
        "follow_up_date"
    ).value =
        data.follow_up_date || "";


    document.getElementById(
        "notes"

    document.getElementById(

    saveButton.textContent =

/* =========================

========================= */

async function deleteRecord(
    id
) {

    if (
        !confirm(
            "Delete this medical record?"
        )
    ) {

        return;

    }


    const {
        error
    } =
    await supabaseClient
        .from(
            "medical_records"
        )
        .delete()
        .eq(
            "id",
            id
        );


    if (error) {

        alert(
            "Gagal menghapus: " +
            error.message
        );

        return;

    }


    if (selectedPatientId) {

        await loadPatientHistory(
            selectedPatientId
        );

    }

}



/* =========================
   SECTION
========================= */

function makeSection(
    title,
    value
) {

    if (!value) {
        return "";
    }


    return `

        <div class="record-section">

            <strong>
                ${escapeHtml(title)}
            </strong>

            <p>
                ${escapeHtml(value)}
            </p>

        </div>

    `;

}



/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(
    value
) {

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}
