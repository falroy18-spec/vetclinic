<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Medical Records - VetClinic</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .search-row {
            display: grid;
            grid-template-columns: 1fr 180px;
            gap: 10px;
        }

        .patient-select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            background: white;
            font-size: 14px;
        }

        .patient-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
        }

        .patient-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
        }

        .patient-name {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .patient-info {
            color: #6b7280;
            font-size: 14px;
            line-height: 1.6;
        }

        .record-card {
            border-top: 1px solid #e5e7eb;
            margin-top: 18px;
            padding-top: 18px;
        }

        .record-date {
            font-weight: 700;
            margin-bottom: 12px;
        }

        .soap-section {
            margin-bottom: 14px;
        }

        .soap-title {
            font-weight: 700;
            margin-bottom: 5px;
        }

        .soap-text {
            white-space: pre-wrap;
            color: #4b5563;
            line-height: 1.6;
        }

        .empty-message {
            text-align: center;
            padding: 40px;
            color: #6b7280;
        }

        .new-record-button {
            display: inline-block;
            background: #5146e5;
            color: white;
            padding: 11px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
        }

        .delete-button {
            border: none;
            background: #dc2626;
            color: white;
            padding: 8px 12px;
            border-radius: 7px;
            cursor: pointer;
        }

        .view-button {
            display: inline-block;
            background: #5146e5;
            color: white;
            padding: 8px 12px;
            border-radius: 7px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
        }

        .status-message {
            margin-top: 10px;
            color: #6b7280;
            font-size: 14px;
        }

        @media (max-width: 700px) {
            .search-row {
                grid-template-columns: 1fr;
            }

            .patient-header {
                flex-direction: column;
            }
        }
    </style>
</head>


<body>

<div class="app">

    <aside class="sidebar">

        <h1>🐾 VetClinic</h1>

        <nav>

            <a href="index.html">
                Dashboard
            </a>

            <a href="patients.html">
                Patients
            </a>

            <a href="appointments.html">
                Appointments
            </a>

            <a href="medical-records.html" class="active">
                Medical Records
            </a>

            <a href="medicines.html">
                Medicines
            </a>

            <a href="billing.html">
                Billing
            </a>

            <a href="reports.html">
                Reports
            </a>

        </nav>

    </aside>


    <main class="main-content">

        <header>

            <div>

                <h2>
                    Medical Records
                </h2>

                <p>
                    Manage patient consultation history.
                </p>

            </div>

            <a
                href="add-record.html"
                class="new-record-button"
            >
                + New Record
            </a>

        </header>


        <!-- SEARCH -->

        <section class="appointments">

            <h3>
                Search Medical Records
            </h3>

            <div class="search-row">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search patient, owner, or diagnosis..."
                >

                <select
                    id="patientFilter"
                    class="patient-select"
                >
                    <option value="">
                        All Patients
                    </option>
                </select>

            </div>

            <div
                id="recordCount"
                class="status-message"
            >
                Loading records...
            </div>

        </section>


        <!-- MEDICAL HISTORY -->

        <section class="appointments">

            <h3>
                Medical History
            </h3>

            <div id="medicalHistory">

                <div class="empty-message">
                    Loading medical records...
                </div>

            </div>

        </section>

    </main>

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- CLINIC CONTEXT -->

<script src="clinic-context.js?v=72"></script>


<script>

let currentClinic = null;

let patients = [];

let medicalRecords = [];

let searchText = "";

let selectedPatientId = "";


/* =====================================================
   INIT
===================================================== */

async function init() {

    console.log(
        "Medical Records: starting..."
    );


    currentClinic =
        await getCurrentClinic();


    if (!currentClinic) {

        document.getElementById(
            "recordCount"
        ).textContent =
            "Unable to load clinic information. Please make sure you are logged in.";

        document.getElementById(
            "medicalHistory"
        ).innerHTML = `
            <div class="empty-message">
                Unable to load clinic information.<br>
                Please make sure you are logged in.
            </div>
        `;

        return;
    }


    console.log(
        "Medical Records clinic:",
        currentClinic
    );


    await loadPatients();

    await loadMedicalRecords();

    setupSearch();

    renderMedicalHistory();

}


/* =====================================================
   LOAD PATIENTS
===================================================== */

async function loadPatients() {

    console.log(
        "Loading patients..."
    );


    const {
        data,
        error
    } =
    await supabaseClient
        .from("patients")
        .select(`
            id,
            name,
            species,
            breed,
            sex,
            owner
        `)
        .eq(
            "clinic_id",
            currentClinic.clinicId
        )
        .order(
            "name",
            {
                ascending: true
            }
        );


    if (error) {

        console.error(
            "Patients error:",
            error
        );

        document.getElementById(
            "recordCount"
        ).textContent =
            "Failed to load patients.";

        return;
    }


    patients =
        data || [];


    console.log(
        "Patients loaded:",
        patients
    );


    renderPatientFilter();

}


/* =====================================================
   PATIENT FILTER
===================================================== */

function renderPatientFilter() {

    const select =
        document.getElementById(
            "patientFilter"
        );


    select.innerHTML = `
        <option value="">
            All Patients
        </option>
    `;


    patients.forEach(
        function(patient) {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                patient.id;

            option.textContent =
                patient.name +
                (
                    patient.owner
                        ? " — Owner: " +
                          patient.owner
                        : ""
                );

            select.appendChild(
                option
            );

        }
    );

}


/* =====================================================
   LOAD MEDICAL RECORDS
===================================================== */

async function loadMedicalRecords() {

    console.log(
        "Loading medical records..."
    );


    const {
        data,
        error
    } =
    await supabaseClient
        .from("medical_records")
        .select("*")
        .eq(
            "clinic_id",
            currentClinic.clinicId
        )
        .order(
            "visit_date",
            {
                ascending: false
            }
        );


    if (error) {

        console.error(
            "Medical records error:",
            error
        );

        document.getElementById(
            "recordCount"
        ).textContent =
            "Failed to load medical records.";

        medicalRecords = [];

        return;
    }


    medicalRecords =
        data || [];


    console.log(
        "Medical records loaded:",
        medicalRecords
    );

}


/* =====================================================
   SEARCH
===================================================== */

function setupSearch() {

    const searchInput =
        document.getElementById(
            "searchInput"
        );

    const patientFilter =
        document.getElementById(
            "patientFilter"
        );


    searchInput.addEventListener(
        "input",
        function() {

            searchText =
                this.value
                    .trim()
                    .toLowerCase();

            renderMedicalHistory();

        }
    );


    patientFilter.addEventListener(
        "change",
        function() {

            selectedPatientId =
                this.value;

            renderMedicalHistory();

        }
    );

}


/* =====================================================
   FIND PATIENT
===================================================== */

function getPatientById(
    patientId
) {

    return patients.find(
        function(patient) {

            return String(
                patient.id
            ) === String(
                patientId
            );

        }
    );

}


/* =====================================================
   RENDER MEDICAL HISTORY
===================================================== */

function renderMedicalHistory() {

    const container =
        document.getElementById(
            "medicalHistory"
        );


    let records =
        medicalRecords.filter(
            function(record) {

                const patient =
                    getPatientById(
                        record.patient_id
                    );


                if (!patient) {

                    return false;

                }


                /* PATIENT FILTER */

                if (
                    selectedPatientId &&
                    String(
                        record.patient_id
                    ) !== String(
                        selectedPatientId
                    )
                ) {

                    return false;

                }


                /* SEARCH */

                if (!searchText) {

                    return true;

                }


                const patientName =
                    (
                        patient.name ||
                        ""
                    ).toLowerCase();


                const ownerName =
                    (
                        patient.owner ||
                        ""
                    ).toLowerCase();


                const diagnosis =
                    (
                        record.diagnosis ||
                        ""
                    ).toLowerCase();


                const chiefComplaint =
                    (
                        record.chief_complaint ||
                        ""
                    ).toLowerCase();


                return (

                    patientName.includes(
                        searchText
                    ) ||

                    ownerName.includes(
                        searchText
                    ) ||

                    diagnosis.includes(
                        searchText
                    ) ||

                    chiefComplaint.includes(
                        searchText
                    )

                );

            }
        );


    document.getElementById(
        "recordCount"
    ).textContent =
        records.length +
        " medical record" +
        (
            records.length === 1
                ? ""
                : "s"
        );


    if (!records.length) {

        container.innerHTML = `
            <div class="empty-message">
                No medical records found.
            </div>
        `;

        return;

    }


    /*
     * GROUP BY PATIENT
     *
     * Jadi record Cidol hanya berada
     * di bagian Cidol.
     */

    const grouped = {};


    records.forEach(
        function(record) {

            const patient =
                getPatientById(
                    record.patient_id
                );


            if (!patient) {
                return;
            }


            if (!grouped[patient.id]) {

                grouped[patient.id] = {

                    patient:
                        patient,

                    records: []

                };

            }


            grouped[
                patient.id
            ].records.push(
                record
            );

        }
    );


    container.innerHTML = "";


    Object.values(grouped).forEach(
        function(group) {

            const patient =
                group.patient;


            const patientCard =
                document.createElement(
                    "div"
                );

            patientCard.className =
                "patient-card";


            let recordsHTML = "";


            group.records.forEach(
                function(record) {

                    recordsHTML +=
                    `
                    <div class="record-card">

                        <div class="patient-header">

                            <div>

                                <div class="record-date">

                                    Visit:
                                    ${
                                        formatDate(
                                            record.visit_date
                                        )
                                    }

                                </div>

                            </div>

                            <div>

                                <a
                                    href="medical-record-detail.html?id=${record.id}"
                                    class="view-button"
                                >
                                    View
                                </a>

                                <button
                                    class="delete-button"
                                    onclick="deleteRecord('${record.id}')"
                                >
                                    Delete
                                </button>

                            </div>

                        </div>


                        ${
                            record.chief_complaint
                                ? `
                                    <div class="soap-section">

                                        <div class="soap-title">
                                            Chief Complaint
                                        </div>

                                        <div class="soap-text">
                                            ${escapeHTML(
                                                record.chief_complaint
                                            )}
                                        </div>

                                    </div>
                                  `
                                : ""
                        }


                        ${
                            record.subjective
                                ? `
                                    <div class="soap-section">

                                        <div class="soap-title">
                                            Subjective
                                        </div>

                                        <div class="soap-text">
                                            ${escapeHTML(
                                                record.subjective
                                            )}
                                        </div>

                                    </div>
                                  `
                                : ""
                        }


                        ${
                            record.objective
                                ? `
                                    <div class="soap-section">

                                        <div class="soap-title">
                                            Objective
                                        </div>

                                        <div class="soap-text">
                                            ${escapeHTML(
                                                record.objective
                                            )}
                                        </div>

                                    </div>
                                  `
                                : ""
                        }


                        ${
                            record.assessment
                                ? `
                                    <div class="soap-section">

                                        <div class="soap-title">
                                            Assessment
                                        </div>

                                        <div class="soap-text">
                                            ${escapeHTML(
                                                record.assessment
                                            )}
                                        </div>

                                    </div>
                                  `
                                : ""
                        }


                        ${
                            record.plan
                                ? `
                                    <div class="soap-section">

                                        <div class="soap-title">
                                            Plan
                                        </div>

                                        <div class="soap-text">
                                            ${escapeHTML(
                                                record.plan
                                            )}
                                        </div>

                                    </div>
                                  `
                                : ""
                        }


                        ${
                            record.diagnosis
                                ? `
                                    <div class="soap-section">

                                        <div class="soap-title">
                                            Diagnosis
                                        </div>

                                        <div class="soap-text">
                                            ${escapeHTML(
                                                record.diagnosis
                                            )}
                                        </div>

                                    </div>
                                  `
                                : ""
                        }


                    </div>
                    `;

                }
            );


            patientCard.innerHTML = `

                <div class="patient-header">

                    <div>

                        <div class="patient-name">

                            ${escapeHTML(
                                patient.name
                            )}

                        </div>


                        <div class="patient-info">

                            ${
                                patient.species ||
                                ""
                            }

                            ${
                                patient.breed
                                    ? " • " +
                                      patient.breed
                                    : ""
                            }

                            ${
                                patient.sex
                                    ? " • " +
                                      patient.sex
                                    : ""
                            }

                            <br>

                            Owner:
                            ${
                                patient.owner ||
                                "-"
                            }

                        </div>

                    </div>

                </div>


                ${
                    recordsHTML ||
                    `
                    <div class="empty-message">
                        No records for this patient.
                    </div>
                    `
                }

            `;


            container.appendChild(
                patientCard
            );

        }
    );

}


/* =====================================================
   DELETE RECORD
===================================================== */

async function deleteRecord(
    recordId
) {

    const confirmed =
        confirm(
            "Delete this medical record?"
        );


    if (!confirmed) {
        return;
    }


    const {
        error
    } =
    await supabaseClient
        .from("medical_records")
        .delete()
        .eq(
            "id",
            recordId
        )
        .eq(
            "clinic_id",
            currentClinic.clinicId
        );


    if (error) {

        console.error(
            "Delete error:",
            error
        );

        alert(
            "Failed to delete medical record."
        );

        return;
    }


    await loadMedicalRecords();

    renderMedicalHistory();

}


/* =====================================================
   DATE FORMAT
===================================================== */

function formatDate(
    value
) {

    if (!value) {
        return "-";
    }


    const date =
        new Date(
            value
        );


    if (Number.isNaN(
        date.getTime()
    )) {

        return value;

    }


    return date.toLocaleDateString(
        "en-GB",
        {
            day: "2-digit",
            month: "2-digit",
            year: "numeric"
        }
    );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(
    value
) {

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =====================================================
   START
===================================================== */

init();

</script>

</body>

</html>
