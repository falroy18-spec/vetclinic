<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Medical Records - VetClinic</title>

<link rel="stylesheet" href="style.css">

<style>

.medical-container {
    max-width: 1100px;
    margin: 0 auto;
}

.search-box {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
}

.search-box input {
    flex: 1;
    padding: 13px 15px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 14px;
}

.patient-list {
    display: grid;
    gap: 10px;
    margin-bottom: 20px;
}

.patient-result {
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 15px;
    cursor: pointer;
    transition: 0.2s;
}

.patient-result:hover {
    border-color: #6366f1;
    background: #f8f8ff;
}

.patient-result.active {
    border-color: #6366f1;
    background: #eef2ff;
}

.patient-result-name {
    font-size: 17px;
    font-weight: 700;
}

.patient-result-info {
    margin-top: 5px;
    color: #6b7280;
    font-size: 13px;
}

.selected-patient {
    background: #eef2ff;
    border: 1px solid #c7d2fe;
    border-radius: 10px;
    padding: 18px;
    margin-bottom: 20px;
}

.selected-patient h3 {
    margin: 0 0 5px;
}

.selected-patient p {
    margin: 4px 0;
    color: #6b7280;
}

.history-card {
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 15px;
}

.history-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 15px;
    margin-bottom: 15px;
}

.history-date {
    font-size: 13px;
    color: #6b7280;
}

.history-actions {
    display: flex;
    gap: 8px;
}

.history-actions button {
    border: none;
    border-radius: 7px;
    padding: 8px 12px;
    cursor: pointer;
    font-size: 13px;
}

.edit-btn {
    background: #f59e0b;
    color: white;
}

.delete-btn {
    background: #dc2626;
    color: white;
}

.soap-section {
    margin-top: 18px;
}

.soap-title {
    font-weight: 700;
    margin-bottom: 7px;
}

.soap-content {
    background: #f8fafc;
    padding: 13px;
    border-radius: 8px;
    white-space: pre-wrap;
    line-height: 1.5;
}

.vital-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
}

.vital-box {
    background: #f8fafc;
    border-radius: 8px;
    padding: 12px;
}

.vital-label {
    font-size: 12px;
    color: #6b7280;
}

.vital-value {
    font-weight: 700;
    margin-top: 4px;
}

.empty-state {
    text-align: center;
    padding: 35px;
    color: #6b7280;
}

.no-patient {
    background: white;
    padding: 30px;
    border-radius: 10px;
    text-align: center;
    color: #6b7280;
}

.show-all-btn {
    padding: 12px 16px;
    border: none;
    border-radius: 8px;
    background: #e5e7eb;
    cursor: pointer;
}

@media(max-width:800px) {

    .vital-grid {
        grid-template-columns: 1fr 1fr;
    }

    .history-header {
        flex-direction: column;
    }

}

@media(max-width:500px) {

    .vital-grid {
        grid-template-columns: 1fr;
    }

    .search-box {
        flex-direction: column;
    }

}

</style>

</head>


<body>


<div class="app">

<aside class="sidebar">

    <h1>🐾 VetClinic</h1>

    <nav>

        <a href="index.html">

        </a>

        <a href="patients.html">
            Patients
        </a>

        <a href="appointments.html">
            Appointments
        </a>

        <a href="medical-records.html"
           class="active">
            Medical Records
        </a>

        <a href="medicines.html">
            Medicines
        </a>

        <a href="billing.html">
            Billing
        </a>

        <a href="reports.html">
            Reports
        </a>

    </nav>

</aside>


<!-- MAIN -->

<main class="main-content">


<header>

    <div>

        <h2>
            Medical Records
        </h2>

        <p>
            Search and view medical history by patient.
        </p>

    </div>

</header>


<div class="medical-container">


<!-- SEARCH -->

<section class="appointments">

    <h3>
        Search Patient

    <div class="search-box">

        <input

         class="patient-list">

</section>


<!-- SELECTED PATIENT -->

<section
    class="appointments"
    id="selectedPatientSection"
    style="display:none;"
>


    <div
        id="selectedPatient"
        class="selected-patient"
    >

        <h3 id="selectedPatientName">
            -
        </h3>

        <p id="selectedPatientDetails">
            -
        </p>

        <p id="selectedPatientOwner">
            -
        </p>

    </div>


    <h3>
        Medical History
    </h3>

<!-- SUPABASE LIBRARY -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- YOUR CENTRAL SUPABASE CONFIG -->

<script src="clinic-context.js"></script>


<script>


/* ==================================================
   VARIABLES
================================================== */


let currentClinic = null;

let allPatients = [];

let selectedPatientId = null;


/* ==================================================
   ELEMENTS
================================================== */


const patientSearch =
    document.getElementById(
        "patientSearch"
    );


const patientList =
    document.getElementById(
        "patientList"
    );


const medicalHistory =
    document.getElementById(
        "medicalHistory"
    );


const selectedPatientSection =
    document.getElementById(
        "selectedPatientSection"
    );


const selectedPatientName =
    document.getElementById(
        "selectedPatientName"
    );


const selectedPatientDetails =
    document.getElementById(
        "selectedPatientDetails"
    );


const selectedPatientOwner =
    document.getElementById(
        "selectedPatientOwner"
    );


/* ==================================================
   ESCAPE HTML
================================================== */


function escapeHTML(value) {

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* ==================================================
   LOAD PATIENTS
================================================== */


async function loadPatients() {


    patientList.innerHTML = `

        <div class="empty-state">

            Loading patients...

        </div>

    `;


    const {
        data,
        error
    } =
    await supabaseClient

        .from("patients")

        .select(`
            id,
            name,
            species,
            breed,
            sex,
            owner_name,
            owner,
            phone,
            clinic_id
        `)

        .eq(
            "clinic_id",
            currentClinic.clinicId
        )

        .order(
            "name",
            {
                ascending: true
            }
        );


    if (error) {

        console.error(
            "Patients error:",
            error
        );


        patientList.innerHTML = `

            <div class="empty-state">

                Failed to load patients.

                <br><br>

                ${escapeHTML(
                    error.message
                )}

            </div>

        `;

        return;

    }


    allPatients =
        data || [];


    renderPatients(
        allPatients
    );

}


/* ==================================================
   RENDER PATIENTS
================================================== */


function renderPatients(
    patients
) {


    if (
        !patients ||
        patients.length === 0
    ) {

        patientList.innerHTML = `

            <div class="no-patient">

                No patient found.

            </div>

        `;

        return;

    }


    patientList.innerHTML = "";


    patients.forEach(
        patient => {


            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "patient-result";


            if (
                patient.id ===
                selectedPatientId
            ) {

                div.classList.add(
                    "active"
                );

            }


            const owner =
                patient.owner_name ||
                patient.owner ||
                "-";


            div.innerHTML = `

                <div class="patient-result-name">

                    🐾
                    ${escapeHTML(
                        patient.name
                    )}

                </div>


                <div class="patient-result-info">

                    ${escapeHTML(
                        patient.species ||
                        "-"
                    )}

                    ${
                        patient.breed
                        ? " • " +
                          escapeHTML(
                              patient.breed
                          )
                        : ""
                    }

                    ${
                        patient.sex
                        ? " • " +
                          escapeHTML(
                              patient.sex
                          )
                        : ""
                    }

                    <br>

                    Owner:
                    ${escapeHTML(
                        owner
                    )}

                </div>

            `;


            div.addEventListener(
                "click",
                function() {

                    selectPatient(
                        patient.id
                    );

                }
            );


            patientList.appendChild(
                div
            );

        }
    );

}


/* ==================================================
   SEARCH
================================================== */


patientSearch.addEventListener(
    "input",
    function() {


        const keyword =
            this.value
                .trim()
                .toLowerCase();


        if (!keyword) {

            renderPatients(
                allPatients
            );

            return;

        }


        const filtered =
            allPatients.filter(
                patient => {


                    const name =
                        String(
                            patient.name ||
                            ""
                        )
                        .toLowerCase();


                    const owner =
                        String(
                            patient.owner_name ||
                            patient.owner ||
                            ""
                        )
                        .toLowerCase();


                    return (

                        name.includes(
                            keyword
                        )

                        ||

                        owner.includes(
                            keyword
                        )

                    );

                }
            );


        renderPatients(
            filtered
        );

    }
);


/* ==================================================
   SHOW ALL
================================================== */


document
    .getElementById(
        "showAllBtn"
    )
    .addEventListener(
        "click",
        function() {


            patientSearch.value =
                "";


            selectedPatientId =
                null;


            selectedPatientSection
                .style
                .display =
                "none";


            renderPatients(
                allPatients
            );

        }
    );


/* ==================================================
   SELECT PATIENT
================================================== */


async function selectPatient(
    patientId
) {


    const patient =
        allPatients.find(
            p =>
                p.id ===
                patientId
        );


    if (!patient) {

        return;

    }


    selectedPatientId =
        patientId;


    selectedPatientSection
        .style
        .display =
        "block";


    selectedPatientName
        .textContent =
        patient.name;


    selectedPatientDetails
        .textContent =

        (
            patient.species ||
            "-"
        )

        +

        (
            patient.breed
            ? " • " +
              patient.breed
            : ""
        )

        +

        (
            patient.sex
            ? " • " +
              patient.sex
            : ""
        );


    selectedPatientOwner
        .textContent =

        "Owner: " +

        (
            patient.owner_name ||
            patient.owner ||
            "-"
        );


    renderPatients(
        getCurrentSearchResults()
    );


    await loadMedicalHistory(
        patientId
    );


}


/* ==================================================
   CURRENT SEARCH RESULTS
================================================== */


function getCurrentSearchResults() {


    const keyword =
        patientSearch.value
            .trim()
            .toLowerCase();


    if (!keyword) {

        return allPatients;

    }


    return allPatients.filter(
        patient => {


            const name =
                String(
                    patient.name ||
                    ""
                )
                .toLowerCase();


            const owner =
                String(
                    patient.owner_name ||
                    patient.owner ||
                    ""
                )
                .toLowerCase();


            return (

                name.includes(
                    keyword
                )

                ||

                owner.includes(
                    keyword
                )

            );

        }
    );

}


/* ==================================================
   LOAD HISTORY
================================================== */


async function loadMedicalHistory(
    patientId
) {


    medicalHistory.innerHTML = `

        <div class="empty-state">

            Loading medical history...

        </div>

    `;


    const {
        data,
        error
    } =
    await supabaseClient

        .from("medical_records")

        .select("*")

        .eq(
            "patient_id",
            patientId
        )

        .order(
            "created_at",
            {
                ascending: false
            }
        );


    if (error) {

        console.error(
            "Medical history error:",
            error
        );


        medicalHistory.innerHTML = `

            <div class="empty-state">

                Failed to load medical history.

                <br><br>

                ${escapeHTML(
                    error.message
                )}

            </div>

        `;

        return;

    }


    if (
        !data ||
        data.length === 0
    ) {

        medicalHistory.innerHTML = `

            <div class="empty-state">

                No medical records for

                <strong>
                    ${escapeHTML(
                        selectedPatientName
                            .textContent
                    )}
                </strong>

                yet.

            </div>

        `;

        return;

    }


    medicalHistory.innerHTML =
        "";


    data.forEach(
        record => {


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "history-card";


            const visitDate =
                record.visit_date ||
                record.created_at;


            const formattedDate =
                visitDate
                ? new Date(
                    visitDate
                  ).toLocaleString(
                      "en-GB",
                      {
                          dateStyle:
                              "medium",
                          timeStyle:
                              "short"
                      }
                  )
                : "-";


            const objective =
                parseObjective(
                    record.objective
                );


            card.innerHTML = `


                <div class="history-header">


                    <div>

                        <strong>
                            Medical Visit
                        </strong>

                        <div class="history-date">

                            ${escapeHTML(
                                formattedDate
                            )}

                        </div>

                    </div>


                    <div class="history-actions">


                        <button
                            type="button"
                            class="edit-btn"
                            onclick="editMedicalRecord('${record.id}')"
                        >

                            Edit

                        </button>


                        <button
                            type="button"
                            class="delete-btn"
                            onclick="deleteMedicalRecord('${record.id}')"
                        >

                            Delete

                        </button>


                    </div>


                </div>



                ${
                    record.chief_complaint
                    ? `

                        <div class="soap-section">

                            <div class="soap-title">

                                Chief Complaint

                            </div>

                            <div class="soap-content">

                                ${escapeHTML(
                                    record.chief_complaint
                                )}

                            </div>

                        </div>

                    `
                    : ""
                }



                ${
                    record.subjective
                    ? `

                        <div class="soap-section">

                            <div class="soap-title">

                                S — Subjective

                            </div>

                            <div class="soap-content">

                                ${escapeHTML(
                                    record.subjective
                                )}

                            </div>

                        </div>

                    `
                    : ""
                }



                <div class="soap-section">

                    <div class="soap-title">

                        O — Objective

                    </div>


                    <div class="vital-grid">


                        <div class="vital-box">

                            <div class="vital-label">
                                Temperature
                            </div>

                            <div class="vital-value">

                                ${
                                    objective.temperature
                                    || "-"
                                }

                                ${
                                    objective.temperature
                                    ? " °C"
                                    : ""
                                }

                            </div>

                        </div>


                        <div class="vital-box">

                            <div class="vital-label">
                                Heart Rate
                            </div>

                            <div class="vital-value">

                                ${
                                    objective.heartRate
                                    || "-"
                                }

                                ${
                                    objective.heartRate
                                    ? " bpm"
                                    : ""
                                }

                            </div>

                        </div>


                        <div class="vital-box">

                            <div class="vital-label">
                                Respiratory Rate
                            </div>

                            <div class="vital-value">

                                ${
                                    objective.respiratoryRate
                                    || "-"
                                }

                                ${
                                    objective.respiratoryRate
                                    ? " rpm"
                                    : ""
                                }

                            </div>

                        </div>


                        <div class="vital-box">

                            <div class="vital-label">
                                Weight
                            </div>

                            <div class="vital-value">

                                ${
                                    objective.weight
                                    || "-"
                                }

                                ${
                                    objective.weight
                                    ? " kg"
                                    : ""
                                }

                            </div>

                        </div>


                        <div class="vital-box">

                            <div class="vital-label">
                                CRT
                            </div>

                            <div class="vital-value">

                                ${
                                    objective.crt
                                    || "-"
                                }

                                ${
                                    objective.crt
                                    ? " sec"
                                    : ""
                                }

                            </div>

                        </div>


                        <div class="vital-box">

                            <div class="vital-label">
                                Mucous Membrane
                            </div>

                            <div class="vital-value">

                                ${
                                    escapeHTML(
                                        objective.mucous
                                        || "-"
                                    )
                                }

                            </div>

                        </div>


                        <div class="vital-box">

                            <div class="vital-label">
                                BCS
                            </div>

                            <div class="vital-value">

                                ${
                                    objective.bcs
                                    || "-"
                                }

                                ${
                                    objective.bcs
                                    ? "/9"
                                    : ""
                                }

                            </div>

                        </div>


                    </div>


                    ${
                        objective.additional
                        ? `

                            <div
                                class="soap-content"
                                style="margin-top:10px;"
                            >

                                ${escapeHTML(
                                    objective.additional
                                )}

                            </div>

                        `
                        : ""
                    }


                </div>



                ${
                    record.assessment
                    ? `

                        <div class="soap-section">

                            <div class="soap-title">

                                A — Assessment

                            </div>

                            <div class="soap-content">

                                ${escapeHTML(
                                    record.assessment
                                )}

                            </div>

                        </div>

                    `
                    : ""
                }



                ${
                    record.plan
                    ? `

                        <div class="soap-section">

                            <div class="soap-title">

                                P — Plan

                            </div>

                            <div class="soap-content">

                                ${escapeHTML(
                                    record.plan
                                )}

                            </div>

                        </div>

                    `
                    : ""
                }



                ${
                    record.diagnosis
                    ? `

                        <div class="soap-section">

                            <div class="soap-title">

                                Diagnosis

                            </div>

                            <div class="soap-content">

                                ${escapeHTML(
                                    record.diagnosis
                                )}

                            </div>

                        </div>

                    `
                    : ""
                }



                ${
                    record.medication
                    ? `

                        <div class="soap-section">

                            <div class="soap-title">

                                Medication

                            </div>

                            <div class="soap-content">

                                ${escapeHTML(
                                    record.medication
                                )}

                            </div>

                        </div>

                    `
                    : ""
                }



                ${
                    record.treatment
                    ? `

                        <div class="soap-section">

                            <div class="soap-title">

                                Treatment

                            </div>

                            <div class="soap-content">

                                ${escapeHTML(
                                    record.treatment
                                )}

                            </div>

                        </div>

                    `
                    : ""
                }



                ${
                    record.procedure
                    ? `

                        <div class="soap-section">

                            <div class="soap-title">

                                Procedure

                            </div>

                            <div class="soap-content">

                                ${escapeHTML(
                                    record.procedure
                                )}

                            </div>

                        </div>

                    `
                    : ""
                }



                ${
                    record.follow_up_date
                    ? `

                        <div class="soap-section">

                            <div class="soap-title">

                                Follow-up

                            </div>

                            <div class="soap-content">

                                ${escapeHTML(
                                    record.follow_up_date
                                )}

                            </div>

                        </div>

                    `
                    : ""
                }



                ${
                    record.notes
                    ? `

                        <div class="soap-section">

                            <div class="soap-title">

                                Notes

                            </div>

                            <div class="soap-content">

                                ${escapeHTML(
                                    record.notes
                                )}

                            </div>

                        </div>

                    `
                    : ""
                }

            `;


            medicalHistory.appendChild(
                card
            );

        }
    );

}


/* ==================================================
   PARSE OBJECTIVE
================================================== */


function parseObjective(
    text
) {


    const result = {

        temperature: "",

        heartRate: "",

        respiratoryRate: "",

        crt: "",

        mucous: "",

        weight: "",

        bcs: "",

        additional: ""

    };


    if (!text) {

        return result;

    }


    const value =
        String(text);


    const temp =
        value.match(
            /Temperature:\s*([0-9.]+)/i
        );


    const hr =
        value.match(
            /Heart Rate\/Pulse:\s*([0-9.]+)/i
        );


    const rr =
        value.match(
            /Respiratory Rate:\s*([0-9.]+)/i
        );


    const crt =
        value.match(
            /CRT:\s*([0-9.]+)/i
        );


    const mm =
        value.match(
            /Mucous Membrane:\s*([^\n]+)/i
        );


    const weight =
        value.match(
            /Weight:\s*([0-9.]+)/i
        );


    const bcs =
        value.match(
            /BCS:\s*([0-9.]+)\/9/i
        );


    result.temperature =
        temp
        ? temp[1]
        : "";


    result.heartRate =
        hr
        ? hr[1]
        : "";


    result.respiratoryRate =
        rr
        ? rr[1]
        : "";


    result.crt =
        crt
        ? crt[1]
        : "";


    result.mucous =
        mm
        ? mm[1]
        : "";


    result.weight =
        weight
        ? weight[1]
        : "";


    result.bcs =
        bcs
        ? bcs[1]
        : "";


    const additional =
        value.indexOf(
            "Additional Findings:"
        );


    if (
        additional !== -1
    ) {

        result.additional =
            value
            .substring(
                additional +
                "Additional Findings:"
                .length
            )
            .trim();

    }


    return result;

}


/* ==================================================
   EDIT
================================================== */


async function editMedicalRecord(
    recordId
) {


    window.location.href =
        "medical-record-detail.html?id=" +
        encodeURIComponent(
            recordId
        );

}


/* ==================================================
   DELETE
================================================== */


async function deleteMedicalRecord(
    recordId
) {


    const confirmed =
        confirm(
            "Are you sure you want to delete this medical record?"
        );


    if (!confirmed) {

        return;

    }


    const {
        error
    } =
    await supabaseClient

        .from(
            "medical_records"
        )

        .delete()

        .eq(
            "id",
            recordId
        );


    if (error) {

        alert(
            "Failed to delete medical record:\n\n" +
            error.message
        );

        return;

    }


    await loadMedicalHistory(
        selectedPatientId
    );

}

async function init() {


    /*
       Get clinic from
       clinic-context.js
    */

    currentClinic =
        await getCurrentClinic();


    /*
       Kalau session tidak terbaca,
       JANGAN redirect dari sini.

    */

    if (!currentClinic) {

        patientList.innerHTML = `

            <div class="empty-state">

                Unable to load clinic information.

                <br><br>

                Please refresh the page.

            </div>

        `;

        return;

    }


    console.log(
        "Current clinic:",
        currentClinic
    );


    await loadPatients();

}


init();
