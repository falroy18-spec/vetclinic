<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Medical Record Detail - VetClinic</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
    }

    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      width: 190px;
      background: white;
      border-right: 1px solid #e5e7eb;
      padding: 25px 13px;
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
      margin: 5px 10px 30px;
    }

    .nav a {
      display: block;
      padding: 10px 11px;
      margin-bottom: 4px;
      text-decoration: none;
      color: #374151;
      border-radius: 7px;
      font-size: 14px;
    }

    .nav a.active {
      background: #111827;
      color: white;
    }

    .main {
      margin-left: 190px;
      padding: 35px 28px;
      max-width: 1200px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    h1 {
      margin: 0;
      font-size: 25px;
    }

    .subtitle {
      color: #6b7280;
      margin-top: 6px;
      font-size: 14px;
    }

    button {
      border: 0;
      border-radius: 7px;
      padding: 10px 16px;
      cursor: pointer;
      font-weight: 600;
    }

    .back {
      background: #111827;
      color: white;
    }

    .edit {
      background: #2563eb;
      color: white;
    }

    .card {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 22px;
      margin-bottom: 20px;
    }

    .card h2 {
      margin: 0 0 18px;
      font-size: 18px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .field label {
      display: block;
      font-size: 12px;
      font-weight: bold;
      color: #6b7280;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .field div {
      min-height: 22px;
      white-space: pre-wrap;
    }

    .full {
      grid-column: 1 / -1;
    }

    .error {
      background: #fee2e2;
      color: #b91c1c;
      padding: 13px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #6b7280;
    }

    @media (max-width: 700px) {
      .sidebar {
        display: none;
      }

      .main {
        margin-left: 0;
        padding: 20px;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }
    }
  </style>
</head>

<body>

  <aside class="sidebar">
    <div class="logo">🐾 VetClinic</div>

    <nav class="nav">
      <a href="index.html">Dashboard</a>
      <a href="patients.html">Patients</a>
      <a href="appointments.html">Appointments</a>
      <a href="medical-records.html" class="active">Medical Records</a>
      <a href="medicines.html">Medicines</a>
      <a href="billing.html">Billing</a>
      <a href="reports.html">Reports</a>
      <a href="backup.html">Backup & Restore</a>
    </nav>
  </aside>

  <main class="main">

    <div class="top">
      <div>
        <h1>Medical Record</h1>
        <div class="subtitle">View patient's medical record.</div>
      </div>

      <div>
        <button class="back" onclick="history.back()">← Back</button>
        <button class="edit" id="editBtn">Edit</button>
      </div>
    </div>

    <div id="errorBox" class="error"></div>

    <div id="loading" class="loading">
      Loading medical record...
    </div>

    <div id="content" style="display:none;">

      <section class="card">
        <h2>Patient</h2>

        <div class="grid">
          <div class="field">
            <label>Patient</label>
            <div id="patientName">-</div>
          </div>

          <div class="field">
            <label>Visit Date</label>
            <div id="visitDate">-</div>
          </div>

          <div class="field">
            <label>Visit Type</label>
            <div id="visitType">-</div>
          </div>

          <div class="field">
            <label>Owner</label>
            <div id="owner">-</div>
          </div>
        </div>
      </section>

      <section class="card" id="consultationSection">
        <h2>Consultation</h2>

        <div class="grid">

          <div class="field full">
            <label>Chief Complaint</label>
            <div id="chiefComplaint">-</div>
          </div>

          <div class="field full">
            <label>Subjective</label>
            <div id="subjective">-</div>
          </div>

          <div class="field">
            <label>Temperature</label>
            <div id="temperature">-</div>
          </div>

          <div class="field">
            <label>Heart Rate / Pulse</label>
            <div id="heartRate">-</div>
          </div>

          <div class="field">
            <label>Respiratory Rate</label>
            <div id="respiratoryRate">-</div>
          </div>

          <div class="field">
            <label>Weight</label>
            <div id="weight">-</div>
          </div>

          <div class="field full">
            <label>Objective</label>
            <div id="objective">-</div>
          </div>

          <div class="field full">
            <label>Assessment</label>
            <div id="assessment">-</div>
          </div>

          <div class="field full">
            <label>Diagnosis</label>
            <div id="diagnosis">-</div>
          </div>

          <div class="field full">
            <label>Plan</label>
            <div id="plan">-</div>
          </div>

          <div class="field full">
            <label>Treatment</label>
            <div id="treatment">-</div>
          </div>

          <div class="field full">
            <label>Medication</label>
            <div id="medication">-</div>
          </div>

          <div class="field full">
            <label>Procedure</label>
            <div id="procedure">-</div>
          </div>

          <div class="field full">
            <label>Notes</label>
            <div id="notes">-</div>
          </div>

          <div class="field">
            <label>Follow-up Date</label>
            <div id="followUpDate">-</div>
          </div>

        </div>
      </section>

    </div>
  </main>

<script>
/* =====================================================
   SUPABASE CONNECTION
   ===================================================== */

const SUPABASE_URL =
  "https://zltbjbbofvvndxirlipf.supabase.co";

/*
  PENTING:
  GANTI bagian di bawah dengan SUPABASE ANON/PUBLISHABLE KEY
  yang SAMA PERSIS dengan add-record.html
*/
const SUPABASE_ANON_KEY =
  "sb_publishable_MWH4JPfiiJ2gvIqYpKE_Yw_UAoAlnFJ";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);


/* =====================================================
   GET RECORD ID
   ===================================================== */

const params = new URLSearchParams(window.location.search);
const recordId = params.get("id");

const loading = document.getElementById("loading");
const content = document.getElementById("content");
const errorBox = document.getElementById("errorBox");


/* =====================================================
   HELPER
   ===================================================== */

function setText(id, value) {
  const element = document.getElementById(id);

  if (!element) return;

  if (
    value === null ||
    value === undefined ||
    value === ""
  ) {
    element.textContent = "-";
  } else {
    element.textContent = value;
  }
}


/* =====================================================
   LOAD MEDICAL RECORD
   ===================================================== */

async function loadRecord() {

  if (!recordId) {
    showError("Medical record ID tidak ditemukan.");
    return;
  }

  try {

    const { data, error } = await supabaseClient
      .from("medical_records")
      .select("*")
      .eq("id", recordId)
      .single();

    if (error) {
      throw error;
    }

    if (!data) {
      throw new Error("Medical record tidak ditemukan.");
    }

    console.log("Medical record:", data);

    /* Patient */
    let patientName = "-";
    let ownerName = "-";

    if (data.patient_id) {

      const { data: patient, error: patientError } =
        await supabaseClient
          .from("patients")
          .select("*")
          .eq("id", data.patient_id)
          .single();

      if (!patientError && patient) {

        /*
          Database kamu menggunakan kolom "owner",
          bukan "owner_name".
        */

        patientName =
          patient.name ||
          patient.patient_name ||
          "-";

        ownerName =
          patient.owner ||
          "-";
      }
    }

    setText("patientName", patientName);
    setText("owner", ownerName);

    /* Basic */
    setText("visitDate", data.visit_date);
    setText("visitType", data.visit_type);

    /* Consultation */
    setText("chiefComplaint", data.chief_complaint);
    setText("subjective", data.subjective);
    setText("objective", data.objective);
    setText("assessment", data.assessment);
    setText("diagnosis", data.diagnosis);
    setText("plan", data.plan);
    setText("treatment", data.treatment);
    setText("medication", data.medication);
    setText("procedure", data.procedure);
    setText("notes", data.notes);
    setText("followUpDate", data.follow_up_date);

    /*
      Karena nama kolom pemeriksaan fisik bisa berbeda,
      cek beberapa kemungkinan.
    */

    setText(
      "temperature",
      data.temperature ?? data.temp
    );

    setText(
      "heartRate",
      data.heart_rate ?? data.pulse
    );

    setText(
      "respiratoryRate",
      data.respiratory_rate ?? data.resp_rate
    );

    setText(
      "weight",
      data.weight
    );

    /* Grooming tidak menampilkan SOAP tambahan */
    if (data.visit_type === "grooming") {
      document.getElementById("consultationSection")
        .querySelector("h2").textContent = "Grooming Health Check";
    }

    loading.style.display = "none";
    content.style.display = "block";

    /* Edit button */
    document.getElementById("editBtn").onclick = function() {
      window.location.href =
        "add-record.html?id=" + encodeURIComponent(recordId);
    };

  } catch (error) {

    console.error(error);

    showError(
      "Gagal memuat medical record: " +
      (error.message || error)
    );
  }
}


/* =====================================================
   ERROR
   ===================================================== */

function showError(message) {

  loading.style.display = "none";

  errorBox.textContent = message;
  errorBox.style.display = "block";
}


/* =====================================================
   START
   ===================================================== */

loadRecord();

</script>

</body>
</html>
