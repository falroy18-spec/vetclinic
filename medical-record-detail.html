<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Medical Record Detail - VetClinic</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .record-form {
            max-width: 1000px;
        }

        .form-section {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 22px;
            margin-bottom: 20px;
        }

        .form-section h3 {
            margin-top: 0;
            margin-bottom: 18px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        .form-group label {
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 11px 13px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
        }

        .form-group textarea {
            min-height: 120px;
            resize: vertical;
        }

        .patient-box {
            background: #eef2ff;
            border: 1px solid #c7d2fe;
            border-radius: 10px;
            padding: 16px;
            margin-top: 15px;
        }

        .patient-box h3 {
            margin: 0 0 6px;
        }

        .patient-box p {
            margin: 4px 0;
            color: #6b7280;
        }

        .vital-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .unit-wrapper {
            position: relative;
        }

        .unit-wrapper input {
            padding-right: 50px;
        }

        .unit {
            position: absolute;
            right: 13px;
            top: 50%;
            transform: translateY(-50%);
            color: #6b7280;
            font-size: 13px;
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        .cancel-button {
            text-decoration: none;
        }

        button {
            cursor: pointer;
        }

        .save-button {
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            font-weight: 600;
        }

        .status-message {
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .status-success {
            background: #ecfdf5;
            color: #047857;
        }

        .status-error {
            background: #fef2f2;
            color: #b91c1c;
        }

        @media(max-width: 800px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .vital-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media(max-width: 500px) {
            .vital-grid {
                grid-template-columns: 1fr;
            }

            .form-actions {
                flex-direction: column;
            }

            .form-actions a,
            .form-actions button {
                width: 100%;
                text-align: center;
                box-sizing: border-box;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <h1>🐾 VetClinic</h1>

        <nav>

            <a href="index.html">
                Dashboard
            </a>

            <a href="patients.html">
                Patients
            </a>

            <a href="appointments.html">
                Appointments
            </a>

            <a href="medical-records.html"
               class="active">
                Medical Records
            </a>

            <a href="medicines.html">
                Medicines
            </a>

            <a href="billing.html">
                Billing
            </a>

            <a href="reports.html">
                Reports
            </a>

        </nav>

    </aside>


    <!-- MAIN -->
    <main class="main-content">

        <header>

            <div>

                <h2 id="pageTitle">
                    New Medical Record
                </h2>

                <p>
                    Create or edit a patient's medical record.
                </p>

            </div>

            <a
                href="medical-records.html"
                class="cancel-button"
            >
                ← Back
            </a>

        </header>


        <div class="record-form">

            <div
                id="statusMessage"
                class="status-message"
            ></div>


            <!-- PATIENT -->
            <section class="form-section">

                <h3>
                    Patient
                </h3>

                <div class="form-group">

                    <label>
                        Select Patient
                    </label>

                    <select
                        id="patientId"
                        required
                    >

                        <option value="">
                            Select patient
                        </option>

                    </select>

                </div>


                <div
                    id="patientInfo"
                    class="patient-box"
                    style="display:none;"
                >

                    <h3 id="patientName">
                        -
                    </h3>

                    <p id="patientDetails">
                        -
                    </p>

                    <p id="patientOwner">
                        -
                    </p>

                </div>

            </section>


            <!-- CONSULTATION -->
            <section class="form-section">

                <h3>
                    Consultation
                </h3>

                <div class="form-grid">

                    <div class="form-group">

                        <label>
                            Visit Date
                        </label>

                        <input
                            type="datetime-local"
                            id="visitDate"
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Visit Type
                        </label>

                        <select id="visitType">

                            <option value="consultation">
                                Consultation
                            </option>

                            <option value="grooming">
                                Grooming
                            </option>

                        </select>

                    </div>


                    <div class="form-group full">

                        <label>
                            Chief Complaint
                        </label>

                        <input
                            type="text"
                            id="chiefComplaint"
                            placeholder="Main complaint..."
                        >

                    </div>


                    <div class="form-group full">

                        <label>
                            S — Subjective
                        </label>

                        <textarea
                            id="subjective"
                            placeholder="History, owner's complaint, appetite, drinking, vomiting, diarrhea, urination, defecation, etc."
                        ></textarea>

                    </div>

                </div>

            </section>


            <!-- OBJECTIVE -->
            <section class="form-section">

                <h3>
                    O — Objective
                </h3>

                <div class="vital-grid">

                    <div class="form-group">

                        <label>
                            Temperature
                        </label>

                        <div class="unit-wrapper">

                            <input
                                type="number"
                                id="temperature"
                                step="0.1"
                                min="30"
                                max="45"
                                placeholder="38.5"
                            >

                            <span class="unit">
                                °C
                            </span>

                        </div>

                    </div>


                    <div class="form-group">

                        <label>
                            Heart Rate / Pulse
                        </label>

                        <div class="unit-wrapper">

                            <input
                                type="number"
                                id="heartRate"
                                min="0"
                                placeholder="120"
                            >

                            <span class="unit">
                                bpm
                            </span>

                        </div>

                    </div>


                    <div class="form-group">

                        <label>
                            Respiratory Rate
                        </label>

                        <div class="unit-wrapper">

                            <input
                                type="number"
                                id="respiratoryRate"
                                min="0"
                                placeholder="30"
                            >

                            <span class="unit">
                                /min
                            </span>

                        </div>

                    </div>


                    <div class="form-group">

                        <label>
                            Weight
                        </label>

                        <div class="unit-wrapper">

                            <input
                                type="number"
                                id="weight"
                                min="0"
                                step="0.01"
                                placeholder="4.50"
                            >

                            <span class="unit">
                                kg
                            </span>

                        </div>

                    </div>


                    <div class="form-group">

                        <label>
                            CRT
                        </label>

                        <div class="unit-wrapper">

                            <input
                                type="number"
                                id="crt"
                                min="0"
                                step="0.1"
                                placeholder="2"
                            >

                            <span class="unit">
                                sec
                            </span>

                        </div>

                    </div>


                    <div class="form-group">

                        <label>
                            Mucous Membrane
                        </label>

                        <select id="mucousMembrane">

                            <option value="">
                                Select
                            </option>

                            <option value="Pink">
                                Pink
                            </option>

                            <option value="Pale">
                                Pale
                            </option>

                            <option value="Icteric">
                                Icteric
                            </option>

                            <option value="Cyanotic">
                                Cyanotic
                            </option>

                            <option value="Hyperemic">
                                Hyperemic
                            </option>

                            <option value="Congested">
                                Congested
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label>
                            Hydration
                        </label>

                        <select id="hydration">

                            <option value="">
                                Select
                            </option>

                            <option value="Normal">
                                Normal
                            </option>

                            <option value="Mild dehydration">
                                Mild dehydration
                            </option>

                            <option value="Moderate dehydration">
                                Moderate dehydration
                            </option>

                            <option value="Severe dehydration">
                                Severe dehydration
                            </option>

                            <option value="Overhydrated">
                                Overhydrated
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label>
                            BCS
                        </label>

                        <div class="unit-wrapper">

                            <input
                                type="number"
                                id="bcs"
                                min="1"
                                max="9"
                                step="1"
                                placeholder="5"
                            >

                            <span class="unit">
                                /9
                            </span>

                        </div>

                    </div>

                </div>


                <div
                    class="form-group"
                    style="margin-top:16px;"
                >

                    <label>
                        Additional Findings
                    </label>

                    <textarea
                        id="additionalFindings"
                        placeholder="Physical examination findings..."
                    ></textarea>

                </div>

            </section>


            <!-- ASSESSMENT -->
            <section class="form-section">

                <h3>
                    A — Assessment
                </h3>

                <div class="form-group">

                    <label>
                        Assessment / Diagnosis
                    </label>

                    <textarea
                        id="assessment"
                        placeholder="Differential diagnosis, working diagnosis, interpretation..."
                    ></textarea>

                </div>

            </section>


            <!-- PLAN -->
            <section class="form-section">

                <h3>
                    P — Plan
                </h3>

                <div class="form-grid">

                    <div class="form-group full">

                        <label>
                            Plan
                        </label>

                        <textarea
                            id="plan"
                            placeholder="Diagnostic plan, treatment plan, monitoring..."
                        ></textarea>

                    </div>


                    <div class="form-group">

                        <label>
                            Diagnosis
                        </label>

                        <input
                            type="text"
                            id="diagnosis"
                            placeholder="Final diagnosis"
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Medication
                        </label>

                        <textarea
                            id="medication"
                            placeholder="Drug, dose, route, frequency..."
                        ></textarea>

                    </div>


                    <div class="form-group">

                        <label>
                            Treatment
                        </label>

                        <textarea
                            id="treatment"
                            placeholder="Treatment performed..."
                        ></textarea>

                    </div>


                    <div class="form-group">

                        <label>
                            Procedure
                        </label>

                        <textarea
                            id="procedure"
                            placeholder="Procedure performed..."
                        ></textarea>

                    </div>


                    <div class="form-group">

                        <label>
                            Follow-up Date
                        </label>

                        <input
                            type="date"
                            id="followUpDate"
                        >

                    </div>


                    <div class="form-group full">

                        <label>
                            Notes
                        </label>

                        <textarea
                            id="notes"
                            placeholder="Additional notes..."
                        ></textarea>

                    </div>

                </div>

            </section>


            <!-- ACTIONS -->
            <div class="form-actions">

                <a
                    href="medical-records.html"
                    class="cancel-button"
                >
                    Cancel
                </a>

                <button
                    type="button"
                    class="save-button"
                    id="saveButton"
                >
                    Save Medical Record
                </button>

            </div>

        </div>

    </main>

</div>


<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="clinic-context.js"></script>


<script>

let currentClinic = null;
let patients = [];
let recordId = null;


const patientSelect =
    document.getElementById("patientId");

const patientInfo =
    document.getElementById("patientInfo");

const patientName =
    document.getElementById("patientName");

const patientDetails =
    document.getElementById("patientDetails");

const patientOwner =
    document.getElementById("patientOwner");

const statusMessage =
    document.getElementById("statusMessage");

const pageTitle =
    document.getElementById("pageTitle");


const params =
    new URLSearchParams(
        window.location.search
    );

recordId =
    params.get("id");


function showMessage(message, type) {

    statusMessage.textContent = message;

    statusMessage.className =
        "status-message " +
        (
            type === "success"
                ? "status-success"
                : "status-error"
        );

    statusMessage.style.display =
        "block";

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


function formatDateTimeLocal(value) {

    const date =
        new Date(value);

    if (
        Number.isNaN(
            date.getTime()
        )
    ) {
        return "";
    }

    const year =
        date.getFullYear();

    const month =
        String(
            date.getMonth() + 1
        ).padStart(2, "0");

    const day =
        String(
            date.getDate()
        ).padStart(2, "0");

    const hours =
        String(
            date.getHours()
        ).padStart(2, "0");

    const minutes =
        String(
            date.getMinutes()
        ).padStart(2, "0");

    return (
        year +
        "-" +
        month +
        "-" +
        day +
        "T" +
        hours +
        ":" +
        minutes
    );
}


/* =========================
   LOAD PATIENTS
========================= */

async function loadPatients() {

    const {
        data,
        error
    } =
        await supabaseClient

            .from("patients")

            .select(`
                id,
                name,
                species,
                breed,
                sex,
                owner,
                phone,
                clinic_id
            `)

            .eq(
                "clinic_id",
                currentClinic.clinicId
            )

            .order(
                "name",
                {
                    ascending: true
                }
            );


    if (error) {

        console.error(
            "Patients error:",
            error
        );

        showMessage(
            "Failed to load patients: " +
            error.message,
            "error"
        );

        return;
    }


    patients =
        data || [];


    patientSelect.innerHTML = `
        <option value="">
            Select patient
        </option>
    `;


    patients.forEach(
        patient => {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                patient.id;

            option.textContent =
                patient.name +
                " — " +
                (
                    patient.owner ||
                    "No owner"
                );

            patientSelect.appendChild(
                option
            );

        }
    );
}


/* =========================
   PATIENT CHANGE
========================= */

patientSelect.addEventListener(
    "change",
    function() {

        const patient =
            patients.find(
                item =>
                    item.id ===
                    this.value
            );


        if (!patient) {

            patientInfo.style.display =
                "none";

            return;
        }


        patientInfo.style.display =
            "block";


        patientName.textContent =
            patient.name;


        patientDetails.textContent =
            (
                patient.species ||
                "-"
            ) +

            (
                patient.breed
                    ? " • " +
                      patient.breed
                    : ""
            ) +

            (
                patient.sex
                    ? " • " +
                      patient.sex
                    : ""
            );


        patientOwner.textContent =
            "Owner: " +
            (
                patient.owner ||
                "-"
            );

    }
);


/* =========================
   LOAD RECORD
========================= */

async function loadRecord() {

    if (!recordId) {

        pageTitle.textContent =
            "New Medical Record";

        return;
    }


    pageTitle.textContent =
        "Edit Medical Record";


    const {
        data: record,
        error
    } =
        await supabaseClient

            .from("medical_records")

            .select("*")

            .eq(
                "id",
                recordId
            )

            .eq(
                "clinic_id",
                currentClinic.clinicId
            )

            .maybeSingle();


    if (error) {

        console.error(
            "Record error:",
            error
        );

        showMessage(
            "Failed to load record: " +
            error.message,
            "error"
        );

        return;
    }


    if (!record) {

        showMessage(
            "Medical record not found.",
            "error"
        );

        return;
    }


    patientSelect.value =
        record.patient_id || "";


    patientSelect.dispatchEvent(
        new Event("change")
    );


    document.getElementById(
        "visitDate"
    ).value =
        record.visit_date
            ? formatDateTimeLocal(
                record.visit_date
            )
            : "";


    document.getElementById(
        "visitType"
    ).value =
        record.visit_type ||
        "consultation";


    document.getElementById(
        "chiefComplaint"
    ).value =
        record.chief_complaint ||
        "";


    document.getElementById(
        "subjective"
    ).value =
        record.subjective ||
        "";


    document.getElementById(
        "temperature"
    ).value =
        record.temperature ??
        "";


    document.getElementById(
        "heartRate"
    ).value =
        record.heart_rate ??
        "";


    document.getElementById(
        "respiratoryRate"
    ).value =
        record.respiratory_rate ??
        "";


    document.getElementById(
        "weight"
    ).value =
        record.weight ??
        "";


    document.getElementById(
        "crt"
    ).value =
        record.crt ??
        "";


    document.getElementById(
        "mucousMembrane"
    ).value =
        record.mucous_membrane ||
        "";


    document.getElementById(
        "hydration"
    ).value =
        record.hydration ||
        "";


    document.getElementById(
        "bcs"
    ).value =
        record.bcs ??
        "";


    document.getElementById(
        "additionalFindings"
    ).value =
        extractAdditionalFindings(
            record.objective
        );


    document.getElementById(
        "assessment"
    ).value =
        record.assessment ||
        "";


    document.getElementById(
        "plan"
    ).value =
        record.plan ||
        "";


    document.getElementById(
        "diagnosis"
    ).value =
        record.diagnosis ||
        "";


    document.getElementById(
        "medication"
    ).value =
        record.medication ||
        "";


    document.getElementById(
        "treatment"
    ).value =
        record.treatment ||
        "";


    document.getElementById(
        "procedure"
    ).value =
        record.procedure ||
        "";


    document.getElementById(
        "followUpDate"
    ).value =
        record.follow_up_date ||
        "";


    document.getElementById(
        "notes"
    ).value =
        record.notes ||
        "";
}


/* =========================
   OBJECTIVE
========================= */

function extractAdditionalFindings(
    objective
) {

    if (!objective) {
        return "";
    }

    const text =
        String(objective);

    const marker =
        "Additional Findings:";

    const index =
        text.indexOf(marker);

    if (index === -1) {
        return "";
    }

    return text
        .substring(
            index +
            marker.length
        )
        .trim();
}


function buildObjective() {

    const temperature =
        document.getElementById(
            "temperature"
        ).value;

    const heartRate =
        document.getElementById(
            "heartRate"
        ).value;

    const respiratoryRate =
        document.getElementById(
            "respiratoryRate"
        ).value;

    const weight =
        document.getElementById(
            "weight"
        ).value;

    const crt =
        document.getElementById(
            "crt"
        ).value;

    const mucous =
        document.getElementById(
            "mucousMembrane"
        ).value;

    const hydration =
        document.getElementById(
            "hydration"
        ).value;

    const bcs =
        document.getElementById(
            "bcs"
        ).value;

    const additional =
        document.getElementById(
            "additionalFindings"
        ).value.trim();


    const lines = [];


    if (temperature) {
        lines.push(
            "Temperature: " +
            temperature +
            " °C"
        );
    }


    if (heartRate) {
        lines.push(
            "Heart Rate/Pulse: " +
            heartRate +
            " bpm"
        );
    }


    if (respiratoryRate) {
        lines.push(
            "Respiratory Rate: " +
            respiratoryRate +
            " /min"
        );
    }


    if (weight) {
        lines.push(
            "Weight: " +
            weight +
            " kg"
        );
    }


    if (crt) {
        lines.push(
            "CRT: " +
            crt +
            " sec"
        );
    }


    if (mucous) {
        lines.push(
            "Mucous Membrane: " +
            mucous
        );
    }


    if (hydration) {
        lines.push(
            "Hydration: " +
            hydration
        );
    }


    if (bcs) {
        lines.push(
            "BCS: " +
            bcs +
            "/9"
        );
    }


    if (additional) {
        lines.push(
            "Additional Findings: " +
            additional
        );
    }


    return lines.join("\n");
}


/* =========================
   NUMBER
========================= */

function getNumber(id) {

    const value =
        document.getElementById(
            id
        ).value;


    if (
        value === "" ||
        value === null
    ) {
        return null;
    }


    const number =
        Number(value);


    return Number.isFinite(number)
        ? number
        : null;
}


/* =========================
   SAVE
========================= */

document
    .getElementById("saveButton")
    .addEventListener(
        "click",
        saveRecord
    );


async function saveRecord() {

    const patientId =
        patientSelect.value;


    if (!patientId) {

        showMessage(
            "Please select a patient.",
            "error"
        );

        return;
    }


    const objective =
        buildObjective();


    const payload = {

        clinic_id:
            currentClinic.clinicId,

        patient_id:
            patientId,

        visit_date:
            document.getElementById(
                "visitDate"
            ).value ||
            null,

        visit_type:
            document.getElementById(
                "visitType"
            ).value ||
            "consultation",

        chief_complaint:
            document.getElementById(
                "chiefComplaint"
            ).value.trim() ||
            null,

        subjective:
            document.getElementById(
                "subjective"
            ).value.trim() ||
            null,

        objective:
            objective ||
            null,

        temperature:
            getNumber(
                "temperature"
            ),

        heart_rate:
            getNumber(
                "heartRate"
            ),

        respiratory_rate:
            getNumber(
                "respiratoryRate"
            ),

        weight:
            getNumber(
                "weight"
            ),

        crt:
            getNumber(
                "crt"
            ),

        mucous_membrane:
            document.getElementById(
                "mucousMembrane"
            ).value ||
            null,

        hydration:
            document.getElementById(
                "hydration"
            ).value ||
            null,

        bcs:
            getNumber(
                "bcs"
            ),

        assessment:
            document.getElementById(
                "assessment"
            ).value.trim() ||
            null,

        plan:
            document.getElementById(
                "plan"
            ).value.trim() ||
            null,

        diagnosis:
            document.getElementById(
                "diagnosis"
            ).value.trim() ||
            null,

        medication:
            document.getElementById(
                "medication"
            ).value.trim() ||
            null,

        treatment:
            document.getElementById(
                "treatment"
            ).value.trim() ||
            null,

        procedure:
            document.getElementById(
                "procedure"
            ).value.trim() ||
            null,

        follow_up_date:
            document.getElementById(
                "followUpDate"
            ).value ||
            null,

        notes:
            document.getElementById(
                "notes"
            ).value.trim() ||
            null
    };


    const saveButton =
        document.getElementById(
            "saveButton"
        );


    saveButton.disabled =
        true;

    saveButton.textContent =
        "Saving...";


    let error = null;


    /* EDIT */

    if (recordId) {

        const response =
            await supabaseClient

                .from(
                    "medical_records"
                )

                .update(
                    payload
                )

                .eq(
                    "id",
                    recordId
                )

                .eq(
                    "clinic_id",
                    currentClinic.clinicId
                );


        error =
            response.error;

    }


    /* NEW */

    else {

        const response =
            await supabaseClient

                .from(
                    "medical_records"
                )

                .insert(
                    payload
                );


        error =
            response.error;
    }


    saveButton.disabled =
        false;


    saveButton.textContent =
        recordId
            ? "Update Medical Record"
            : "Save Medical Record";


    if (error) {

        console.error(
            "SAVE ERROR:",
            error
        );

        showMessage(
            "Failed to save medical record: " +
            error.message,
            "error"
        );

        return;
    }


    showMessage(
        recordId
            ? "Medical record updated successfully."
            : "Medical record saved successfully.",
        "success"
    );


    setTimeout(
        function() {

            window.location.href =
                "medical-records.html";

        },
        800
    );
}


/* =========================
   INIT
========================= */

async function init() {

    currentClinic =
        await getCurrentClinic();


    if (!currentClinic) {

        showMessage(
            "Clinic information could not be loaded. Please refresh the page.",
            "error"
        );

        return;
    }


    await loadPatients();

    await loadRecord();
}


init();

</script>
