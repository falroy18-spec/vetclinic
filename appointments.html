<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Appointments - VetClinic</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6fb;
    color: #252d3d;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 30px;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

.header h1 {
    margin: 0;
}

.header p {
    color: #6b7280;
}

.card {
    background: white;
    border-radius: 14px;
    padding: 25px;
    margin-bottom: 25px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.06);
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
}

.full {
    grid-column: 1 / -1;
}

label {
    display: block;
    margin-bottom: 7px;
    font-weight: 600;
}

input,
select,
textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
}

textarea {
    min-height: 90px;
    resize: vertical;
}

button {
    border: none;
    border-radius: 8px;
    padding: 11px 16px;
    cursor: pointer;
    font-weight: 600;
}

.primary {
    background: #5146e5;
    color: white;
}

.danger {
    background: #dc2626;
    color: white;
}

.secondary {
    background: #e5e7eb;
    color: #374151;
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
}

.message {
    margin-top: 15px;
    font-size: 14px;
}

.error {
    color: #dc2626;
}

.success {
    color: #16a34a;
}

.appointment {
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 15px;
}

.appointment-header {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    align-items: flex-start;
}

.appointment h3 {
    margin: 0 0 6px;
}

.meta {
    color: #6b7280;
    font-size: 13px;
    line-height: 1.6;
}

.status {
    display: inline-block;
    margin-top: 10px;
    padding: 5px 10px;
    border-radius: 20px;
    background: #eef2ff;
    font-size: 12px;
    font-weight: 600;
}

.empty {
    text-align: center;
    padding: 30px;
    color: #6b7280;
}

@media(max-width:700px) {
    .container {
        padding: 15px;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .full {
        grid-column: auto;
    }

    .header {
        flex-direction: column;
        align-items: flex-start;
        gap: 15px;
    }

    .appointment-header {
        flex-direction: column;
    }
}
</style>

</head>

<body>

<div class="container">

<div class="header">

<div>
<h1>📅 Appointments</h1>
<p>VetClinic Appointment Management</p>
</div>

<button
class="secondary"
type="button"
onclick="window.location.href='index.html'">
Dashboard
</button>

</div>


<div class="card">

<h2>New Appointment</h2>

<div class="form-grid">

<div class="full">

<label>Patient</label>

<select id="patient">
<option value="">Select patient</option>
</select>

</div>


<div>

<label>Date</label>

<input
type="date"
id="appointment_date">

</div>


<div>

<label>Time</label>

<input
type="time"
id="appointment_time">

</div>


<div>

<label>Status</label>

<select id="status">

<option value="Scheduled">
Scheduled
</option>

<option value="Confirmed">
Confirmed
</option>

<option value="Completed">
Completed
</option>

<option value="Cancelled">
Cancelled
</option>

</select>

</div>


<div>

<label>Reason</label>

<input
type="text"
id="reason"
placeholder="Reason for appointment">

</div>


<div class="full">

<label>Notes</label>

<textarea
id="notes"
placeholder="Additional notes..."></textarea>

</div>

</div>


<div class="actions">

<button
class="primary"
id="saveButton"
type="button">

Save Appointment

</button>

</div>


<div
id="message"
class="message">
</div>

</div>


<div class="card">

<h2>Appointments</h2>

<div id="appointmentList">

<div class="empty">
Loading appointments...
</div>

</div>

</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://zltbjbbofvvndxirlipf.supabase.co";

const SUPABASE_KEY =
"sb_publishable_MWH4JPfiiJ2gvIqYpKE_Yw_UAoAlnFJ";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);
supabaseClient.auth.getSession().then(({ data: { session } }) => {

    if (!session) {
        window.location.href = "login.html";
        return;
    }

});

const patientSelect =
document.getElementById("patient");

const appointmentList =
document.getElementById("appointmentList");

const saveButton =
document.getElementById("saveButton");

const message =
document.getElementById("message");


document.getElementById(
    "appointment_date"
).value =
    new Date()
    .toISOString()
    .split("T")[0];


async function loadPatients() {

    const {
        data,
        error
    } =
    await supabaseClient
        .from("patients")
        .select("id, name, species")
        .order("name");


    if (error) {

        message.textContent =
            "Gagal mengambil patient: " +
            error.message;

        message.className =
            "message error";

        return;
    }


    patientSelect.innerHTML = `
        <option value="">
            Select patient
        </option>
    `;


    data.forEach(patient => {

        const option =
            document.createElement("option");

        option.value =
            patient.id;

        option.textContent =
            patient.name +
            " (" +
            patient.species +
            ")";

        patientSelect.appendChild(option);

    });

}


async function loadAppointments() {

    appointmentList.innerHTML = `
        <div class="empty">
            Loading appointments...
        </div>
    `;


    const {
        data,
        error
    } =
    await supabaseClient
        .from("appointments")
        .select(`
            *,
            patients (
                name,
                species,
                breed
            )
        `)
        .order("appointment_date", {
            ascending: true
        });


    if (error) {

        appointmentList.innerHTML = `
            <div class="empty error">
                ${error.message}
            </div>
        `;

        return;
    }


    if (!data || data.length === 0) {

        appointmentList.innerHTML = `
            <div class="empty">
                No appointments yet.
            </div>
        `;

        return;
    }


    appointmentList.innerHTML = "";


    data.forEach(appointment => {

        const patient =
            appointment.patients;


        const div =
            document.createElement("div");

        div.className =
            "appointment";


        div.innerHTML = `

            <div class="appointment-header">

                <div>

                    <h3>
                        ${escapeHtml(
                            patient?.name ||
                            "Unknown Patient"
                        )}
                    </h3>

                    <div class="meta">

                        ${escapeHtml(
                            patient?.species || ""
                        )}

                        ${patient?.breed
                            ? " • " +
                              escapeHtml(patient.breed)
                            : ""
                        }

                        <br>

                        📅
                        ${appointment.appointment_date || "-"}

                        ${
                            appointment.appointment_time
                            ? " • ⏰ " +
                              appointment.appointment_time
                            : ""
                        }

                        <br>

                        Reason:
                        ${escapeHtml(
                            appointment.reason ||
                            "-"
                        )}

                    </div>

                    <span class="status">
                        ${escapeHtml(
                            appointment.status ||
                            "Scheduled"
                        )}
                    </span>

                    ${
                        appointment.notes
                        ? `
                        <div class="meta" style="margin-top:10px">
                            Notes:
                            ${escapeHtml(
                                appointment.notes
                            )}
                        </div>
                        `
                        : ""
                    }

                </div>


                <button
                    class="danger"
                    type="button"
                    onclick="deleteAppointment(
                        '${appointment.id}'
                    )">

                    Delete

                </button>

            </div>

        `;


        appointmentList.appendChild(div);

    });

}


saveButton.addEventListener(
    "click",
    async function() {

        const patient_id =
            patientSelect.value;

        const appointment_date =
            document.getElementById(
                "appointment_date"
            ).value;

        const appointment_time =
            document.getElementById(
                "appointment_time"
            ).value;

        const status =
            document.getElementById(
                "status"
            ).value;

        const reason =
            document.getElementById(
                "reason"
            ).value.trim();

        const notes =
            document.getElementById(
                "notes"
            ).value.trim();


        if (!patient_id) {

            message.textContent =
                "Pilih patient terlebih dahulu.";

            message.className =
                "message error";

            return;
        }


        if (!appointment_date) {

            message.textContent =
                "Tanggal appointment wajib diisi.";

            message.className =
                "message error";

            return;
        }


        saveButton.disabled = true;

        message.textContent =
            "Saving appointment...";

        message.className =
            "message";


        const {
            error
        } =
        await supabaseClient
            .from("appointments")
            .insert({

                patient_id:
                    patient_id,

                appointment_date:
                    appointment_date,

                appointment_time:
                    appointment_time || null,

                reason:
                    reason || null,

                status:
                    status,

                notes:
                    notes || null

            });


        if (error) {

            console.error(error);

            message.textContent =
                "Gagal menyimpan: " +
                error.message;

            message.className =
                "message error";

            saveButton.disabled =
                false;

            return;
        }


        message.textContent =
            "Appointment berhasil disimpan!";

        message.className =
            "message success";


        patientSelect.value = "";

        document.getElementById(
            "appointment_time"
        ).value = "";

        document.getElementById(
            "reason"
        ).value = "";

        document.getElementById(
            "notes"
        ).value = "";


        saveButton.disabled =
            false;


        loadAppointments();

    }
);


async function deleteAppointment(id) {

    if (!confirm(
        "Delete this appointment?"
    )) {

        return;
    }


    const {
        error
    } =
    await supabaseClient
        .from("appointments")
        .delete()
        .eq("id", id);


    if (error) {

        alert(
            "Gagal menghapus: " +
            error.message
        );

        return;
    }


    loadAppointments();

}


function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


loadPatients();

loadAppointments();

</script>

</body>

</html>
