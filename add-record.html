<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>New Medical Record - VetClinic</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .patient-search-wrapper {
            position: relative;
        }

        #patientSearch {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            background: white;
            box-sizing: border-box;
        }

        .patient-results {
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            max-height: 220px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
        }

        .patient-result {
            padding: 11px 14px;
            cursor: pointer;
            border-bottom: 1px solid #f1f1f1;
        }

        .patient-result:last-child {
            border-bottom: none;
        }

        .patient-result:hover {
            background: #f4f6fb;
        }

        .patient-result strong {
            display: block;
            color: #252d3d;
        }

        .patient-result small {
            color: #6b7280;
        }

        .selected-patient {
            margin-top: 8px;
            padding: 10px 12px;
            background: #eef2ff;
            border-radius: 7px;
            color: #374151;
            font-size: 14px;
            display: none;
        }

        .visit-type-box {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .visit-option {
            border: 1px solid #d1d5db;
            border-radius: 9px;
            padding: 14px;
            cursor: pointer;
            background: white;
            transition: 0.2s;
        }

        .visit-option:hover {
            border-color: #6366f1;
        }

        .visit-option.selected {
            border-color: #6366f1;
            background: #eef2ff;
        }

        .visit-option input {
            margin-right: 8px;
        }

        .visit-option strong {
            display: block;
            margin-bottom: 4px;
        }

        .visit-option small {
            color: #6b7280;
        }

        .status-message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 7px;
            display: none;
        }

        .status-success {
            background: #dcfce7;
            color: #166534;
        }

        .status-error {
            background: #fee2e2;
            color: #991b1b;
        }

        .status-loading {
            background: #f3f4f6;
            color: #374151;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .grooming-note {
            margin-top: 8px;
            padding: 10px 12px;
            background: #f9fafb;
            border-radius: 7px;
            color: #6b7280;
            font-size: 13px;
        }

        @media (max-width: 700px) {
            .visit-type-box {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <h1>🐾 VetClinic</h1>

        <nav>

            <a href="index.html">
                Dashboard
            </a>

            <a href="patients.html">
                Patients
            </a>

            <a href="appointments.html">
                Appointments
            </a>

            <a href="medical-records.html" class="active">
                Medical Records
            </a>

            <a href="medicines.html">
                Medicines
            </a>

            <a href="billing.html">
                Billing
            </a>

            <a href="reports.html">
                Reports
            </a>

            <a href="backup.html">
                Backup & Restore
            </a>

        </nav>

    </aside>


    <!-- MAIN -->
    <main class="main-content">

        <header>

            <div>

                <h2>
                    New Medical Record
                </h2>

                <p>
                    Create a clinical record for a patient.
                </p>

            </div>

            <a
                href="medical-records.html"
                class="add-button"
            >
                ← Back
            </a>

        </header>


        <section class="appointments">

            <form id="recordForm">

                <!-- =========================================
                     PATIENT
                ========================================== -->

                <div class="form-group">

                    <label>
                        Patient *
                    </label>

                    <div class="patient-search-wrapper">

                        <input
                            type="text"
                            id="patientSearch"
                            placeholder="Search patient name..."
                            autocomplete="off"
                            required
                        >

                        <div
                            id="patientResults"
                            class="patient-results">
                        </div>

                    </div>


                    <div
                        id="selectedPatient"
                        class="selected-patient">
                    </div>


                    <!-- IMPORTANT:
                         This stores the actual UUID
                         of the selected patient.
                    -->

                    <input
                        type="hidden"
                        id="patientId"
                    >

                </div>


                <!-- =========================================
                     VISIT DATE
                ========================================== -->

                <div class="form-group">

                    <label>
                        Visit Date *
                    </label>

                    <input
                        type="date"
                        id="visitDate"
                        required
                    >

                </div>


                <!-- =========================================
                     VISIT TYPE
                ========================================== -->

                <div class="form-group">

                    <label>
                        Visit Type *
                    </label>


                    <div class="visit-type-box">

                        <label
                            class="visit-option selected"
                            id="consultationOption"
                        >

                            <input
                                type="radio"
                                name="visitType"
                                value="consultation"
                                checked
                            >

                            <strong>
                                Consultation
                            </strong>

                            <small>
                                Patient comes because of a complaint,
                                illness, or clinical concern.
                            </small>

                        </label>


                        <label
                            class="visit-option"
                            id="groomingOption"
                        >

                            <input
                                type="radio"
                                name="visitType"
                                value="grooming"
                            >

                            <strong>
                                Grooming
                            </strong>

                            <small>
                                Pre-grooming health check.
                            </small>

                        </label>

                    </div>


                    <div class="grooming-note">

                        For grooming, record the basic health
                        examination before the grooming procedure.

                    </div>

                </div>


                <hr>


                <!-- =========================================
                     CONSULTATION / HEALTH CHECK
                ========================================== -->

                <h3 class="section-title">
                    Clinical Examination
                </h3>


                <!-- CHIEF COMPLAINT -->

                <div class="form-group">

                    <label>
                        Chief Complaint / Reason for Visit
                    </label>

                    <textarea
                        id="chiefComplaint"
                        placeholder="Main reason for consultation or grooming..."
                    ></textarea>

                </div>


                <!-- SUBJECTIVE -->

                <div class="form-group">

                    <label>
                        Subjective
                    </label>

                    <textarea
                        id="subjective"
                        placeholder="Owner complaints, history, appetite, drinking, vomiting, diarrhea, duration, etc."
                    ></textarea>

                </div>


                <!-- OBJECTIVE -->

                <div class="form-group">

                    <label>
                        Objective / Physical Examination
                    </label>

                    <textarea
                        id="objective"
                        placeholder="Physical examination findings, general condition, hydration, mucous membrane, skin, eyes, ears, etc."
                    ></textarea>

                </div>


                <!-- ASSESSMENT -->

                <div class="form-group">

                    <label>
                        Assessment
                    </label>

                    <textarea
                        id="assessment"
                        placeholder="Clinical assessment / pre-grooming health assessment..."
                    ></textarea>

                </div>


                <!-- DIAGNOSIS -->

                <div class="form-group">

                    <label>
                        Diagnosis
                    </label>

                    <textarea
                        id="diagnosis"
                        placeholder="Diagnosis or clinical impression..."
                    ></textarea>

                </div>


                <!-- PLAN -->

                <div class="form-group">

                    <label>
                        Plan
                    </label>

                    <textarea
                        id="plan"
                        placeholder="Diagnostic plan, treatment plan, monitoring, or grooming recommendation..."
                    ></textarea>

                </div>


                <!-- TREATMENT -->

                <div class="form-group">

                    <label>
                        Treatment
                    </label>

                    <textarea
                        id="treatment"
                        placeholder="Treatment performed during consultation or health check..."
                    ></textarea>

                </div>


                <!-- MEDICATION -->

                <div class="form-group">

                    <label>
                        Prescription / Medication
                    </label>

                    <textarea
                        id="medication"
                        placeholder="Drug name, dose, route, frequency and duration..."
                    ></textarea>

                </div>


                <!-- PROCEDURE -->

                <div class="form-group">

                    <label>
                        Procedure
                    </label>

                    <textarea
                        id="procedure"
                        placeholder="Procedure performed, including grooming if applicable..."
                    ></textarea>

                </div>


                <!-- NOTES -->

                <div class="form-group">

                    <label>
                        Additional Notes
                    </label>

                    <textarea
                        id="notes"
                        placeholder="Other important clinical notes..."
                    ></textarea>

                </div>


                <!-- FOLLOW UP -->

                <div class="form-group">

                    <label>
                        Follow-up Date
                    </label>

                    <input
                        type="date"
                        id="followUpDate"
                    >

                </div>


                <!-- STATUS -->

                <div
                    id="statusMessage"
                    class="status-message">
                </div>


                <!-- BUTTONS -->

                <div class="form-actions">

                    <button
                        type="button"
                        id="cancelButton"
                        class="cancel-button"
                    >
                        Cancel
                    </button>


                    <button
                        type="submit"
                        id="saveButton"
                    >
                        Save Medical Record
                    </button>

                </div>

            </form>

        </section>

    </main>

</div>


<!-- =========================================
     SUPABASE
========================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =====================================================
   SUPABASE CONFIG
===================================================== */

const SUPABASE_URL =
    "https://zltbjbbofvvndxirlipf.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_MWH4JPfiiJ2gvIqYpKE_Yw_UAoAlnFJ";


const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        {
            auth: {
                persistSession: true,
                autoRefreshToken: true,
                detectSessionInUrl: true,
                storage: window.localStorage
            }
        }
    );


/* =====================================================
   VARIABLES
===================================================== */

let currentSession = null;

let currentClinic = null;

let patients = [];


/* =====================================================
   ELEMENTS
===================================================== */

const patientSearch =
    document.getElementById(
        "patientSearch"
    );


const patientResults =
    document.getElementById(
        "patientResults"
    );


const patientIdInput =
    document.getElementById(
        "patientId"
    );


const selectedPatient =
    document.getElementById(
        "selectedPatient"
    );


const recordForm =
    document.getElementById(
        "recordForm"
    );


const statusMessage =
    document.getElementById(
        "statusMessage"
    );


const saveButton =
    document.getElementById(
        "saveButton"
    );


/* =====================================================
   STATUS MESSAGE
===================================================== */

function showStatus(
    message,
    type = "loading"
) {

    statusMessage.textContent =
        message;

    statusMessage.className =
        "status-message status-" +
        type;

    statusMessage.style.display =
        "block";

}


/* =====================================================
   GET CURRENT CLINIC
===================================================== */

async function getCurrentClinic() {

    console.log(
        "Checking Supabase session..."
    );


    const {
        data,
        error
    } =
        await supabaseClient
            .auth
            .getSession();


    if (error) {

        console.error(
            "Session error:",
            error
        );

        return null;

    }


    if (!data?.session) {

        window.location.href =
            "login.html";

        return null;

    }


    currentSession =
        data.session;


    console.log(
        "Logged in user:",
        currentSession.user.id
    );


    const {
        data: membership,
        error: membershipError
    } =
        await supabaseClient
            .from("clinic_members")
            .select(`
                clinic_id,
                role,
                clinics (
                    id,
                    name
                )
            `)
            .eq(
                "user_id",
                currentSession.user.id
            )
            .maybeSingle();


    if (membershipError) {

        console.error(
            "Clinic lookup error:",
            membershipError
        );

        showStatus(
            "Failed to load clinic: " +
            membershipError.message,
            "error"
        );

        return null;

    }


    if (
        !membership ||
        !membership.clinics
    ) {

        showStatus(
            "Your account is not connected to a clinic.",
            "error"
        );

        return null;

    }


    currentClinic = {

        userId:
            currentSession.user.id,

        clinicId:
            membership.clinic_id,

        clinicName:
            membership.clinics.name,

        role:
            membership.role

    };


    console.log(
        "Current clinic:",
        currentClinic
    );


    return currentClinic;

}


/* =====================================================
   LOAD PATIENTS
===================================================== */

async function loadPatients() {

    if (!currentClinic) {

        return;

    }


    console.log(
        "Loading patients for clinic:",
        currentClinic.clinicId
    );


    const {
        data,
        error
    } =
        await supabaseClient
            .from("patients")
            .select("*")
            .eq(
                "clinic_id",
                currentClinic.clinicId
            )
            .order(
                "name",
                {
                    ascending: true
                }
            );


    if (error) {

        console.error(
            "Patient loading error:",
            error
        );

        showStatus(
            "Unable to load patients: " +
            error.message,
            "error"
        );

        return;

    }


    patients =
        data || [];


    console.log(
        "Patients loaded:",
        patients
    );


    /*
     * If this page is opened from
     * patients.html using:
     *
     * add-record.html?patientId=XXXX
     *
     * automatically select that patient.
     */

    const params =
        new URLSearchParams(
            window.location.search
        );


    const urlPatientId =
        params.get(
            "patientId"
        );


    if (urlPatientId) {

        const patient =
            patients.find(
                item =>
                    String(item.id) ===
                    String(urlPatientId)
            );


        if (patient) {

            selectPatient(
                patient
            );

        }

    }

}


/* =====================================================
   PATIENT HELPERS
===================================================== */

function getPatientName(
    patient
) {

    return (
        patient.name ||
        patient.pet_name ||
        patient.patient_name ||
        "Unnamed Patient"
    );

}


function getPatientSpecies(
    patient
) {

    return (
        patient.species ||
        "-"
    );

}


function getPatientBreed(
    patient
) {

    return (
        patient.breed ||
        ""
    );

}


function getPatientOwner(
    patient
) {

    return (
        patient.owner_name ||
        patient.owner ||
        patient.client_name ||
        "-"
    );

}


/* =====================================================
   SEARCH PATIENT
===================================================== */

patientSearch.addEventListener(
    "input",
    function() {

        const keyword =
            patientSearch.value
                .trim()
                .toLowerCase();


        patientResults.innerHTML =
            "";


        if (!keyword) {

            patientResults.style.display =
                "none";

            return;

        }


        const filtered =
            patients.filter(
                patient => {

                    const name =
                        String(
                            getPatientName(
                                patient
                            )
                        ).toLowerCase();


                    const species =
                        String(
                            getPatientSpecies(
                                patient
                            )
                        ).toLowerCase();


                    const breed =
                        String(
                            getPatientBreed(
                                patient
                            )
                        ).toLowerCase();


                    const owner =
                        String(
                            getPatientOwner(
                                patient
                            )
                        ).toLowerCase();


                    return (
                        name.includes(keyword) ||
                        species.includes(keyword) ||
                        breed.includes(keyword) ||
                        owner.includes(keyword)
                    );

                }
            );


        if (!filtered.length) {

            const empty =
                document.createElement(
                    "div"
                );


            empty.className =
                "patient-result";


            empty.textContent =
                "No patient found.";


            patientResults.appendChild(
                empty
            );


            patientResults.style.display =
                "block";

            return;

        }


        filtered.forEach(
            patient => {

                const item =
                    document.createElement(
                        "div"
                    );


                item.className =
                    "patient-result";


                const name =
                    getPatientName(
                        patient
                    );


                const species =
                    getPatientSpecies(
                        patient
                    );


                const breed =
                    getPatientBreed(
                        patient
                    );


                const owner =
                    getPatientOwner(
                        patient
                    );


                item.innerHTML = `

                    <strong>
                        ${escapeHtml(name)}
                    </strong>

                    <small>
                        ${escapeHtml(species)}

                        ${
                            breed
                                ? " • " +
                                  escapeHtml(breed)
                                : ""
                        }

                        • Owner:
                        ${escapeHtml(owner)}

                    </small>

                `;


                item.addEventListener(
                    "click",
                    function() {

                        selectPatient(
                            patient
                        );

                    }
                );


                patientResults.appendChild(
                    item
                );

            }
        );


        patientResults.style.display =
            "block";

    }
);


/* =====================================================
   SELECT PATIENT
===================================================== */

function selectPatient(
    patient
) {

    /*
     * VERY IMPORTANT:
     * Save the actual UUID here.
     *
     * This is what will be inserted
     * into medical_records.patient_id.
     */

    patientIdInput.value =
        patient.id;


    patientSearch.value =
        getPatientName(
            patient
        );


    selectedPatient.innerHTML = `

        <strong>
            Selected:
        </strong>

        ${escapeHtml(
            getPatientName(patient)
        )}

        •

        ${escapeHtml(
            getPatientSpecies(patient)
        )}

        ${
            getPatientBreed(patient)
                ? " • " +
                  escapeHtml(
                      getPatientBreed(patient)
                  )
                : ""
        }

        • Owner:

        ${escapeHtml(
            getPatientOwner(patient)
        )}

    `;


    selectedPatient.style.display =
        "block";


    patientResults.style.display =
        "none";


    console.log(
        "Selected patient ID:",
        patient.id
    );

}


/* =====================================================
   CLICK OUTSIDE SEARCH
===================================================== */

document.addEventListener(
    "click",
    function(event) {

        if (
            !event.target.closest(
                ".patient-search-wrapper"
            )
        ) {

            patientResults.style.display =
                "none";

        }

    }
);


/* =====================================================
   VISIT TYPE UI
===================================================== */

const consultationOption =
    document.getElementById(
        "consultationOption"
    );


const groomingOption =
    document.getElementById(
        "groomingOption"
    );


const visitTypeInputs =
    document.querySelectorAll(
        'input[name="visitType"]'
    );


visitTypeInputs.forEach(
    input => {

        input.addEventListener(
            "change",
            function() {

                consultationOption.classList.remove(
                    "selected"
                );

                groomingOption.classList.remove(
                    "selected"
                );


                if (
                    this.value ===
                    "consultation"
                ) {

                    consultationOption.classList.add(
                        "selected"
                    );

                }


                if (
                    this.value ===
                    "grooming"
                ) {

                    groomingOption.classList.add(
                        "selected"
                    );

                }

            }
        );

    }
);


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(
    value
) {

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =====================================================
   GET FORM VALUE
===================================================== */

function valueOf(
    id
) {

    const element =
        document.getElementById(
            id
        );


    if (!element) {

        return null;

    }


    const value =
        element.value.trim();


    return value === ""
        ? null
        : value;

}


/* =====================================================
   SAVE MEDICAL RECORD
===================================================== */

recordForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        /* CHECK CLINIC */

        if (!currentClinic) {

            showStatus(
                "Clinic information is not available.",
                "error"
            );

            return;

        }


        /* CHECK PATIENT */

        if (!patientIdInput.value) {

            showStatus(
                "Please select a patient first.",
                "error"
            );

            patientSearch.focus();

            return;

        }


        /* CHECK VISIT DATE */

        const visitDate =
            document.getElementById(
                "visitDate"
            ).value;


        if (!visitDate) {

            showStatus(
                "Please select visit date.",
                "error"
            );

            return;

        }


        /* GET VISIT TYPE */

        const selectedVisitType =
            document.querySelector(
                'input[name="visitType"]:checked'
            );


        if (!selectedVisitType) {

            showStatus(
                "Please select visit type.",
                "error"
            );

            return;

        }


        const visitType =
            selectedVisitType.value;


        saveButton.disabled =
            true;


        saveButton.textContent =
            "Saving...";


        showStatus(
            "Saving medical record...",
            "loading"
        );


        try {

            /*
             * IMPORTANT DATABASE RELATION:
             *
             * clinic_id  -> current clinic
             * patient_id -> selected patient UUID
             *
             * This keeps the record connected
             * to the actual patient.
             */

            const recordData = {

                clinic_id:
                    currentClinic.clinicId,

                patient_id:
                    patientIdInput.value,

                visit_date:
                    visitDate,

                visit_type:
                    visitType,

                chief_complaint:
                    valueOf(
                        "chiefComplaint"
                    ),

                subjective:
                    valueOf(
                        "subjective"
                    ),

                objective:
                    valueOf(
                        "objective"
                    ),

                assessment:
                    valueOf(
                        "assessment"
                    ),

                plan:
                    valueOf(
                        "plan"
                    ),

                diagnosis:
                    valueOf(
                        "diagnosis"
                    ),

                treatment:
                    valueOf(
                        "treatment"
                    ),

                medication:
                    valueOf(
                        "medication"
                    ),

                procedure:
                    valueOf(
                        "procedure"
                    ),

                notes:
                    valueOf(
                        "notes"
                    ),

                follow_up_date:
                    valueOf(
                        "followUpDate"
                    )

            };


            console.log(
                "Saving record:",
                recordData
            );


            const {
                data,
                error
            } =
                await supabaseClient
                    .from(
                        "medical_records"
                    )
                    .insert(
                        recordData
                    )
                    .select()
                    .single();


            if (error) {

                console.error(
                    "Medical record error:",
                    error
                );

                throw error;

            }


            console.log(
                "Medical record saved:",
                data
            );


            showStatus(
                "Medical record saved successfully.",
                "success"
            );


            setTimeout(
                function() {

                    window.location.href =
                        "medical-records.html";

                },
                800
            );

        }

        catch (error) {

            console.error(
                "SAVE ERROR:",
                error
            );


            showStatus(
                "Failed to save medical record: " +
                error.message,
                "error"
            );


            saveButton.disabled =
                false;


            saveButton.textContent =
                "Save Medical Record";

        }

    }
);


/* =====================================================
   CANCEL
===================================================== */

document.getElementById(
    "cancelButton"
).addEventListener(
    "click",
    function() {

        window.location.href =
            "medical-records.html";

    }
);


/* =====================================================
   DEFAULT DATE
===================================================== */

document.getElementById(
    "visitDate"
).value =
    new Date()
        .toISOString()
        .split("T")[0];


/* =====================================================
   INITIALIZE
===================================================== */

async function initialize() {

    try {

        const clinic =
            await getCurrentClinic();


        if (!clinic) {

            return;

        }


        await loadPatients();

    }

    catch (error) {

        console.error(
            "Initialization error:",
            error
        );


        showStatus(
            "Initialization failed: " +
            error.message,
            "error"
        );

    }

}


initialize();

</script>
