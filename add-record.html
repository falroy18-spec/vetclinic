<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>New Medical Record - VetClinic</title>

<link rel="stylesheet"
href="style.css">

</head>


<body>

<div class="app">


<aside class="sidebar">

<h1>🐾 VetClinic</h1>

<nav>

<a href="index.html">
Dashboard
</a>

<a href="patients.html">
Patients
</a>

<a href="appointments.html">
Appointments
</a>

<a href="medical-records.html"
class="active">
Medical Records
</a>

<a href="medicines.html">
Medicines
</a>

<a href="billing.html">
Billing
</a>

<a href="reports.html">
Reports
</a>

<a href="backup.html">
Backup & Restore
</a>

</nav>

</aside>


<main class="main-content">


<header>

<div>

<h2 id="pageTitle">
New Medical Record
</h2>

<p>
Create a clinical record for a patient.
</p>

</div>


<a
href="medical-records.html"
class="add-button"
>
← Back
</a>

</header>


<section class="appointments">


<form id="recordForm">


<div class="form-group">

<label>
Patient *
</label>

<select
id="patientId"
required
>

<option value="">
Loading patients...
</option>

</select>

</div>


<div class="form-group">

<label>
Visit Date *
</label>

<input
type="date"
id="visitDate"
required
>

</div>


<hr>


<h3>
SOAP Clinical Record
</h3>


<div class="form-group">

<label>
Subjective
</label>

<textarea
id="subjective"
placeholder="Owner complaints, history, appetite, drinking, vomiting, diarrhea, etc."
></textarea>

</div>


<div class="form-group">

<label>
Objective
</label>

<textarea
id="objective"
placeholder="Physical examination, temperature, HR, RR, CRT, mucous membrane, body weight, etc."
></textarea>

</div>


<div class="form-group">

<label>
Assessment / Diagnosis
</label>

<textarea
id="assessment"
placeholder="Clinical assessment and diagnosis"
></textarea>

</div>


<div class="form-group">

<label>
Plan / Treatment
</label>

<textarea
id="plan"
placeholder="Treatment, medication, procedure, monitoring and follow-up"
></textarea>

</div>


<hr>


<h3>
Additional Information
</h3>


<div class="form-group">

<label>
Prescription / Medication
</label>

<textarea
id="medication"
placeholder="Drug name, dose, route and frequency"
></textarea>

</div>


<div class="form-group">

<label>
Procedure
</label>

<textarea
id="procedure"
placeholder="Procedure performed, if any"
></textarea>

</div>


<div class="form-group">

<label>
Follow-up
</label>

<textarea
id="followUp"
placeholder="Next visit or monitoring instructions"
></textarea>

</div>


<div class="form-actions">

<button
type="button"
id="cancelButton"
class="cancel-button"
>
Cancel
</button>


<button
type="submit"
id="saveButton"
>
Save Medical Record
</button>

</div>


</form>

</section>

</main>

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


/* =====================================================
   SUPABASE CONFIG
===================================================== */

const SUPABASE_URL =
"https://zltbjbbofvvndxirlipf.supabase.co";


const SUPABASE_KEY =
"HIDDEN";


const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
        auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true,
            storage: window.localStorage
        }
    }
);


/* =====================================================
   ELEMENTS
===================================================== */

const patientSelect =
document.getElementById(
    "patientId"
);

const visitDate =
document.getElementById(
    "visitDate"
);

const subjective =
document.getElementById(
    "subjective"
);

const objective =
document.getElementById(
    "objective"
);

const assessment =
document.getElementById(
    "assessment"
);

const plan =
document.getElementById(
    "plan"
);

const medication =
document.getElementById(
    "medication"
);

const procedureField =
document.getElementById(
    "procedure"
);

const followUp =
document.getElementById(
    "followUp"
);

const recordForm =
document.getElementById(
    "recordForm"
);

const saveButton =
document.getElementById(
    "saveButton"
);


/* =====================================================
   URL PARAMETERS
===================================================== */

const params =
new URLSearchParams(
    window.location.search
);

const editId =
params.get("editId");

const selectedPatientId =
params.get("patientId");


let currentUser = null;
let currentClinic = null;
let editingRecord = null;


/* =====================================================
   GET CURRENT USER + CLINIC
===================================================== */

async function getCurrentClinic() {

    console.log(
        "Checking Supabase session..."
    );


    const {
        data,
        error
    } =
    await supabaseClient
        .auth
        .getSession();


    console.log(
        "Supabase session:",
        data?.session
    );


    if (error) {

        console.error(
            "Session error:",
            error
        );

        return null;
    }


    if (!data?.session) {

        console.error(
            "NO ACTIVE SUPABASE SESSION"
        );

        alert(
            "Your session has expired. Please login again."
        );

        window.location.href =
            "login.html";

        return null;
    }


    currentUser =
        data.session.user;


    console.log(
        "Logged in user:",
        currentUser.id
    );


    const {
        data: membership,
        error: membershipError
    } =
    await supabaseClient
        .from("clinic_members")
        .select(`
            clinic_id,
            role,
            clinics (
                id,
                name
            )
        `)
        .eq(
            "user_id",
            currentUser.id
        )
        .maybeSingle();


    if (membershipError) {

        console.error(
            "Clinic lookup error:",
            membershipError
        );

        alert(
            "Unable to load clinic information."
        );

        return null;
    }


    if (
        !membership ||
        !membership.clinics
    ) {

        console.error(
            "User belum terhubung ke clinic."
        );

        alert(
            "Your account is not connected to a clinic."
        );

        return null;
    }


    currentClinic = {

        clinicId:
            membership.clinic_id,

        clinicName:
            membership.clinics.name,

        role:
            membership.role

    };


    console.log(
        "Current clinic:",
        currentClinic
    );


    return currentClinic;

}


/* =====================================================
   LOAD PATIENTS FROM SUPABASE
===================================================== */

async function loadPatients() {

    console.log(
        "Loading patients..."
    );


    patientSelect.innerHTML = "";

    const loadingOption =
        document.createElement(
            "option"
        );

    loadingOption.value = "";

    loadingOption.textContent =
        "Loading patients...";

    patientSelect.appendChild(
        loadingOption
    );


    const {
        data,
        error
    } =
    await supabaseClient
        .from("patients")
        .select("*")
        .eq(
            "clinic_id",
            currentClinic.clinicId
        )
        .order(
            "name",
            {
                ascending: true
            }
        );


    if (error) {

        console.error(
            "Patients loading error:",
            error
        );

        patientSelect.innerHTML = "";

        const errorOption =
            document.createElement(
                "option"
            );

        errorOption.value = "";

        errorOption.textContent =
            "Unable to load patients";

        patientSelect.appendChild(
            errorOption
        );

        return false;
    }


    console.log(
        "Patients loaded:",
        data
    );


    patientSelect.innerHTML = "";


    const defaultOption =
        document.createElement(
            "option"
        );

    defaultOption.value = "";

    defaultOption.textContent =
        data.length
        ? "Select patient"
        : "No patients found";


    patientSelect.appendChild(
        defaultOption
    );


    data.forEach(
        patient => {

            const option =
            document.createElement(
                "option"
            );


            option.value =
                patient.id;


            const name =
                patient.name ||
                "Unnamed";


            const species =
                patient.species ||
                "-";


            const breed =
                patient.breed ||
                "";


            option.textContent =
                breed
                ? `${name} • ${species} • ${breed}`
                : `${name} • ${species}`;


            patientSelect.appendChild(
                option
            );

        }
    );


    /*
     * Kalau halaman dibuka dari patient detail
     * dengan ?patientId=...
     */

    if (
        selectedPatientId &&
        !editId
    ) {

        patientSelect.value =
            selectedPatientId;

    }


    return true;

}


/* =====================================================
   LOAD EXISTING RECORD FOR EDIT
===================================================== */

async function loadExistingRecord() {

    if (!editId) {

        return;

    }


    console.log(
        "Loading medical record:",
        editId
    );


    const {
        data,
        error
    } =
    await supabaseClient
        .from("medical_records")
        .select("*")
        .eq(
            "id",
            editId
        )
        .eq(
            "clinic_id",
            currentClinic.clinicId
        )
        .maybeSingle();


    if (error) {

        console.error(
            "Medical record loading error:",
            error
        );

        alert(
            "Unable to load medical record."
        );

        return;

    }


    if (!data) {

        alert(
            "Medical record not found."
        );

        return;

    }


    editingRecord =
        data;


    document.getElementById(
        "pageTitle"
    ).textContent =
        "Edit Medical Record";


    patientSelect.value =
        data.patient_id || "";


    visitDate.value =
        data.visit_date || "";


    subjective.value =
        data.subjective || "";


    objective.value =
        data.objective || "";


    assessment.value =
        data.assessment || "";


    plan.value =
        data.plan || "";


    medication.value =
        data.medication || "";


    procedureField.value =
        data.procedure || "";


    followUp.value =
        data.follow_up || "";


    console.log(
        "Medical record loaded:",
        data
    );

}


/* =====================================================
   DEFAULT DATE
===================================================== */

function setDefaultDate() {

    if (
        !visitDate.value
    ) {

        visitDate.value =
            new Date()
            .toISOString()
            .split("T")[0];

    }

}


/* =====================================================
   SAVE MEDICAL RECORD
===================================================== */

recordForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        if (!currentClinic) {

            alert(
                "Clinic information is not available."
            );

            return;

        }


        if (!patientSelect.value) {

            alert(
                "Please select a patient."
            );

            patientSelect.focus();

            return;

        }


        saveButton.disabled =
            true;

        saveButton.textContent =
            "Saving...";


        const recordData = {

            clinic_id:
                currentClinic.clinicId,

            patient_id:
                patientSelect.value,

            visit_date:
                visitDate.value,

            subjective:
                subjective.value.trim(),

            objective:
                objective.value.trim(),

            assessment:
                assessment.value.trim(),

            plan:
                plan.value.trim(),

            medication:
                medication.value.trim(),

            procedure:
                procedureField.value.trim(),

            follow_up:
                followUp.value.trim()

        };


        console.log(
            "Saving medical record:",
            recordData
        );


        try {

            if (editingRecord) {

                const {
                    data,
                    error
                } =
                await supabaseClient
                    .from("medical_records")
                    .update(
                        recordData
                    )
                    .eq(
                        "id",
                        editingRecord.id
                    )
                    .eq(
                        "clinic_id",
                        currentClinic.clinicId
                    )
                    .select()
                    .single();


                if (error) {

                    throw error;

                }


                console.log(
                    "Medical record updated:",
                    data
                );


                alert(
                    "Medical record updated successfully."
                );

            }

            else {

                const {
                    data,
                    error
                } =
                await supabaseClient
                    .from("medical_records")
                    .insert(
                        recordData
                    )
                    .select()
                    .single();


                if (error) {

                    throw error;

                }


                console.log(
                    "Medical record created:",
                    data
                );


                alert(
                    "Medical record saved successfully."
                );

            }


            window.location.href =
                "medical-records.html";

        }

        catch (error) {

            console.error(
                "SAVE MEDICAL RECORD ERROR:",
                error
            );


            alert(
                "Failed to save medical record:\n\n" +
                error.message
            );


            saveButton.disabled =
                false;

            saveButton.textContent =
                "Save Medical Record";

        }

    }
);


/* =====================================================
   CANCEL
===================================================== */

document.getElementById(
    "cancelButton"
).addEventListener(
    "click",
    function() {

        window.location.href =
            "medical-records.html";

    }
);


/* =====================================================
   INITIALIZE
===================================================== */

async function init() {

    console.log(
        "Add Medical Record: starting..."
    );


    const clinic =
        await getCurrentClinic();


    if (!clinic) {

        return;

    }


    const patientsLoaded =
        await loadPatients();


    if (!patientsLoaded) {

        return;

    }


    setDefaultDate();


    await loadExistingRecord();

}


init();

</script>

</body>

</html>
