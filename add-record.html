<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>New Medical Record - VetClinic</title>

<link rel="stylesheet" href="style.css">

<style>

.form-group {
    margin-bottom: 18px;
}

.form-group label {
    display: block;
    margin-bottom: 7px;
    font-weight: 600;
    color: #374151;
}

.form-group input,
.form-group textarea,
.form-group select {
    width: 100%;
    padding: 12px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 14px;
    font-family: Arial, sans-serif;
    background: white;
}

.form-group textarea {
    min-height: 110px;
    resize: vertical;
}

.patient-search-wrapper {
    position: relative;
}

.patient-search {
    width: 100%;
}

.patient-results {
    position: absolute;
    left: 0;
    right: 0;
    top: calc(100% + 4px);
    background: white;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    max-height: 240px;
    overflow-y: auto;
    display: none;
    z-index: 999;
    box-shadow: 0 8px 20px rgba(0,0,0,0.08);
}

.patient-result {
    padding: 12px 14px;
    cursor: pointer;
    border-bottom: 1px solid #f0f0f0;
}

.patient-result:hover {
    background: #f4f6fb;
}

.patient-result strong {
    display: block;
    color: #252d3d;
}

.patient-result span {
    display: block;
    margin-top: 4px;
    font-size: 13px;
    color: #6b7280;
}

.selected-patient {
    display: none;
    margin-top: 8px;
    padding: 10px 12px;
    background: #f4f6fb;
    border-radius: 8px;
    font-size: 14px;
    color: #374151;
}

.vitals-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    margin-bottom: 16px;
}

.vital-item label {
    font-size: 14px;
}

.form-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 25px;
}

.message {
    margin-top: 15px;
    text-align: center;
    font-size: 14px;
}

@media (max-width: 800px) {

    .vitals-grid {
        grid-template-columns: 1fr 1fr;
    }

}

@media (max-width: 550px) {

    .vitals-grid {
        grid-template-columns: 1fr;
    }

}

</style>

</head>


<body>

<div class="app">


<!-- ================================
     SIDEBAR
================================ -->

<aside class="sidebar">

<h1>🐾 VetClinic</h1>

<nav>

<a href="index.html">
Dashboard
</a>

<a href="patients.html">
Patients
</a>

<a href="appointments.html">
Appointments
</a>

<a href="medical-records.html"
class="active">
Medical Records
</a>

<a href="medicines.html">
Medicines
</a>

<a href="billing.html">
Billing
</a>

<a href="reports.html">
Reports
</a>

<a href="backup.html">
Backup & Restore
</a>

</nav>

</aside>


<!-- ================================
     MAIN
================================ -->

<main class="main-content">


<header>

<div>

<h2 id="pageTitle">
New Medical Record
</h2>

<p>
Create a clinical record for a patient.
</p>

</div>


<a
href="medical-records.html"
class="add-button"
>
← Back
</a>

</header>


<section class="appointments">


<form id="recordForm">


<!-- ================================
     PATIENT
================================ -->

<h3>
Patient Information
</h3>


<div class="form-group">

<label>
Patient *
</label>


<div class="patient-search-wrapper">

<input
type="text"
id="patientSearch"
class="patient-search"
placeholder="Search patient or owner..."
autocomplete="off"
>


<div
id="patientResults"
class="patient-results">
</div>

</div>


<div
id="selectedPatient"
class="selected-patient">
</div>


<input
type="hidden"
id="patientId"
>

</div>


<!-- ================================
     VISIT DATE
================================ -->

<div class="form-group">

<label>
Visit Date *
</label>

<input
type="date"
id="visitDate"
required
>

</div>


<hr>


<!-- ================================
     SOAP
================================ -->

<h3>
SOAP Clinical Record
</h3>


<!-- CHIEF COMPLAINT -->

<div class="form-group">

<label>
Chief Complaint
</label>

<textarea
id="chiefComplaint"
placeholder="Main complaint / reason for visit..."
></textarea>

</div>


<!-- SUBJECTIVE -->

<div class="form-group">

<label>
Subjective
</label>

<textarea
id="subjective"
placeholder="History, appetite, drinking, vomiting, diarrhea, urination, defecation, duration of signs, previous treatment, etc."
></textarea>

</div>


<!-- OBJECTIVE -->

<div class="form-group">

<label>
Objective
</label>


<div class="vitals-grid">


<div class="vital-item">

<label>
Temperature (°C)
</label>

<input
type="number"
step="0.1"
id="temperature"
placeholder="38.5"
>

</div>


<div class="vital-item">

<label>
Heart Rate (bpm)
</label>

<input
type="number"
id="heartRate"
placeholder="120"
>

</div>


<div class="vital-item">

<label>
Respiratory Rate (/min)
</label>

<input
type="number"
id="respiratoryRate"
placeholder="30"
>

</div>


<div class="vital-item">

<label>
CRT
</label>

<input
type="text"
id="crt"
placeholder="< 2 sec"
>

</div>


<div class="vital-item">

<label>
Mucous Membrane
</label>

<input
type="text"
id="mucousMembrane"
placeholder="Pink"
>

</div>


<div class="vital-item">

<label>
Body Weight (kg)
</label>

<input
type="number"
step="0.01"
id="bodyWeight"
placeholder="4.50"
>

</div>


</div>


<textarea
id="physicalExam"
placeholder="Other physical examination findings: hydration, lymph nodes, skin, eyes, ears, oral cavity, thorax, abdomen, musculoskeletal, etc."
></textarea>

</div>


<!-- ASSESSMENT -->

<div class="form-group">

<label>
Assessment / Diagnosis
</label>

<textarea
id="assessment"
placeholder="Clinical assessment, differential diagnosis, final diagnosis..."
></textarea>

</div>


<!-- PLAN -->

<div class="form-group">

<label>
Plan / Treatment
</label>

<textarea
id="plan"
placeholder="Treatment plan, diagnostic plan, monitoring and recommendations..."
></textarea>

</div>


<hr>


<!-- ================================
     ADDITIONAL
================================ -->

<h3>
Additional Information
</h3>


<div class="form-group">

<label>
Prescription / Medication
</label>

<textarea
id="medication"
placeholder="Drug name, dose, route, frequency and duration..."
></textarea>

</div>


<div class="form-group">

<label>
Procedure
</label>

<textarea
id="procedure"
placeholder="Procedure performed..."
></textarea>

</div>


<div class="form-group">

<label>
Follow-up
</label>

<textarea
id="followUp"
placeholder="Next visit, monitoring instructions, warning signs..."
></textarea>

</div>


<div
id="message"
class="message">
</div>


<div class="form-actions">

<button
type="button"
id="cancelButton"
class="cancel-button"
>
Cancel
</button>


<button
type="submit"
id="saveButton"
>
Save Medical Record
</button>

</div>


</form>

</section>

</main>

</div>


<!-- ================================
     SUPABASE
================================ -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =====================================================
   SUPABASE CONFIG
===================================================== */

const SUPABASE_URL =
"https://zltbjbbofvvndxirlipf.supabase.co";


const SUPABASE_KEY =
"sb_publishable_MWH4JPfiiJ2gvIqYpKE_Yw_UAoAlnFJ";


const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
        auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true,
            storage: window.localStorage
        }
    }
);


/* =====================================================
   ELEMENTS
===================================================== */

const patientSearch =
document.getElementById(
    "patientSearch"
);

const patientResults =
document.getElementById(
    "patientResults"
);

const patientId =
document.getElementById(
    "patientId"
);

const selectedPatient =
document.getElementById(
    "selectedPatient"
);

const visitDate =
document.getElementById(
    "visitDate"
);

const recordForm =
document.getElementById(
    "recordForm"
);

const saveButton =
document.getElementById(
    "saveButton"
);

const message =
document.getElementById(
    "message"
);


/* =====================================================
   VARIABLES
===================================================== */

let currentSession = null;

let currentClinic = null;

let patients = [];


/* =====================================================
   GET SESSION
===================================================== */

async function getSession() {

    console.log(
        "Checking Supabase session..."
    );


    const {
        data,
        error
    } =
    await supabaseClient
        .auth
        .getSession();


    console.log(
        "Supabase session:",
        data?.session
    );


    if (error) {

        console.error(
            "Session error:",
            error
        );

        return null;

    }


    if (!data?.session) {

        console.error(
            "NO ACTIVE SUPABASE SESSION"
        );

        window.location.href =
            "login.html";

        return null;

    }


    currentSession =
        data.session;


    return currentSession;

}


/* =====================================================
   GET CURRENT CLINIC
===================================================== */

async function getClinic() {

    const session =
        await getSession();


    if (!session) {

        return null;

    }


    console.log(
        "Logged in user:",
        session.user.id
    );


    const {
        data,
        error
    } =
    await supabaseClient
        .from("clinic_members")
        .select(`
            clinic_id,
            role,
            clinics (
                id,
                name
            )
        `)
        .eq(
            "user_id",
            session.user.id
        )
        .maybeSingle();


    if (error) {

        console.error(
            "Clinic lookup error:",
            error
        );

        message.textContent =
            "Unable to load clinic information.";

        message.style.color =
            "#dc2626";

        return null;

    }


    if (
        !data ||
        !data.clinics
    ) {

        console.error(
            "User is not connected to a clinic."
        );

        message.textContent =
            "Your account is not connected to a clinic.";

        message.style.color =
            "#dc2626";

        return null;

    }


    currentClinic = {

        clinicId:
            data.clinic_id,

        clinicName:
            data.clinics.name,

        role:
            data.role

    };


    console.log(
        "Current clinic:",
        currentClinic
    );


    return currentClinic;

}


/* =====================================================
   LOAD PATIENTS
===================================================== */

async function loadPatients() {

    console.log(
        "Loading patients..."
    );


    const {
        data,
        error
    } =
    await supabaseClient
        .from("patients")
        .select(`
            id,
            name,
            species,
            breed,
            sex,
            owner
        `)
        .eq(
            "clinic_id",
            currentClinic.clinicId
        )
        .order(
            "name",
            {
                ascending: true
            }
        );


    if (error) {

        console.error(
            "Patients error:",
            error
        );

        message.textContent =
            "Failed to load patients: " +
            error.message;

        message.style.color =
            "#dc2626";

        return false;

    }


    patients =
        data || [];


    console.log(
        "Patients loaded:",
        patients
    );


    return true;

}


/* =====================================================
   SEARCH PATIENT
===================================================== */

patientSearch.addEventListener(
    "input",
    function() {

        const query =
            this.value
                .trim()
                .toLowerCase();


        patientId.value = "";

        selectedPatient.style.display =
            "none";


        if (!query) {

            patientResults.style.display =
                "none";

            return;

        }


        const matches =
            patients.filter(
                function(patient) {

                    const name =
                        String(
                            patient.name || ""
                        )
                        .toLowerCase();

                    const species =
                        String(
                            patient.species || ""
                        )
                        .toLowerCase();

                    const breed =
                        String(
                            patient.breed || ""
                        )
                        .toLowerCase();

                    const owner =
                        String(
                            patient.owner || ""
                        )
                        .toLowerCase();


                    return (
                        name.includes(query) ||
                        species.includes(query) ||
                        breed.includes(query) ||
                        owner.includes(query)
                    );

                }
            );


        renderPatientResults(
            matches
        );

    }
);


/* =====================================================
   SHOW PATIENTS WHEN CLICKING INPUT
===================================================== */

patientSearch.addEventListener(
    "focus",
    function() {

        if (!this.value.trim()) {

            renderPatientResults(
                patients
            );

        }

    }
);


/* =====================================================
   RENDER PATIENT RESULTS
===================================================== */

function renderPatientResults(
    list
) {

    patientResults.innerHTML = "";


    if (!list.length) {

        const empty =
            document.createElement(
                "div"
            );

        empty.className =
            "patient-result";

        empty.textContent =
            "No patient found.";

        patientResults.appendChild(
            empty
        );

        patientResults.style.display =
            "block";

        return;

    }


    list.forEach(
        function(patient) {

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "patient-result";


            const name =
                patient.name ||
                "Unnamed";


            const species =
                patient.species ||
                "-";


            const breed =
                patient.breed ||
                "";


            const owner =
                patient.owner ||
                "-";


            item.innerHTML = `

                <strong>
                    ${escapeHTML(name)}
                </strong>

                <span>
                    ${escapeHTML(species)}

                    ${
                        breed
                        ? " • " +
                          escapeHTML(breed)
                        : ""
                    }

                    • Owner:
                    ${escapeHTML(owner)}

                </span>

            `;


            item.addEventListener(
                "click",
                function() {

                    selectPatient(
                        patient
                    );

                }
            );


            patientResults.appendChild(
                item
            );

        }
    );


    patientResults.style.display =
        "block";

}


/* =====================================================
   SELECT PATIENT
===================================================== */

function selectPatient(
    patient
) {

    patientId.value =
        patient.id;


    patientSearch.value =
        patient.name || "";


    selectedPatient.innerHTML = `

        <strong>
            Selected:
        </strong>

        ${escapeHTML(
            patient.name || "Unnamed"
        )}

        •
        ${escapeHTML(
            patient.species || "-"
        )}

        ${
            patient.breed
            ? " • " +
              escapeHTML(patient.breed)
            : ""
        }

        <br>

        Owner:
        ${escapeHTML(
            patient.owner || "-"
        )}

    `;


    selectedPatient.style.display =
        "block";


    patientResults.style.display =
        "none";

}


/* =====================================================
   CLOSE SEARCH
===================================================== */

document.addEventListener(
    "click",
    function(event) {

        if (
            !event.target.closest(
                ".patient-search-wrapper"
            )
        ) {

            patientResults.style.display =
                "none";

        }

    }
);


/* =====================================================
   DEFAULT DATE
===================================================== */

function setDefaultDate() {

    visitDate.value =
        new Date()
            .toISOString()
            .split("T")[0];

}


/* =====================================================
   BUILD OBJECTIVE
===================================================== */

function buildObjective() {

    const parts = [];


    const temperature =
        document.getElementById(
            "temperature"
        ).value.trim();


    const heartRate =
        document.getElementById(
            "heartRate"
        ).value.trim();


    const respiratoryRate =
        document.getElementById(
            "respiratoryRate"
        ).value.trim();


    const crt =
        document.getElementById(
            "crt"
        ).value.trim();


    const mucousMembrane =
        document.getElementById(
            "mucousMembrane"
        ).value.trim();


    const bodyWeight =
        document.getElementById(
            "bodyWeight"
        ).value.trim();


    const physicalExam =
        document.getElementById(
            "physicalExam"
        ).value.trim();


    if (temperature) {

        parts.push(
            "Temperature: " +
            temperature +
            " °C"
        );

    }


    if (heartRate) {

        parts.push(
            "Heart Rate: " +
            heartRate +
            " bpm"
        );

    }


    if (respiratoryRate) {

        parts.push(
            "Respiratory Rate: " +
            respiratoryRate +
            " /min"
        );

    }


    if (crt) {

        parts.push(
            "CRT: " +
            crt
        );

    }


    if (mucousMembrane) {

        parts.push(
            "Mucous Membrane: " +
            mucousMembrane
        );

    }


    if (bodyWeight) {

        parts.push(
            "Body Weight: " +
            bodyWeight +
            " kg"
        );

    }


    if (physicalExam) {

        parts.push(
            "Physical Examination: " +
            physicalExam
        );

    }


    return parts.join("\n");

}


/* =====================================================
   SAVE
===================================================== */

recordForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        if (!currentClinic) {

            alert(
                "Clinic information is not available."
            );

            return;

        }


        if (!patientId.value) {

            alert(
                "Please select a patient from the search results."
            );

            patientSearch.focus();

            return;

        }


        saveButton.disabled =
            true;

        saveButton.textContent =
            "Saving...";


        const record = {

            clinic_id:
                currentClinic.clinicId,

            patient_id:
                patientId.value,

            visit_date:
                visitDate.value,

            chief_complaint:
                document.getElementById(
                    "chiefComplaint"
                ).value.trim(),

            subjective:
                document.getElementById(
                    "subjective"
                ).value.trim(),

            objective:
                buildObjective(),

            assessment:
                document.getElementById(
                    "assessment"
                ).value.trim(),

            plan:
                document.getElementById(
                    "plan"
                ).value.trim(),

            medication:
                document.getElementById(
                    "medication"
                ).value.trim(),

            procedure:
                document.getElementById(
                    "procedure"
                ).value.trim(),

            follow_up:
                document.getElementById(
                    "followUp"
                ).value.trim()

        };


        console.log(
            "Saving medical record:",
            record
        );


        const {
            data,
            error
        } =
        await supabaseClient
            .from("medical_records")
            .insert(
                record
            )
            .select()
            .single();


        if (error) {

            console.error(
                "Medical record save error:",
                error
            );


            alert(
                "Failed to save medical record:\n\n" +
                error.message
            );


            saveButton.disabled =
                false;

            saveButton.textContent =
                "Save Medical Record";

            return;

        }


        console.log(
            "Medical record saved:",
            data
        );


        alert(
            "Medical record saved successfully."
        );


        window.location.href =
            "medical-records.html";

    }
);


/* =====================================================
   CANCEL
===================================================== */

document.getElementById(
    "cancelButton"
).addEventListener(
    "click",
    function() {

        window.location.href =
            "medical-records.html";

    }
);


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(
    value
) {

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =====================================================
   INIT
===================================================== */

async function init() {

    console.log(
        "Add Medical Record: initializing..."
    );


    const clinic =
        await getClinic();


    if (!clinic) {

        return;

    }


    const loaded =
        await loadPatients();


    if (!loaded) {

        return;

    }


    setDefaultDate();

}


init();

</script>

</body>

</html>
