<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Medical Record - VetClinic</title>

<link rel="stylesheet" href="style.css">

<style>

.patient-search-wrapper {
    position: relative;
}

#patientSearch {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 15px;
    background: white;
    box-sizing: border-box;
}

.patient-results {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    right: 0;
    background: white;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    max-height: 220px;
    overflow-y: auto;
    z-index: 1000;
    display: none;
    box-shadow: 0 8px 20px rgba(0,0,0,0.08);
}

.patient-result {
    padding: 11px 14px;
    cursor: pointer;
    border-bottom: 1px solid #f1f1f1;
}

.patient-result:hover {
    background: #f4f6fb;
}

.patient-result:last-child {
    border-bottom: none;
}

.patient-result strong {
    display: block;
    color: #252d3d;
}

.patient-result small {
    color: #6b7280;
}

.selected-patient {
    margin-top: 8px;
    padding: 10px 12px;
    background: #eef2ff;
    border-radius: 7px;
    color: #374151;
    font-size: 14px;
    display: none;
}

.visit-type-box {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.visit-option {
    border: 1px solid #d1d5db;
    border-radius: 9px;
    padding: 14px;
    cursor: pointer;
    background: white;
    transition: .2s;
}

.visit-option:hover {
    border-color: #6366f1;
}

.visit-option.selected {
    border-color: #6366f1;
    background: #eef2ff;
}

.visit-option input {
    margin-right: 8px;
}

.visit-option strong {
    display: block;
    margin-bottom: 4px;
}

.visit-option small {
    color: #6b7280;
}

.status-message {
    margin-top: 15px;
    padding: 10px;
    border-radius: 7px;
    display: none;
}

.status-success {
    background: #dcfce7;
    color: #166534;
}

.status-error {
    background: #fee2e2;
    color: #991b1b;
}

.status-loading {
    background: #f3f4f6;
    color: #374151;
}

textarea {
    min-height: 100px;
    resize: vertical;
}

.grooming-note {
    margin-top: 8px;
    padding: 10px 12px;
    background: #f9fafb;
    border-radius: 7px;
    color: #6b7280;
    font-size: 13px;
}

.edit-badge {
    display: inline-block;
    margin-left: 8px;
    padding: 5px 9px;
    border-radius: 999px;
    background: #eef2ff;
    color: #5b50c7;
    font-size: 12px;
    font-weight: 700;
}

@media (max-width: 700px) {

    .visit-type-box {
        grid-template-columns: 1fr;
    }

}

</style>

</head>


<body>


<div class="app">


<!-- SIDEBAR -->

<aside class="sidebar">

    <h1>
        🐾 VetClinic
    </h1>


    <nav>

        <a href="index.html">
            Dashboard
        </a>

        <a href="patients.html">
            Patients
        </a>

        <a href="appointments.html">
            Appointments
        </a>

        <a
            href="medical-records.html"
            class="active"
        >
            Medical Records
        </a>

        <a href="medicines.html">
            Medicines
        </a>

        <a href="billing.html">
            Billing
        </a>

        <a href="reports.html">
            Reports
        </a>

        <a href="backup.html">
            Backup & Restore
        </a>

    </nav>

</aside>



<!-- MAIN -->

<main class="main-content">


<header>

    <div>

        <h2 id="pageTitle">
            New Medical Record
        </h2>

        <p id="pageSubtitle">
            Create a clinical record for a patient.
        </p>

    </div>


    <a
        href="medical-records.html"
        class="add-button"
    >
        ← Back
    </a>

</header>



<section class="appointments">


<form id="recordForm">


<!-- PATIENT -->

<div class="form-group">

    <label>
        Patient *
    </label>


    <div class="patient-search-wrapper">

        <input
            type="text"
            id="patientSearch"
            placeholder="Search patient name..."
            autocomplete="off"
            required
        >


        <div
            id="patientResults"
            class="patient-results"
        ></div>

    </div>


    <div
        id="selectedPatient"
        class="selected-patient"
    ></div>


    <input
        type="hidden"
        id="patientId"
    >

</div>



<!-- VISIT DATE -->

<div class="form-group">

    <label>
        Visit Date *
    </label>


    <input
        type="date"
        id="visitDate"
        required
    >

</div>



<!-- VISIT TYPE -->

<div class="form-group">

    <label>
        Visit Type *
    </label>


    <div class="visit-type-box">


        <label
            class="visit-option selected"
            id="consultationOption"
        >

            <input
                type="radio"
                name="visitType"
                value="consultation"
                checked
            >

            <strong>
                Consultation
            </strong>

            <small>
                Patient comes because of a complaint,
                illness, or clinical concern.
            </small>

        </label>



        <label
            class="visit-option"
            id="groomingOption"
        >

            <input
                type="radio"
                name="visitType"
                value="grooming"
            >

            <strong>
                Grooming
            </strong>

            <small>
                Pre-grooming health check.
            </small>

        </label>


    </div>


    <div class="grooming-note">

        For grooming, record the basic health
        examination before the grooming procedure.

    </div>

</div>



<hr>



<h3 class="section-title">
    Clinical Examination
</h3>



<!-- CHIEF COMPLAINT -->

<div class="form-group">

    <label>
        Chief Complaint / Reason for Visit
    </label>


    <textarea
        id="chiefComplaint"
        placeholder="Main reason for consultation or grooming..."
    ></textarea>

</div>



<!-- SUBJECTIVE -->

<div class="form-group">

    <label>
        Subjective
    </label>


    <textarea
        id="subjective"
        placeholder="Owner complaints, history, appetite, drinking, vomiting, diarrhea, duration, etc."
    ></textarea>

</div>



<!-- OBJECTIVE -->

<div class="form-group">

    <label>
        Objective / Physical Examination
    </label>


    <textarea
        id="objective"
        placeholder="Physical examination findings, general condition, hydration, mucous membrane, skin, eyes, ears, etc."
    ></textarea>

</div>



<!-- ASSESSMENT -->

<div class="form-group">

    <label>
        Assessment
    </label>


    <textarea
        id="assessment"
        placeholder="Clinical assessment / pre-grooming health assessment..."
    ></textarea>

</div>



<!-- DIAGNOSIS -->

<div class="form-group">

    <label>
        Diagnosis
    </label>


    <textarea
        id="diagnosis"
        placeholder="Diagnosis or clinical impression..."
    ></textarea>

</div>



<!-- PLAN -->

<div class="form-group">

    <label>
        Plan
    </label>


    <textarea
        id="plan"
        placeholder="Diagnostic plan, treatment plan, monitoring, or grooming recommendation..."
    ></textarea>

</div>



<!-- TREATMENT -->

<div class="form-group">

    <label>
        Treatment
    </label>


    <textarea
        id="treatment"
        placeholder="Treatment performed during consultation or health check..."
    ></textarea>

</div>



<!-- MEDICATION -->

<div class="form-group">

    <label>
        Prescription / Medication
    </label>


    <textarea
        id="medication"
        placeholder="Drug name, dose, route, frequency and duration..."
    ></textarea>

</div>



<!-- PROCEDURE -->

<div class="form-group">

    <label>
        Procedure
    </label>


    <textarea
        id="procedure"
        placeholder="Procedure performed, including grooming if applicable..."
    ></textarea>

</div>



<!-- NOTES -->

<div class="form-group">

    <label>
        Additional Notes
    </label>


    <textarea
        id="notes"
        placeholder="Other important clinical notes..."
    ></textarea>

</div>



<!-- FOLLOW UP -->

<div class="form-group">

    <label>
        Follow-up Date
    </label>


    <input
        type="date"
        id="followUpDate"
    >

</div>



<!-- STATUS -->

<div
    id="statusMessage"
    class="status-message"
></div>



<!-- BUTTONS -->

<div class="form-actions">

    <button
        type="button"
        id="cancelButton"
        class="cancel-button"
    >
        Cancel
    </button>


    <button
        type="submit"
        id="saveButton"
    >
        Save Medical Record
    </button>

</div>


</form>


</section>


</main>


</div>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://zltbjbbofvvndxirlipf.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_MWH4JPfiiJ2gvIqYpKE_Yw_UAoAlnFJ";


const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        {
            auth: {
                persistSession: true,
                autoRefreshToken: true,
                detectSessionInUrl: true,
                storage: window.localStorage
            }
        }
    );



/* =====================================================
   VARIABLES
===================================================== */

let currentSession = null;

let currentClinic = null;

let patients = [];

let editRecordId = null;

let editMode = false;



/* =====================================================
   URL PARAMETERS
===================================================== */

const urlParams =
    new URLSearchParams(
        window.location.search
    );


/*
   Kalau ada:

   add-record.html?id=XXXXXXXX

   berarti EDIT MODE.
*/

editRecordId =
    urlParams.get("id");

editMode =
    !!editRecordId;



/* =====================================================
   ELEMENTS
===================================================== */

const patientSearch =
    document.getElementById(
        "patientSearch"
    );


const patientResults =
    document.getElementById(
        "patientResults"
    );


const patientIdInput =
    document.getElementById(
        "patientId"
    );


const selectedPatient =
    document.getElementById(
        "selectedPatient"
    );


const recordForm =
    document.getElementById(
        "recordForm"
    );


const statusMessage =
    document.getElementById(
        "statusMessage"
    );


const saveButton =
    document.getElementById(
        "saveButton"
    );


const pageTitle =
    document.getElementById(
        "pageTitle"
    );


const pageSubtitle =
    document.getElementById(
        "pageSubtitle"
    );



/* =====================================================
   PAGE MODE
===================================================== */

if (editMode) {

    pageTitle.innerHTML =
        `Edit Medical Record
        <span class="edit-badge">
            EDIT MODE
        </span>`;


    pageSubtitle.textContent =
        "Update the existing clinical record.";


    saveButton.textContent =
        "Update Medical Record";

}



else {

    pageTitle.textContent =
        "New Medical Record";


    pageSubtitle.textContent =
        "Create a clinical record for a patient.";


    saveButton.textContent =
        "Save Medical Record";

}



/* =====================================================
   STATUS
===================================================== */

function showStatus(
    message,
    type = "loading"
) {

    statusMessage.textContent =
        message;

    statusMessage.className =
        "status-message status-" +
        type;

    statusMessage.style.display =
        "block";
}



/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(
    value
) {

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}



/* =====================================================
   FORM VALUE
===================================================== */

function valueOf(
    id
) {

    const element =
        document.getElementById(
            id
        );


    if (!element) {

        return null;

    }


    const value =
        element.value.trim();


    return value === ""
        ? null
        : value;

}



/* =====================================================
   GET CURRENT CLINIC
===================================================== */

async function getCurrentClinic() {


    const {
        data,
        error
    } =
        await supabaseClient
            .auth
            .getSession();


    if (error) {

        console.error(
            "Session error:",
            error
        );

        showStatus(
            "Session error: " +
            error.message,
            "error"
        );

        return null;

    }


    if (!data?.session) {

        window.location.href =
            "login.html";

        return null;

    }


    currentSession =
        data.session;


    const {
        data: membership,
        error: membershipError
    } =
        await supabaseClient
            .from(
                "clinic_members"
            )
            .select(`
                clinic_id,
                role,
                clinics (
                    id,
                    name
                )
            `)
            .eq(
                "user_id",
                currentSession.user.id
            )
            .maybeSingle();


    if (membershipError) {

        console.error(
            membershipError
        );

        showStatus(
            "Failed to load clinic: " +
            membershipError.message,
            "error"
        );

        return null;

    }


    if (
        !membership ||
        !membership.clinics
    ) {

        showStatus(
            "Your account is not connected to a clinic.",
            "error"
        );

        return null;

    }


    currentClinic = {

        userId:
            currentSession.user.id,

        clinicId:
            membership.clinic_id,

        clinicName:
            membership.clinics.name,

        role:
            membership.role

    };


    return currentClinic;

}



/* =====================================================
   PATIENT HELPERS
===================================================== */

function getPatientName(
    patient
) {

    return (
        patient.name ||
        patient.pet_name ||
        patient.patient_name ||
        "Unnamed Patient"
    );

}


function getPatientSpecies(
    patient
) {

    return (
        patient.species ||
        "-"
    );

}


function getPatientBreed(
    patient
) {

    return (
        patient.breed ||
        ""
    );

}


function getPatientOwner(
    patient
) {

    return (
        patient.owner_name ||
        patient.owner ||
        patient.client_name ||
        "-"
    );

}



/* =====================================================
   LOAD PATIENTS
===================================================== */

async function loadPatients() {


    if (!currentClinic) {

        return;

    }


    const {
        data,
        error
    } =
        await supabaseClient
            .from(
                "patients"
            )
            .select("*")
            .eq(
                "clinic_id",
                currentClinic.clinicId
            )
            .order(
                "name",
                {
                    ascending: true
                }
            );


    if (error) {

        console.error(
            "Patient loading error:",
            error
        );

        showStatus(
            "Unable to load patients: " +
            error.message,
            "error"
        );

        return;

    }


    patients =
        data || [];


    /*
       Kalau halaman dibuka dari:

       add-record.html?patientId=XXXX

       pilih patient otomatis.
    */

    const urlPatientId =
        urlParams.get(
            "patientId"
        );


    if (urlPatientId) {

        const patient =
            patients.find(
                item =>
                    String(item.id) ===
                    String(urlPatientId)
            );


        if (patient) {

            selectPatient(
                patient
            );

        }

    }

}



/* =====================================================
   SEARCH PATIENT
===================================================== */

patientSearch.addEventListener(
    "input",
    function() {


        const keyword =
            patientSearch.value
                .trim()
                .toLowerCase();


        patientResults.innerHTML =
            "";


        if (!keyword) {

            patientResults.style.display =
                "none";

            return;

        }


        const filtered =
            patients.filter(
                patient => {


                    const name =
                        String(
                            getPatientName(
                                patient
                            )
                        )
                        .toLowerCase();


                    const species =
                        String(
                            getPatientSpecies(
                                patient
                            )
                        )
                        .toLowerCase();


                    const breed =
                        String(
                            getPatientBreed(
                                patient
                            )
                        )
                        .toLowerCase();


                    const owner =
                        String(
                            getPatientOwner(
                                patient
                            )
                        )
                        .toLowerCase();


                    return (

                        name.includes(
                            keyword
                        ) ||

                        species.includes(
                            keyword
                        ) ||

                        breed.includes(
                            keyword
                        ) ||

                        owner.includes(
                            keyword
                        )

                    );

                }
            );


        if (!filtered.length) {

            const empty =
                document.createElement(
                    "div"
                );


            empty.className =
                "patient-result";


            empty.textContent =
                "No patient found.";


            patientResults.appendChild(
                empty
            );


            patientResults.style.display =
                "block";


            return;

        }


        filtered.forEach(
            patient => {


                const item =
                    document.createElement(
                        "div"
                    );


                item.className =
                    "patient-result";


                const name =
                    getPatientName(
                        patient
                    );


                const species =
                    getPatientSpecies(
                        patient
                    );


                const breed =
                    getPatientBreed(
                        patient
                    );


                const owner =
                    getPatientOwner(
                        patient
                    );


                item.innerHTML = `

                    <strong>
                        ${escapeHtml(
                            name
                        )}
                    </strong>

                    <small>

                        ${escapeHtml(
                            species
                        )}

                        ${
                            breed
                            ? " • " +
                              escapeHtml(
                                  breed
                              )
                            : ""
                        }

                        • Owner:

                        ${escapeHtml(
                            owner
                        )}

                    </small>

                `;


                item.addEventListener(
                    "click",
                    function() {

                        selectPatient(
                            patient
                        );

                    }
                );


                patientResults.appendChild(
                    item
                );

            }
        );


        patientResults.style.display =
            "block";

    }
);



/* =====================================================
   SELECT PATIENT
===================================================== */

function selectPatient(
    patient
) {


    patientIdInput.value =
        patient.id;


    patientSearch.value =
        getPatientName(
            patient
        );


    selectedPatient.innerHTML = `

        <strong>
            Selected:
        </strong>

        ${escapeHtml(
            getPatientName(
                patient
            )
        )}

        •

        ${escapeHtml(
            getPatientSpecies(
                patient
            )
        )}

        ${
            getPatientBreed(
                patient
            )
            ? " • " +
              escapeHtml(
                  getPatientBreed(
                      patient
                  )
              )
            : ""
        }

        • Owner:

        ${escapeHtml(
            getPatientOwner(
                patient
            )
        )}

    `;


    selectedPatient.style.display =
        "block";


    patientResults.style.display =
        "none";

}



/* =====================================================
   CLICK OUTSIDE SEARCH
===================================================== */

document.addEventListener(
    "click",
    function(event) {

        if (
            !event.target.closest(
                ".patient-search-wrapper"
            )
        ) {

            patientResults.style.display =
                "none";

        }

    }
);



/* =====================================================
   VISIT TYPE
===================================================== */

const consultationOption =
    document.getElementById(
        "consultationOption"
    );


const groomingOption =
    document.getElementById(
        "groomingOption"
    );


const visitTypeInputs =
    document.querySelectorAll(
        'input[name="visitType"]'
    );


visitTypeInputs.forEach(
    input => {

        input.addEventListener(
            "change",
            function() {


                consultationOption
                    .classList
                    .remove(
                        "selected"
                    );


                groomingOption
                    .classList
                    .remove(
                        "selected"
                    );


                if (
                    this.value ===
                    "consultation"
                ) {

                    consultationOption
                        .classList
                        .add(
                            "selected"
                        );

                }


                if (
                    this.value ===
                    "grooming"
                ) {

                    groomingOption
                        .classList
                        .add(
                            "selected"
                        );

                }

            }
        );

    }
);



/* =====================================================
   SET VISIT TYPE
===================================================== */

function setVisitType(
    value
) {


    const input =
        document.querySelector(
            `input[name="visitType"][value="${value}"]`
        );


    if (!input) {

        return;

    }


    input.checked =
        true;


    consultationOption
        .classList
        .remove(
            "selected"
        );


    groomingOption
        .classList
        .remove(
            "selected"
        );


    if (
        value ===
        "grooming"
    ) {

        groomingOption
            .classList
            .add(
                "selected"
            );

    }

    else {

        consultationOption
            .classList
            .add(
                "selected"
            );

    }

}



/* =====================================================
   LOAD EXISTING MEDICAL RECORD
===================================================== */

async function loadExistingRecord() {


    if (
        !editMode
    ) {

        return true;

    }


    showStatus(
        "Loading existing medical record...",
        "loading"
    );


    const {
        data: record,
        error
    } =
        await supabaseClient
            .from(
                "medical_records"
            )
            .select("*")
            .eq(
                "id",
                editRecordId
            )
            .eq(
                "clinic_id",
                currentClinic.clinicId
            )
            .single();


    if (error) {

        console.error(
            "Load record error:",
            error
        );


        showStatus(
            "Failed to load medical record: " +
            error.message,
            "error"
        );


        return false;

    }


    if (!record) {

        showStatus(
            "Medical record not found.",
            "error"
        );


        return false;

    }


    console.log(
        "Existing record:",
        record
    );


    /*
       PATIENT
    */

    patientIdInput.value =
        record.patient_id ||
        "";


    const patient =
        patients.find(
            item =>
                String(item.id) ===
                String(record.patient_id)
        );


    if (patient) {

        selectPatient(
            patient
        );

    }

    else {

        /*
           Fallback kalau patient
           tidak ditemukan di cache.
        */

        patientSearch.value =
            "Patient";

        selectedPatient.innerHTML = `

            <strong>
                Selected patient ID:
            </strong>

            ${escapeHtml(
                record.patient_id
            )}

        `;

        selectedPatient.style.display =
            "block";

    }



    /*
       DATE
    */

    document.getElementById(
        "visitDate"
    ).value =
        record.visit_date ||
        "";



    /*
       VISIT TYPE
    */

    setVisitType(
        record.visit_type ||
        "consultation"
    );



    /*
       CLINICAL FIELDS
    */

    document.getElementById(
        "chiefComplaint"
    ).value =
        record.chief_complaint ||
        "";


    document.getElementById(
        "subjective"
    ).value =
        record.subjective ||
        "";


    document.getElementById(
        "objective"
    ).value =
        record.objective ||
        "";


    document.getElementById(
        "assessment"
    ).value =
        record.assessment ||
        "";


    document.getElementById(
        "diagnosis"
    ).value =
        record.diagnosis ||
        "";


    document.getElementById(
        "plan"
    ).value =
        record.plan ||
        "";


    document.getElementById(
        "treatment"
    ).value =
        record.treatment ||
        "";


    document.getElementById(
        "medication"
    ).value =
        record.medication ||
        "";


    document.getElementById(
        "procedure"
    ).value =
        record.procedure ||
        "";


    document.getElementById(
        "notes"
    ).value =
        record.notes ||
        "";


    document.getElementById(
        "followUpDate"
    ).value =
        record.follow_up_date ||
        "";


    statusMessage.style.display =
        "none";


    return true;

}



/* =====================================================
   SAVE / UPDATE MEDICAL RECORD
===================================================== */

recordForm.addEventListener(
    "submit",
    async function(event) {


        event.preventDefault();


        /* CHECK CLINIC */

        if (!currentClinic) {

            showStatus(
                "Clinic information is not available.",
                "error"
            );

            return;

        }


        /* CHECK PATIENT */

        if (!patientIdInput.value) {

            showStatus(
                "Please select a patient first.",
                "error"
            );

            patientSearch.focus();

            return;

        }


        /* CHECK DATE */

        const visitDate =
            document.getElementById(
                "visitDate"
            ).value;


        if (!visitDate) {

            showStatus(
                "Please select visit date.",
                "error"
            );

            return;

        }


        /* VISIT TYPE */

        const selectedVisitType =
            document.querySelector(
                'input[name="visitType"]:checked'
            );


        if (!selectedVisitType) {

            showStatus(
                "Please select visit type.",
                "error"
            );

            return;

        }


        const visitType =
            selectedVisitType.value;


        /* DISABLE */

        saveButton.disabled =
            true;


        saveButton.textContent =
            editMode
                ? "Updating..."
                : "Saving...";


        showStatus(
            editMode
                ? "Updating medical record..."
                : "Saving medical record...",
            "loading"
        );


        try {


            /*
               DATA YANG AKAN DISIMPAN.

               clinic_id dan patient_id
               tetap dipastikan sesuai
               dengan klinik aktif.
            */

            const recordData = {

                clinic_id:
                    currentClinic.clinicId,

                patient_id:
                    patientIdInput.value,

                visit_date:
                    visitDate,

                visit_type:
                    visitType,

                chief_complaint:
                    valueOf(
                        "chiefComplaint"
                    ),

                subjective:
                    valueOf(
                        "subjective"
                    ),

                objective:
                    valueOf(
                        "objective"
                    ),

                assessment:
                    valueOf(
                        "assessment"
                    ),

                diagnosis:
                    valueOf(
                        "diagnosis"
                    ),

                plan:
                    valueOf(
                        "plan"
                    ),

                treatment:
                    valueOf(
                        "treatment"
                    ),

                medication:
                    valueOf(
                        "medication"
                    ),

                procedure:
                    valueOf(
                        "procedure"
                    ),

                notes:
                    valueOf(
                        "notes"
                    ),

                follow_up_date:
                    valueOf(
                        "followUpDate"
                    )

            };


            console.log(
                editMode
                    ? "Updating record:"
                    : "Creating record:",
                recordData
            );


            let result;


            /* =================================================
               EDIT MODE
               UPDATE RECORD LAMA
            ================================================= */

            if (editMode) {


                result =
                    await supabaseClient
                        .from(
                            "medical_records"
                        )
                        .update(
                            recordData
                        )
                        .eq(
                            "id",
                            editRecordId
                        )
                        .eq(
                            "clinic_id",
                            currentClinic.clinicId
                        )
                        .select()
                        .single();

            }


            /* =================================================
               NEW MODE
               INSERT RECORD BARU
            ================================================= */

            else {


                result =
                    await supabaseClient
                        .from(
                            "medical_records"
                        )
                        .insert(
                            recordData
                        )
                        .select()
                        .single();

            }


            const {
                data,
                error
            } =
                result;


            if (error) {

                console.error(
                    "Medical record save error:",
                    error
                );

                throw error;

            }


            console.log(
                editMode
                    ? "Medical record updated:"
                    : "Medical record created:",
                data
            );


            showStatus(
                editMode
                    ? "Medical record updated successfully."
                    : "Medical record saved successfully.",
                "success"
            );


            /*
               Setelah edit:
               kembali ke detail record
               yang sama.

               Setelah create:
               kembali ke medical records.
            */

            setTimeout(
                function() {


                    if (editMode) {

                        window.location.href =
                            "medical-record-detail.html?id=" +
                            encodeURIComponent(
                                editRecordId
                            );

                    }

                    else {

                        window.location.href =
                            "medical-records.html";

                    }

                },
                700
            );


        }


        catch (error) {


            console.error(
                "SAVE / UPDATE ERROR:",
                error
            );


            showStatus(
                (
                    editMode
                        ? "Failed to update medical record: "
                        : "Failed to save medical record: "
                ) +
                error.message,
                "error"
            );


            saveButton.disabled =
                false;


            saveButton.textContent =
                editMode
                    ? "Update Medical Record"
                    : "Save Medical Record";

        }

    }
);



/* =====================================================
   CANCEL
===================================================== */

document.getElementById(
    "cancelButton"
).addEventListener(
    "click",
    function() {


        if (editMode) {

            window.location.href =
                "medical-record-detail.html?id=" +
                encodeURIComponent(
                    editRecordId
                );

        }

        else {

            window.location.href =
                "medical-records.html";

        }

    }
);



/* =====================================================
   DEFAULT DATE
===================================================== */

if (!editMode) {

    document.getElementById(
        "visitDate"
    ).value =
        new Date()
            .toISOString()
            .split("T")[0];

}



/* =====================================================
   INITIALIZE
===================================================== */

async function initialize() {


    try {


        const clinic =
            await getCurrentClinic();


        if (!clinic) {

            return;

        }


        /*
           Patient harus diload
           SEBELUM existing record,
           karena record membutuhkan
           patient_id untuk memilih patient.
        */

        await loadPatients();


        /*
           Kalau Edit Mode,
           sekarang load record lama.
        */

        if (editMode) {

            const loaded =
                await loadExistingRecord();


            if (!loaded) {

                saveButton.disabled =
                    true;

                return;

            }

        }


    }


    catch (error) {


        console.error(
            "Initialization error:",
            error
        );


        showStatus(
            "Initialization failed: " +
            error.message,
            "error"
        );

    }

}


initialize();

</script>
