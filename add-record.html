<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>New Medical Record - VetClinic</title>

<link rel="stylesheet"
href="style.css">

<style>

/* ================================
   PATIENT SEARCH
================================ */

.patient-search-wrapper {
    position: relative;
}

.patient-search {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 15px;
    background: white;
}

.patient-search:focus {
    outline: none;
    border-color: #5146e5;
    box-shadow: 0 0 0 2px rgba(81,70,229,0.1);
}

.patient-dropdown {
    position: absolute;
    top: calc(100% + 5px);
    left: 0;
    right: 0;
    background: white;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.10);
    max-height: 250px;
    overflow-y: auto;
    z-index: 1000;
    display: none;
}

.patient-dropdown.show {
    display: block;
}

.patient-option {
    padding: 11px 14px;
    cursor: pointer;
    border-bottom: 1px solid #f0f0f0;
}

.patient-option:last-child {
    border-bottom: none;
}

.patient-option:hover {
    background: #f4f3ff;
}

.patient-name {
    font-weight: 600;
    color: #252d3d;
}

.patient-info {
    font-size: 13px;
    color: #6b7280;
    margin-top: 3px;
}

.no-patient {
    padding: 14px;
    color: #6b7280;
    text-align: center;
}


/* ================================
   SELECTED PATIENT
================================ */

.selected-patient {
    margin-top: 8px;
    padding: 10px 12px;
    background: #f4f3ff;
    border: 1px solid #ddd9ff;
    border-radius: 8px;
    font-size: 14px;
    color: #3730a3;
    display: none;
}


/* ================================
   OBJECTIVE GRID
================================ */

.vitals-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
    margin-bottom: 18px;
}

.vital-item label {
    margin-bottom: 6px;
}

.vital-item input,
.vital-item select {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 14px;
    background: white;
}

.vital-item input:focus,
.vital-item select:focus {
    outline: none;
    border-color: #5146e5;
}


/* ================================
   RESPONSIVE
================================ */

@media (max-width: 650px) {

    .vitals-grid {
        grid-template-columns: 1fr;
    }

}

</style>

</head>


<body>

<div class="app">


<aside class="sidebar">

<h1>🐾 VetClinic</h1>

<nav>

<a href="index.html">
Dashboard
</a>

<a href="patients.html">
Patients
</a>

<a href="appointments.html">
Appointments
</a>

<a href="medical-records.html"
class="active">
Medical Records
</a>

<a href="medicines.html">
Medicines
</a>

<a href="billing.html">
Billing
</a>

<a href="reports.html">
Reports
</a>

<a href="backup.html">
Backup & Restore
</a>

</nav>

</aside>


<main class="main-content">


<header>

<div>

<h2 id="pageTitle">
New Medical Record
</h2>

<p>
Create a clinical record for a patient.
</p>

</div>


<a
href="medical-records.html"
class="add-button">
← Back
</a>

</header>


<section class="appointments">


<form id="recordForm">


<!-- ================================
     PATIENT
================================ -->

<div class="form-group">

<label>
Patient *
</label>


<div class="patient-search-wrapper">

<input
type="text"
id="patientSearch"
class="patient-search"
placeholder="Search patient by name, species or breed..."
autocomplete="off"
>


<div
id="patientDropdown"
class="patient-dropdown">
</div>

</div>


<div
id="selectedPatient"
class="selected-patient">
</div>


<input
type="hidden"
id="patientId"
>


</div>


<!-- ================================
     VISIT DATE
================================ -->

<div class="form-group">

<label>
Visit Date *
</label>

<input
type="date"
id="visitDate"
required
>

</div>


<hr>


<h3>
SOAP Clinical Record
</h3>


<!-- ================================
     SUBJECTIVE
================================ -->

<div class="form-group">

<label>
Subjective
</label>

<textarea
id="subjective"
placeholder="Owner complaints, history, appetite, drinking, vomiting, diarrhea, duration of signs, previous treatment, etc."
></textarea>

</div>


<!-- ================================
     OBJECTIVE
================================ -->

<div class="form-group">

<label>
Objective
</label>


<div class="vitals-grid">


<div class="vital-item">

<label>
Temperature (°C)
</label>

<input
type="number"
step="0.1"
id="temperature"
placeholder="e.g. 38.5"
>

</div>


<div class="vital-item">

<label>
Heart Rate (bpm)
</label>

<input
type="number"
id="heartRate"
placeholder="e.g. 120"
>

</div>


<div class="vital-item">

<label>
Respiratory Rate (rpm)
</label>

<input
type="number"
id="respiratoryRate"
placeholder="e.g. 30"
>

</div>


<div class="vital-item">

<label>
CRT
</label>

<select id="crt">

<option value="">
Select
</option>

<option value="< 2 sec">
< 2 sec
</option>

<option value="2 sec">
2 sec
</option>

<option value="> 2 sec">
> 2 sec
</option>

</select>

</div>


<div class="vital-item">

<label>
Mucous Membrane
</label>

<select id="mucousMembrane">

<option value="">
Select
</option>

<option value="Pink">
Pink
</option>

<option value="Pale">
Pale
</option>

<option value="Icteric">
Icteric
</option>

<option value="Cyanotic">
Cyanotic
</option>

<option value="Congested">
Congested
</option>

</select>

</div>


<div class="vital-item">

<label>
Body Weight (kg)
</label>

<input
type="number"
step="0.01"
id="bodyWeight"
placeholder="e.g. 4.50"
>

</div>


</div>


<textarea
id="objectiveNotes"
placeholder="Other physical examination findings: hydration, lymph nodes, skin, eyes, ears, oral cavity, thorax, abdomen, musculoskeletal, etc."
></textarea>

</div>


<!-- ================================
     ASSESSMENT
================================ -->

<div class="form-group">

<label>
Assessment / Diagnosis
</label>

<textarea
id="assessment"
placeholder="Clinical assessment and diagnosis"
></textarea>

</div>


<!-- ================================
     PLAN
================================ -->

<div class="form-group">

<label>
Plan / Treatment
</label>

<textarea
id="plan"
placeholder="Treatment, medication, procedure, monitoring and follow-up"
></textarea>

</div>


<hr>


<h3>
Additional Information
</h3>


<!-- ================================
     MEDICATION
================================ -->

<div class="form-group">

<label>
Prescription / Medication
</label>

<textarea
id="medication"
placeholder="Drug name, dose, route and frequency"
></textarea>

</div>


<!-- ================================
     PROCEDURE
================================ -->

<div class="form-group">

<label>
Procedure
</label>

<textarea
id="procedure"
placeholder="Procedure performed, if any"
></textarea>

</div>


<!-- ================================
     FOLLOW UP
================================ -->

<div class="form-group">

<label>
Follow-up
</label>

<textarea
id="followUp"
placeholder="Next visit or monitoring instructions"
></textarea>

</div>


<div class="form-actions">

<button
type="button"
id="cancelButton"
class="cancel-button">
Cancel
</button>


<button
type="submit"
id="saveButton">
Save Medical Record
</button>

</div>


</form>

</section>

</main>

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://zltbjbbofvvndxirlipf.supabase.co";


const SUPABASE_KEY =
"sb_publishable_MWH4JPfiiJ2gvIqYpKE_Yw_UAoAlnFJ";


const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
        auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true,
            storage: window.localStorage
        }
    }
);


/* =====================================================
   ELEMENTS
===================================================== */

const patientSearch =
document.getElementById(
    "patientSearch"
);

const patientDropdown =
document.getElementById(
    "patientDropdown"
);

const patientId =
document.getElementById(
    "patientId"
);

const selectedPatient =
document.getElementById(
    "selectedPatient"
);

const visitDate =
document.getElementById(
    "visitDate"
);

const subjective =
document.getElementById(
    "subjective"
);

const temperature =
document.getElementById(
    "temperature"
);

const heartRate =
document.getElementById(
    "heartRate"
);

const respiratoryRate =
document.getElementById(
    "respiratoryRate"
);

const crt =
document.getElementById(
    "crt"
);

const mucousMembrane =
document.getElementById(
    "mucousMembrane"
);

const bodyWeight =
document.getElementById(
    "bodyWeight"
);

const objectiveNotes =
document.getElementById(
    "objectiveNotes"
);

const assessment =
document.getElementById(
    "assessment"
);

const plan =
document.getElementById(
    "plan"
);

const medication =
document.getElementById(
    "medication"
);

const procedureField =
document.getElementById(
    "procedure"
);

const followUp =
document.getElementById(
    "followUp"
);

const recordForm =
document.getElementById(
    "recordForm"
);

const saveButton =
document.getElementById(
    "saveButton"
);


/* =====================================================
   PARAMETERS
===================================================== */

const params =
new URLSearchParams(
    window.location.search
);

const editId =
params.get("editId");

const selectedPatientId =
params.get("patientId");


let currentUser = null;
let currentClinic = null;
let patients = [];
let editingRecord = null;


/* =====================================================
   GET CLINIC
===================================================== */

async function getCurrentClinic() {

    console.log(
        "Checking Supabase session..."
    );


    const {
        data,
        error
    } =
    await supabaseClient
        .auth
        .getSession();


    console.log(
        "Supabase session:",
        data?.session
    );


    if (error) {

        console.error(
            "Session error:",
            error
        );

        return null;
    }


    if (!data?.session) {

        console.error(
            "NO ACTIVE SUPABASE SESSION"
        );

        window.location.href =
            "login.html";

        return null;
    }


    currentUser =
        data.session.user;


    const {
        data: membership,
        error: membershipError
    } =
    await supabaseClient
        .from("clinic_members")
        .select(`
            clinic_id,
            role,
            clinics (
                id,
                name
            )
        `)
        .eq(
            "user_id",
            currentUser.id
        )
        .maybeSingle();


    if (membershipError) {

        console.error(
            "Clinic lookup error:",
            membershipError
        );

        return null;
    }


    if (
        !membership ||
        !membership.clinics
    ) {

        console.error(
            "User not connected to clinic."
        );

        return null;
    }


    currentClinic = {

        clinicId:
            membership.clinic_id,

        clinicName:
            membership.clinics.name,

        role:
            membership.role

    };


    console.log(
        "Current clinic:",
        currentClinic
    );


    return currentClinic;

}


/* =====================================================
   LOAD PATIENTS
===================================================== */

async function loadPatients() {

    console.log(
        "Loading patients..."
    );


    const {
        data,
        error
    } =
    await supabaseClient
        .from("patients")
        .select("*")
        .eq(
            "clinic_id",
            currentClinic.clinicId
        )
        .order(
            "name",
            {
                ascending: true
            }
        );


    if (error) {

        console.error(
            "Patients loading error:",
            error
        );

        return false;
    }


    patients =
        data || [];


    console.log(
        "Patients loaded:",
        patients
    );


    return true;

}


/* =====================================================
   PATIENT SEARCH
===================================================== */

function renderPatients(
    searchText = ""
) {

    const query =
        searchText
            .trim()
            .toLowerCase();


    const filtered =
        patients.filter(
            patient => {

                const name =
                    String(
                        patient.name || ""
                    ).toLowerCase();

                const species =
                    String(
                        patient.species || ""
                    ).toLowerCase();

                const breed =
                    String(
                        patient.breed || ""
                    ).toLowerCase();

                return (
                    name.includes(query) ||
                    species.includes(query) ||
                    breed.includes(query)
                );

            }
        );


    patientDropdown.innerHTML = "";


    if (!filtered.length) {

        const empty =
            document.createElement(
                "div"
            );

        empty.className =
            "no-patient";

        empty.textContent =
            "No patient found.";

        patientDropdown.appendChild(
            empty
        );

        patientDropdown.classList.add(
            "show"
        );

        return;

    }


    filtered.forEach(
        patient => {

            const option =
                document.createElement(
                    "div"
                );

            option.className =
                "patient-option";


            const name =
                patient.name ||
                "Unnamed";


            const species =
                patient.species ||
                "-";


            const breed =
                patient.breed ||
                "";


            option.innerHTML = `

                <div class="patient-name">
                    ${escapeHtml(name)}
                </div>

                <div class="patient-info">
                    ${escapeHtml(species)}
                    ${breed ? " • " + escapeHtml(breed) : ""}
                </div>

            `;


            option.addEventListener(
                "click",
                function() {

                    selectPatient(
                        patient
                    );

                }
            );


            patientDropdown.appendChild(
                option
            );

        }
    );


    patientDropdown.classList.add(
        "show"
    );

}


/* =====================================================
   SELECT PATIENT
===================================================== */

function selectPatient(
    patient
) {

    patientId.value =
        patient.id;


    patientSearch.value =
        patient.name ||
        "";


    selectedPatient.innerHTML = `

        <strong>
            Selected patient:
        </strong>

        ${escapeHtml(
            patient.name || "Unnamed"
        )}

        •

        ${escapeHtml(
            patient.species || "-"
        )}

        ${
            patient.breed
            ? " • " + escapeHtml(patient.breed)
            : ""
        }

    `;


    selectedPatient.style.display =
        "block";


    patientDropdown.classList.remove(
        "show"
    );

}


/* =====================================================
   SEARCH EVENTS
===================================================== */

patientSearch.addEventListener(
    "focus",
    function() {

        renderPatients(
            patientSearch.value
        );

    }
);


patientSearch.addEventListener(
    "input",
    function() {

        patientId.value = "";

        selectedPatient.style.display =
            "none";

        renderPatients(
            patientSearch.value
        );

    }
);


document.addEventListener(
    "click",
    function(event) {

        if (
            !event.target.closest(
                ".patient-search-wrapper"
            )
        ) {

            patientDropdown.classList.remove(
                "show"
            );

        }

    }
);


/* =====================================================
   HTML ESCAPE
===================================================== */

function escapeHtml(
    value
) {

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   BUILD OBJECTIVE
===================================================== */

function buildObjective() {

    const lines = [];


    if (temperature.value) {

        lines.push(
            `Temperature: ${temperature.value} °C`
        );

    }


    if (heartRate.value) {

        lines.push(
            `Heart Rate: ${heartRate.value} bpm`
        );

    }


    if (respiratoryRate.value) {

        lines.push(
            `Respiratory Rate: ${respiratoryRate.value} rpm`
        );

    }


    if (crt.value) {

        lines.push(
            `CRT: ${crt.value}`
        );

    }


    if (mucousMembrane.value) {

        lines.push(
            `Mucous Membrane: ${mucousMembrane.value}`
        );

    }


    if (bodyWeight.value) {

        lines.push(
            `Body Weight: ${bodyWeight.value} kg`
        );

    }


    if (objectiveNotes.value.trim()) {

        lines.push(
            objectiveNotes.value.trim()
        );

    }


    return lines.join("\n");

}


/* =====================================================
   LOAD EXISTING RECORD
===================================================== */

async function loadExistingRecord() {

    if (!editId) {

        return;

    }


    const {
        data,
        error
    } =
    await supabaseClient
        .from("medical_records")
        .select("*")
        .eq(
            "id",
            editId
        )
        .eq(
            "clinic_id",
            currentClinic.clinicId
        )
        .maybeSingle();


    if (error) {

        console.error(
            "Record loading error:",
            error
        );

        alert(
            "Unable to load medical record."
        );

        return;

    }


    if (!data) {

        alert(
            "Medical record not found."
        );

        return;

    }


    editingRecord =
        data;


    document.getElementById(
        "pageTitle"
    ).textContent =
        "Edit Medical Record";


    const patient =
        patients.find(
            p =>
                String(p.id) ===
                String(data.patient_id)
        );


    if (patient) {

        selectPatient(
            patient
        );

    }


    visitDate.value =
        data.visit_date || "";


    subjective.value =
        data.subjective || "";


    /*
     * Existing objective is kept as text.
     * New records will use the structured
     * vital fields above.
     */

    objectiveNotes.value =
        data.objective || "";


    assessment.value =
        data.assessment || "";


    plan.value =
        data.plan || "";


    medication.value =
        data.medication || "";


    procedureField.value =
        data.procedure || "";


    followUp.value =
        data.follow_up || "";

}


/* =====================================================
   DEFAULT DATE
===================================================== */

function setDefaultDate() {

    if (!visitDate.value) {

        visitDate.value =
            new Date()
            .toISOString()
            .split("T")[0];

    }

}


/* =====================================================
   SAVE
===================================================== */

recordForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        if (!patientId.value) {

            alert(
                "Please select a patient."
            );

            patientSearch.focus();

            return;

        }


        saveButton.disabled =
            true;

        saveButton.textContent =
            "Saving...";


        const recordData = {

            clinic_id:
                currentClinic.clinicId,

            patient_id:
                patientId.value,

            visit_date:
                visitDate.value,

            subjective:
                subjective.value.trim(),

            objective:
                buildObjective(),

            assessment:
                assessment.value.trim(),

            plan:
                plan.value.trim(),

            medication:
                medication.value.trim(),

            procedure:
                procedureField.value.trim(),

            follow_up:
                followUp.value.trim()

        };


        console.log(
            "Saving medical record:",
            recordData
        );


        try {

            if (editingRecord) {

                const {
                    error
                } =
                await supabaseClient
                    .from("medical_records")
                    .update(
                        recordData
                    )
                    .eq(
                        "id",
                        editingRecord.id
                    )
                    .eq(
                        "clinic_id",
                        currentClinic.clinicId
                    );


                if (error) {

                    throw error;

                }


                alert(
                    "Medical record updated successfully."
                );

            }

            else {

                const {
                    error
                } =
                await supabaseClient
                    .from("medical_records")
                    .insert(
                        recordData
                    );


                if (error) {

                    throw error;

                }


                alert(
                    "Medical record saved successfully."
                );

            }


            window.location.href =
                "medical-records.html";

        }

        catch (error) {

            console.error(
                "SAVE ERROR:",
                error
            );


            alert(
                "Failed to save medical record:\n\n" +
                error.message
            );


            saveButton.disabled =
                false;

            saveButton.textContent =
                "Save Medical Record";

        }

    }
);


/* =====================================================
   CANCEL
===================================================== */

document.getElementById(
    "cancelButton"
).addEventListener(
    "click",
    function() {

        window.location.href =
            "medical-records.html";

    }
);


/* =====================================================
   INIT
===================================================== */

async function init() {

    console.log(
        "Add Medical Record: starting..."
    );


    const clinic =
        await getCurrentClinic();


    if (!clinic) {

        return;

    }


    const patientsLoaded =
        await loadPatients();


    if (!patientsLoaded) {

        return;

    }


    setDefaultDate();


    /*
     * Kalau datang dari patient detail
     */

    if (
        selectedPatientId &&
        !editId
    ) {

        const patient =
            patients.find(
                p =>
                    String(p.id) ===
                    String(selectedPatientId)
            );


        if (patient) {

            selectPatient(
                patient
            );

        }

    }


    await loadExistingRecord();

}


init();

</script>

</body>

</html>
