<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>New Medical Record - VetClinic</title>

    <link rel="stylesheet" href="style.css">

    <style>

        .patient-search-wrapper {
            position: relative;
        }

        #patientSearch {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            background: white;
        }

        .patient-results {
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            max-height: 220px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
        }

        .patient-result {
            padding: 11px 14px;
            cursor: pointer;
            border-bottom: 1px solid #f1f1f1;
        }

        .patient-result:last-child {
            border-bottom: none;
        }

        .patient-result:hover {
            background: #f4f6fb;
        }

        .patient-result strong {
            display: block;
            color: #252d3d;
        }

        .patient-result small {
            color: #6b7280;
        }

        .selected-patient {
            margin-top: 8px;
            padding: 9px 12px;
            background: #eef2ff;
            border-radius: 7px;
            color: #374151;
            font-size: 14px;
            display: none;
        }

        .clinical-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        @media (max-width: 800px) {
            .clinical-grid {
                grid-template-columns: 1fr;
            }
        }

        .section-title {
            margin-top: 25px;
            margin-bottom: 15px;
            color: #252d3d;
        }

        .status-message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 7px;
            display: none;
        }

        .status-success {
            background: #dcfce7;
            color: #166534;
        }

        .status-error {
            background: #fee2e2;
            color: #991b1b;
        }

        .status-loading {
            background: #f3f4f6;
            color: #374151;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

    </style>

</head>


<body>

<div class="app">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <h1>🐾 VetClinic</h1>

        <nav>

            <a href="index.html">
                Dashboard
            </a>

            <a href="patients.html">
                Patients
            </a>

            <a href="appointments.html">
                Appointments
            </a>

            <a href="medical-records.html"
               class="active">
                Medical Records
            </a>

            <a href="medicines.html">
                Medicines
            </a>

            <a href="billing.html">
                Billing
            </a>

            <a href="reports.html">
                Reports
            </a>

            <a href="backup.html">
                Backup & Restore
            </a>

        </nav>

    </aside>


    <!-- MAIN -->

    <main class="main-content">

        <header>

            <div>

                <h2 id="pageTitle">
                    New Medical Record
                </h2>

                <p>
                    Create a clinical record for a patient.
                </p>

            </div>


            <a
                href="medical-records.html"
                class="add-button"
            >
                ← Back
            </a>

        </header>


        <section class="appointments">

            <form id="recordForm">


                <!-- PATIENT -->

                <div class="form-group">

                    <label>
                        Patient *
                    </label>

                    <div class="patient-search-wrapper">

                        <input
                            type="text"
                            id="patientSearch"
                            placeholder="Search patient name..."
                            autocomplete="off"
                            required
                        >

                        <div
                            id="patientResults"
                            class="patient-results">
                        </div>

                    </div>


                    <div
                        id="selectedPatient"
                        class="selected-patient">
                    </div>


                    <input
                        type="hidden"
                        id="patientId"
                    >

                </div>


                <!-- DATE -->

                <div class="form-group">

                    <label>
                        Visit Date *
                    </label>

                    <input
                        type="date"
                        id="visitDate"
                        required
                    >

                </div>


                <hr>


                <!-- CHIEF COMPLAINT -->

                <h3 class="section-title">
                    Consultation
                </h3>


                <div class="form-group">

                    <label>
                        Chief Complaint
                    </label>

                    <textarea
                        id="chiefComplaint"
                        placeholder="Main reason for consultation..."
                    ></textarea>

                </div>


                <!-- SOAP -->

                <h3 class="section-title">
                    SOAP Clinical Record
                </h3>


                <div class="form-group">

                    <label>
                        Subjective
                    </label>

                    <textarea
                        id="subjective"
                        placeholder="Owner complaints, history, appetite, drinking, vomiting, diarrhea, duration, etc."
                    ></textarea>

                </div>


                <div class="form-group">

                    <label>
                        Objective
                    </label>

                    <textarea
                        id="objective"
                        placeholder="Physical examination findings..."
                    ></textarea>

                </div>


                <!-- VITALS -->

                <h3 class="section-title">
                    Vital Signs
                </h3>


                <div class="clinical-grid">


                    <div class="form-group">

                        <label>
                            Temperature (°C)
                        </label>

                        <input
                            type="number"
                            id="temperature"
                            step="0.1"
                            placeholder="e.g. 38.5"
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Heart Rate (bpm)
                        </label>

                        <input
                            type="number"
                            id="heartRate"
                            placeholder="e.g. 120"
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Respiratory Rate (rpm)
                        </label>

                        <input
                            type="number"
                            id="respiratoryRate"
                            placeholder="e.g. 30"
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            CRT (seconds)
                        </label>

                        <input
                            type="number"
                            id="crt"
                            step="0.1"
                            placeholder="e.g. 1.5"
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Mucous Membrane
                        </label>

                        <input
                            type="text"
                            id="mucousMembrane"
                            placeholder="e.g. Pink"
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Body Weight (kg)
                        </label>

                        <input
                            type="number"
                            id="bodyWeight"
                            step="0.01"
                            placeholder="e.g. 4.5"
                        >

                    </div>

                </div>


                <!-- ASSESSMENT -->

                <div class="form-group">

                    <label>
                        Assessment
                    </label>

                    <textarea
                        id="assessment"
                        placeholder="Clinical assessment based on history and physical examination..."
                    ></textarea>

                </div>


                <!-- DIAGNOSIS -->

                <div class="form-group">

                    <label>
                        Diagnosis
                    </label>

                    <textarea
                        id="diagnosis"
                        placeholder="Primary diagnosis / differential diagnosis..."
                    ></textarea>

                </div>


                <!-- PLAN -->

                <div class="form-group">

                    <label>
                        Plan
                    </label>

                    <textarea
                        id="plan"
                        placeholder="Diagnostic plan, treatment plan, monitoring..."
                    ></textarea>

                </div>


                <!-- TREATMENT -->

                <div class="form-group">

                    <label>
                        Treatment
                    </label>

                    <textarea
                        id="treatment"
                        placeholder="Treatment performed during consultation..."
                    ></textarea>

                </div>


                <!-- MEDICATION -->

                <div class="form-group">

                    <label>
                        Prescription / Medication
                    </label>

                    <textarea
                        id="medication"
                        placeholder="Drug name, dose, route, frequency and duration..."
                    ></textarea>

                </div>


                <!-- PROCEDURE -->

                <div class="form-group">

                    <label>
                        Procedure
                    </label>

                    <textarea
                        id="procedure"
                        placeholder="Procedure performed, if any..."
                    ></textarea>

                </div>


                <!-- NOTES -->

                <div class="form-group">

                    <label>
                        Additional Notes
                    </label>

                    <textarea
                        id="notes"
                        placeholder="Other important clinical notes..."
                    ></textarea>

                </div>


                <!-- FOLLOW UP -->

                <div class="form-group">

                    <label>
                        Follow-up Date
                    </label>

                    <input
                        type="date"
                        id="followUpDate"
                    >

                </div>


                <!-- STATUS -->

                <div
                    id="statusMessage"
                    class="status-message">
                </div>


                <!-- BUTTONS -->

                <div class="form-actions">

                    <button
                        type="button"
                        id="cancelButton"
                        class="cancel-button"
                    >
                        Cancel
                    </button>


                    <button
                        type="submit"
                        id="saveButton"
                    >
                        Save Medical Record
                    </button>

                </div>


            </form>

        </section>

    </main>

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =====================================================
   SUPABASE CONFIG
===================================================== */

const SUPABASE_URL =
    "https://zltbjbbofvndxirlipf.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_MWH4JPfiiJ2gvIqYpKE_Yw_UAoAlnFJ";


const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        {
            auth: {
                persistSession: true,
                autoRefreshToken: true,
                detectSessionInUrl: true,
                storage: window.localStorage
            }
        }
    );


/* =====================================================
   VARIABLES
===================================================== */

let currentSession = null;

let currentClinic = null;

let patients = [];

let editingRecord = null;


/* =====================================================
   ELEMENTS
===================================================== */

const patientSearch =
    document.getElementById(
        "patientSearch"
    );

const patientResults =
    document.getElementById(
        "patientResults"
    );

const patientIdInput =
    document.getElementById(
        "patientId"
    );

const selectedPatient =
    document.getElementById(
        "selectedPatient"
    );

const recordForm =
    document.getElementById(
        "recordForm"
    );

const statusMessage =
    document.getElementById(
        "statusMessage"
    );

const saveButton =
    document.getElementById(
        "saveButton"
    );


/* =====================================================
   STATUS
===================================================== */

function showStatus(
    message,
    type = "loading"
) {

    statusMessage.textContent =
        message;

    statusMessage.className =
        "status-message status-" +
        type;

    statusMessage.style.display =
        "block";

}


/* =====================================================
   GET CURRENT CLINIC
===================================================== */

async function getCurrentClinic() {

    console.log(
        "Checking Supabase session..."
    );


    const {
        data,
        error
    } =
        await supabaseClient
            .auth
            .getSession();


    console.log(
        "Supabase session:",
        data?.session
    );


    if (error) {

        console.error(
            "Session error:",
            error
        );

        return null;
    }


    if (!data?.session) {

        console.error(
            "NO ACTIVE SUPABASE SESSION"
        );

        window.location.href =
            "login.html";

        return null;
    }


    currentSession =
        data.session;


    console.log(
        "Logged in user:",
        currentSession.user.id
    );


    const {
        data: membership,
        error: membershipError
    } =
        await supabaseClient
            .from("clinic_members")
            .select(`
                clinic_id,
                role,
                clinics (
                    id,
                    name
                )
            `)
            .eq(
                "user_id",
                currentSession.user.id
            )
            .maybeSingle();


    if (membershipError) {

        console.error(
            "Clinic lookup error:",
            membershipError
        );

        return null;
    }


    if (
        !membership ||
        !membership.clinics
    ) {

        console.error(
            "USER BELUM TERHUBUNG KE CLINIC"
        );

        return null;
    }


    currentClinic = {

        userId:
            currentSession.user.id,

        clinicId:
            membership.clinic_id,

        clinicName:
            membership.clinics.name,

        role:
            membership.role

    };


    console.log(
        "Current clinic:",
        currentClinic
    );


    return currentClinic;

}


/* =====================================================
   LOAD PATIENTS
===================================================== */

async function loadPatients() {

    console.log(
        "Loading patients..."
    );


    if (!currentClinic) {

        console.error(
            "Clinic belum tersedia."
        );

        return;
    }


    const {
        data,
        error
    } =
    await supabaseClient
        .from("patients")
        .select("*")
        .eq(
            "clinic_id",
            currentClinic.clinicId
        )
        .order(
            "name",
            {
                ascending: true
            }
        );


    if (error) {

        console.error(
            "Patients error:",
            error
        );

        showStatus(
            "Unable to load patients: " +
            error.message,
            "error"
        );

        return;
    }


    patients =
        data || [];


    console.log(
        "Patients loaded:",
        patients
    );


    /* URL patientId */

    const params =
        new URLSearchParams(
            window.location.search
        );


    const selectedPatientId =
        params.get(
            "patientId"
        );


    if (selectedPatientId) {

        const patient =
            patients.find(
                item =>
                    String(item.id) ===
                    String(selectedPatientId)
            );


        if (patient) {

            selectPatient(
                patient
            );

        }

    }

}


/* =====================================================
   PATIENT DISPLAY
===================================================== */

function getPatientName(patient) {

    return (
        patient.name ||
        patient.pet_name ||
        patient.patient_name ||
        "Unnamed Patient"
    );

}


function getPatientSpecies(patient) {

    return (
        patient.species ||
        "-"
    );

}


function getPatientOwner(patient) {

    return (
        patient.owner_name ||
        patient.owner ||
        patient.client_name ||
        "-"
    );

}


/* =====================================================
   SEARCH PATIENT
===================================================== */

patientSearch.addEventListener(
    "input",
    function() {

        const keyword =
            patientSearch.value
                .trim()
                .toLowerCase();


        patientResults.innerHTML =
            "";


        if (!keyword) {

            patientResults.style.display =
                "none";

            return;

        }


        const filtered =
            patients.filter(
                patient => {

                    const name =
                        String(
                            getPatientName(
                                patient
                            )
                        ).toLowerCase();

                    const species =
                        String(
                            getPatientSpecies(
                                patient
                            )
                        ).toLowerCase();

                    const owner =
                        String(
                            getPatientOwner(
                                patient
                            )
                        ).toLowerCase();


                    return (
                        name.includes(keyword) ||
                        species.includes(keyword) ||
                        owner.includes(keyword)
                    );

                }
            );


        if (!filtered.length) {

            const empty =
                document.createElement(
                    "div"
                );

            empty.className =
                "patient-result";

            empty.textContent =
                "No patient found.";

            patientResults.appendChild(
                empty
            );

            patientResults.style.display =
                "block";

            return;
        }


        filtered.forEach(
            patient => {

                const item =
                    document.createElement(
                        "div"
                    );

                item.className =
                    "patient-result";


                const name =
                    getPatientName(
                        patient
                    );

                const species =
                    getPatientSpecies(
                        patient
                    );

                const owner =
                    getPatientOwner(
                        patient
                    );


                item.innerHTML = `
                    <strong>${escapeHtml(name)}</strong>
                    <small>
                        ${escapeHtml(species)}
                        • Owner: ${escapeHtml(owner)}
                    </small>
                `;


                item.addEventListener(
                    "click",
                    function() {

                        selectPatient(
                            patient
                        );

                    }
                );


                patientResults.appendChild(
                    item
                );

            }
        );


        patientResults.style.display =
            "block";

    }
);


/* =====================================================
   SELECT PATIENT
===================================================== */

function selectPatient(patient) {

    patientIdInput.value =
        patient.id;


    patientSearch.value =
        getPatientName(
            patient
        );


    selectedPatient.innerHTML = `
        <strong>
            Selected:
        </strong>
        ${escapeHtml(getPatientName(patient))}
        • ${escapeHtml(getPatientSpecies(patient))}
        • Owner: ${escapeHtml(getPatientOwner(patient))}
    `;


    selectedPatient.style.display =
        "block";


    patientResults.style.display =
        "none";

}


/* =====================================================
   CLICK OUTSIDE SEARCH
===================================================== */

document.addEventListener(
    "click",
    function(event) {

        if (
            !event.target.closest(
                ".patient-search-wrapper"
            )
        ) {

            patientResults.style.display =
                "none";

        }

    }
);


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value) {

    return String(value ?? "")
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   GET VALUE
===================================================== */

function valueOf(id) {

    const element =
        document.getElementById(
            id
        );

    if (!element) {

        return null;

    }


    const value =
        element.value.trim();


    return value === ""
        ? null
        : value;

}


/* =====================================================
   SAVE MEDICAL RECORD
===================================================== */

recordForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        if (!currentClinic) {

            alert(
                "Clinic information belum tersedia."
            );

            return;

        }


        if (!patientIdInput.value) {

            alert(
                "Please select a patient."
            );

            patientSearch.focus();

            return;

        }


        saveButton.disabled =
            true;

        saveButton.textContent =
            "Saving...";


        showStatus(
            "Saving medical record...",
            "loading"
        );


        try {

            /*
             * SESUAI PERSIS DENGAN
             * DATABASE SUPABASE KAMU
             */

            const recordData = {

                clinic_id:
                    currentClinic.clinicId,

                patient_id:
                    patientIdInput.value,

                visit_date:
                    document.getElementById(
                        "visitDate"
                    ).value,

                chief_complaint:
                    valueOf(
                        "chiefComplaint"
                    ),

                subjective:
                    valueOf(
                        "subjective"
                    ),

                objective:
                    valueOf(
                        "objective"
                    ),

                assessment:
                    valueOf(
                        "assessment"
                    ),

                plan:
                    valueOf(
                        "plan"
                    ),

                diagnosis:
                    valueOf(
                        "diagnosis"
                    ),

                treatment:
                    valueOf(
                        "treatment"
                    ),

                medication:
                    valueOf(
                        "medication"
                    ),

                procedure:
                    valueOf(
                        "procedure"
                    ),

                notes:
                    valueOf(
                        "notes"
                    ),

                follow_up_date:
                    valueOf(
                        "followUpDate"
                    ),

                updated_at:
                    new Date().toISOString()

            };


            console.log(
                "Saving medical record:",
                recordData
            );


            let result;


            if (editingRecord) {

                result =
                    await supabaseClient
                        .from("medical_records")
                        .update(
                            recordData
                        )
                        .eq(
                            "id",
                            editingRecord.id
                        )
                        .select()
                        .single();

            }
            else {

                result =
                    await supabaseClient
                        .from("medical_records")
                        .insert(
                            recordData
                        )
                        .select()
                        .single();

            }


            if (result.error) {

                console.error(
                    "Medical record save error:",
                    result.error
                );

                throw result.error;

            }


            console.log(
                "Medical record saved:",
                result.data
            );


            showStatus(
                editingRecord
                    ? "Medical record updated successfully."
                    : "Medical record saved successfully.",
                "success"
            );


            setTimeout(
                function() {

                    window.location.href =
                        "medical-records.html";

                },
                800
            );


        }
        catch (error) {

            console.error(
                "SAVE ERROR:",
                error
            );


            showStatus(
                "Failed to save medical record: " +
                error.message,
                "error"
            );


            alert(
                "Failed to save medical record:\n\n" +
                error.message
            );


            saveButton.disabled =
                false;

            saveButton.textContent =
                "Save Medical Record";

        }

    }
);


/* =====================================================
   CANCEL
===================================================== */

document.getElementById(
    "cancelButton"
).addEventListener(
    "click",
    function() {

        window.location.href =
            "medical-records.html";

    }
);


/* =====================================================
   DEFAULT DATE
===================================================== */

document.getElementById(
    "visitDate"
).value =
new Date()
    .toISOString()
    .split("T")[0];


/* =====================================================
   INITIALIZE
===================================================== */

async function initialize() {

    try {

        const clinic =
            await getCurrentClinic();


        if (!clinic) {

            showStatus(
                "Unable to load clinic information. Please make sure you are logged in.",
                "error"
            );

            return;

        }


        await loadPatients();


    }
    catch (error) {

        console.error(
            "Initialization error:",
            error
        );

        showStatus(
            "Initialization failed: " +
            error.message,
            "error"
        );

    }

}


initialize();

</script>

</body>

</html>
